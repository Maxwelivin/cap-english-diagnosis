 {"id": "112-26", "year": "112", "no": 26, "group": "26-27", "stem": "According to the notes, which is the WRONG way to help a baby bird that is out of its nest?", "options": {"A": "Feed it before you take it to a hospital.", "B": "Leave it alone if it is not hurt and has feathers.", "C": "Call the animal center if you can’t find its nest.", "D": "Put it back in its nest if it is not hurt and has few feathers."}, "ans": "A", "tags": ["r_detail", "r_not"], "ex": "筆記寫 don't give it any food → 先餵食是錯的。", "trap": "WRONG 題：要找「錯誤」的做法。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.6524, "disc": 0.71, "basic": 0.6841, "weak": 0.1916}, "opts": {"A": {"all": 65.24, "basic": 68.41, "weak": 19.16}, "B": {"all": 10.04, "basic": 8.52, "weak": 24.55}, "C": {"all": 14.29, "basic": 13.2, "weak": 32.92}, "D": {"all": 10.31, "basic": 9.85, "weak": 22.89}}, "note": null}, {"id": "112-27", "year": "112", "no": 27, "group": "26-27", "stem": "According to the notes, what do birds do if their babies have the smell of people on them?", "options": {"A": "They keep taking care of them.", "B": "They push them out of the nest.", "C": "They clean them until the smell goes away.", "D": "They leave them behind and move to a new nest."}, "ans": "A", "tags": ["r_detail"], "ex": "筆記：People believe birds will give up their babies… → WRONG! Birds don't care! → 鳥會繼續照顧。", "trap": "B／D 是「人們以為」的說法，但筆記標了 WRONG。", "goal": "推論文中隱含的訊息", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5646, "disc": 0.64, "basic": 0.5051, "weak": 0.2033}, "opts": {"A": {"all": 56.46, "basic": 50.51, "weak": 20.33}, "B": {"all": 16.64, "basic": 21.09, "weak": 25.75}, "C": {"all": 11.51, "basic": 10.31, "weak": 27.16}, "D": {"all": 15.25, "basic": 18.04, "weak": 26.27}}, "note": null}, {"id": "112-28", "year": "112", "no": 28, "group": "28-29", "stem": "According to the reading, which is one of the reasons for food waste?", "options": {"A": "Stores do not know how to pack food well.", "B": "Farmers do not have enough machines to collect food.", "C": "There is no refrigerator on the truck to keep food fresh.", "D": "Factories do not have enough trucks to carry food to stores."}, "ans": "C", "tags": ["r_detail"], "ex": "Stage 2 On the road：Do not have refrigerators to keep food fresh → C。", "trap": "B 把 Stage 3（工廠缺機器）放錯階段。", "goal": "在圖表中找出所需的資訊", "perf": "3-Ⅳ-4", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.6695, "disc": 0.61, "basic": 0.6859, "weak": 0.2733}, "opts": {"A": {"all": 10.2, "basic": 9.88, "weak": 22.1}, "B": {"all": 12.37, "basic": 11.56, "weak": 27.75}, "C": {"all": 66.95, "basic": 68.59, "weak": 27.33}, "D": {"all": 10.33, "basic": 9.91, "weak": 22.32}}, "note": null}, {"id": "112-29", "year": "112", "no": 29, "group": "28-29", "stem": "Which is true about food waste at each stage in the three parts of the world?", "options": {"A": "For each area, the highest percentage of food waste happens at Stage 5.", "B": "Europe has a lower percentage of food waste at Stage 3 than the other two areas.", "C": "North America & Oceania has a higher percentage of food waste at Stage 1 than Europe.", "D": "South & Southeast Asia has a higher percentage of food waste at Stage 4 than the other two areas."}, "ans": "D", "tags": ["r_picture"], "ex": "Stage 4：南亞與東南亞 4.6%，高於北美 2.4% 和歐洲 2.2% → D。", "trap": "A：南亞最高的是 Stage 2，不是每個地區都是 Stage 5 最高。", "goal": "在圖表中找出所需的資訊", "perf": "3-Ⅳ-4", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.6302, "disc": 0.68, "basic": 0.6376, "weak": 0.2037}, "opts": {"A": {"all": 11.88, "basic": 11.83, "weak": 25.59}, "B": {"all": 12.25, "basic": 12.7, "weak": 24.21}, "C": {"all": 12.7, "basic": 11.65, "weak": 29.34}, "D": {"all": 63.02, "basic": 63.76, "weak": 20.37}}, "note": null}, {"id": "112-30", "year": "112", "no": 30, "group": "30-32", "stem": "What is the trick that the mosquito uses in rain?", "options": {"A": "It shakes its body fast enough to get water off.", "B": "It drops with the raindrop and then rolls off it.", "C": "It flies behind the raindrop and pushes it away.", "D": "It rides on the raindrop and lands on the ground."}, "ans": "B", "tags": ["r_detail"], "ex": "被雨滴打中時跟著雨滴一起往下掉，約 6 公分後滾開飛走 → B。", "trap": "", "goal": "掌握上下文意了解文章中的句法連貫：代詞指涉", "perf": "3-Ⅳ-8", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.613, "disc": 0.61, "basic": 0.5853, "weak": 0.246}, "opts": {"A": {"all": 11.29, "basic": 11.97, "weak": 21.85}, "B": {"all": 61.3, "basic": 58.53, "weak": 24.6}, "C": {"all": 17.32, "basic": 20.09, "weak": 30.62}, "D": {"all": 9.89, "basic": 9.29, "weak": 22.34}}, "note": null}, {"id": "112-31", "year": "112", "no": 31, "group": "30-32", "stem": "What keeps a mosquito safe in the rain?", "options": {"A": "It is very light.", "B": "It has no body hairs.", "C": "It is as big as a raindrop.", "D": "It is strong enough to fight the force of a raindrop."}, "ans": "A", "tags": ["r_detail"], "ex": "it is much lighter — 0.002 g only. This saves its life → 很輕。", "trap": "C：體型和雨滴一樣大是事實，但救牠的是「輕」。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-8", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5835, "disc": 0.67, "basic": 0.5558, "weak": 0.1817}, "opts": {"A": {"all": 58.35, "basic": 55.58, "weak": 18.17}, "B": {"all": 10.37, "basic": 10.16, "weak": 22.17}, "C": {"all": 16.21, "basic": 17.25, "weak": 31.78}, "D": {"all": 14.93, "basic": 16.96, "weak": 27.36}}, "note": null}, {"id": "112-32", "year": "112", "no": 32, "group": "30-32", "stem": "When would it be dangerous for a mosquito in the rain?", "options": {"A": "When it flies too close to the ground.", "B": "When the rain falls too hard and too fast.", "C": "When it is hit by raindrops too many times.", "D": "When it drops for more than 6 cm in the rain."}, "ans": "A", "tags": ["r_detail"], "ex": "If the mosquito flies too low… it will hit the ground → 飛得太低就危險。", "trap": "B：雨大是開頭的情境，不是蚊子死掉的原因。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-8", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.512, "disc": 0.63, "basic": 0.412, "weak": 0.1982}, "opts": {"A": {"all": 51.2, "basic": 41.2, "weak": 19.82}, "B": {"all": 17.23, "basic": 21.29, "weak": 26.91}, "C": {"all": 14.5, "basic": 16.26, "weak": 27.11}, "D": {"all": 16.92, "basic": 21.19, "weak": 25.64}}, "note": null}, {"id": "112-33", "year": "112", "no": 33, "group": "33-35", "stem": "What do the three stories in the reading all talk about?", "options": {"A": "Who Beethoven’s true love was.", "B": "Who played “For Elise” the best.", "C": "How “For Elise” became popular.", "D": "Why Beethoven wrote “For Elise.”"}, "ans": "D", "tags": ["r_main"], "ex": "三個說法都在說貝多芬為了誰、為什麼寫這首曲子 → D。", "trap": "A：只有第二個故事和戀人有關。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-12", "cont": "D-Ⅳ-2", "rate": {"all": 0.6566, "disc": 0.64, "basic": 0.6819, "weak": 0.2309}, "opts": {"A": {"all": 10.67, "basic": 10.61, "weak": 21.65}, "B": {"all": 10.14, "basic": 7.71, "weak": 26.51}, "C": {"all": 13.38, "basic": 13.44, "weak": 28.24}, "D": {"all": 65.66, "basic": 68.19, "weak": 23.09}}, "note": null}, {"id": "112-34", "year": "112", "no": 34, "group": "33-35", "stem": "What do we know about “For Elise” from the reading?", "options": {"A": "It first appeared in the opera Fidelio.", "B": "The true “Elise” was Elise Barensfeld.", "C": "The manuscript was found after Beethoven died.", "D": "The manuscript is now kept by the city of Vienna."}, "ans": "C", "tags": ["r_detail"], "ex": "The manuscript was found in 1867… 40 years after Beethoven's death → C。", "trap": "A：Röckel 曾在歌劇 Fidelio 演唱，但曲子不是在那裡首次出現。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-8", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.6283, "disc": 0.63, "basic": 0.6095, "weak": 0.2502}, "opts": {"A": {"all": 13.66, "basic": 15.61, "weak": 24.82}, "B": {"all": 13.63, "basic": 13.89, "weak": 28.54}, "C": {"all": 62.83, "basic": 60.95, "weak": 25.02}, "D": {"all": 9.73, "basic": 9.49, "weak": 21.11}}, "note": null}, {"id": "112-35", "year": "112", "no": 35, "group": "33-35", "stem": "What can we learn about the three women from the stories?", "options": {"A": "They were called “Elise” by their friends.", "B": "Elisabeth Röckel was a close friend of Beethoven’s.", "C": "Therese Malfatti changed “For Elise” to “For Therese.”", "D": "Elise Barensfeld was Beethoven’s student."}, "ans": "B", "tags": ["r_detail"], "ex": "Röckel 和貝多芬 became very good friends → B。", "trap": "D：Barensfeld 是 Malfatti 的學生，不是貝多芬的學生。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-8", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5646, "disc": 0.59, "basic": 0.4941, "weak": 0.2427}, "opts": {"A": {"all": 15.57, "basic": 19.84, "weak": 24.0}, "B": {"all": 56.46, "basic": 49.41, "weak": 24.27}, "C": {"all": 16.77, "basic": 18.93, "weak": 31.27}, "D": {"all": 11.02, "basic": 11.73, "weak": 19.91}}, "note": null}, {"id": "112-36", "year": "112", "no": 36, "group": "36-38", "stem": "What idea does Jesse Cohen talk about in the reading?", "options": {"A": "Not all kinds of toys are helpful for children’s learning.", "B": "Parents should give their children the right toys for their age.", "C": "Children should learn about their gender from playing with toys.", "D": "We should not let gender decide which toys children can play with."}, "ans": "D", "tags": ["r_main", "r_author"], "ex": "作者主張孩子是看別人才學會「男生玩這個、女生玩那個」，這對孩子不好 → 不該讓性別決定孩子玩什麼。", "trap": "C 剛好和作者的主張相反。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-8", "rate": {"all": 0.6675, "disc": 0.69, "basic": 0.7096, "weak": 0.2055}, "opts": {"A": {"all": 8.42, "basic": 6.91, "weak": 21.08}, "B": {"all": 11.1, "basic": 9.6, "weak": 26.67}, "C": {"all": 13.55, "basic": 12.42, "weak": 31.15}, "D": {"all": 66.75, "basic": 70.96, "weak": 20.55}}, "note": null}, {"id": "112-37", "year": "112", "no": 37, "group": "36-38", "stem": "In the third paragraph, why does Jesse Cohen think “this rule can be bad for children”?", "options": {"A": "Children may not want to share their toys with others.", "B": "Children may have the wrong idea about following rules.", "C": "Children may not be able to learn from playing with toys.", "D": "Children may miss the chance to find out what they really like."}, "ans": "D", "tags": ["r_detail"], "ex": "If they only play one kind of toy, they may lose this important chance（發現自己興趣和長處的機會）→ D。", "trap": "B：rule 指「看別人怎麼玩就跟著玩」，不是說孩子會誤解規則。", "goal": "做出正確的結論", "perf": "3-Ⅳ-15", "cont": "Ae-Ⅳ-7", "rate": {"all": 0.5911, "disc": 0.62, "basic": 0.585, "weak": 0.2028}, "opts": {"A": {"all": 8.95, "basic": 7.36, "weak": 22.53}, "B": {"all": 16.02, "basic": 17.84, "weak": 26.35}, "C": {"all": 15.74, "basic": 16.2, "weak": 30.28}, "D": {"all": 59.11, "basic": 58.5, "weak": 20.28}}, "note": null}, {"id": "112-38", "year": "112", "no": 38, "group": "36-38", "stem": "In the reading, after Jesse Cohen talks about an idea, he often gives an example to make it clear. Below are four of the sentences in the third paragraph. Which is used as an example?", "options": {"A": "“However, this rule can be bad for children.”", "B": "“Dolls help with their early language use, and building toys are good for learning math and science.”", "C": "“Some doctors worry that children may use the same kind of thinking when they look for jobs in the future.”", "D": "“If they do, they may miss something more important than just getting a chance to play with different toys.”"}, "ans": "B", "tags": ["r_author"], "ex": "Different toys teach children different things 是觀點，後面的 Dolls help… building toys are good for… 是舉例 → B。", "trap": "D 是延伸推論，不是例子。", "goal": "指出文意結構", "perf": "3-Ⅳ-15", "cont": "Ae-Ⅳ-7", "rate": {"all": 0.4447, "disc": 0.43, "basic": 0.3686, "weak": 0.2217}, "opts": {"A": {"all": 13.53, "basic": 14.66, "weak": 25.65}, "B": {"all": 44.47, "basic": 36.86, "weak": 22.17}, "C": {"all": 19.91, "basic": 21.59, "weak": 26.34}, "D": {"all": 21.89, "basic": 26.76, "weak": 25.28}}, "note": null}, {"id": "112-39", "year": "112", "no": 39, "group": "39-41", "stem": "What is the reading mostly about?", "options": {"A": "Marie Colvin’s war reports.", "B": "Marie Colvin’s working life.", "C": "Marie Colvin’s schooldays at Yale.", "D": "Marie Colvin’s experiences in Homs."}, , "group": null, "stem": "Don’t let the children swim in the river. We don’t know how ____ it is. It could be dangerous.", "options": {"A": "deep", "B": "far", "C": "long", "D": "thick"}, "ans": "A", "tags": ["v_adj"], "ex": "別讓孩子在河裡游泳，不知道河水有多深：how deep。", "trap": "long／far 不是判斷游泳危險與否的關鍵。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.6963, "disc": 0.69, "basic": 0.7664, "weak": 0.2016}, "opts": {"A": {"all": 69.63, "basic": 76.64, "weak": 20.16}, "B": {"all": 8.36, "basic": 6.88, "weak": 20.96}, "C": {"all": 14.08, "basic": 10.4, "weak": 38.01}, "D": {"all": 7.83, "basic": 6.05, "weak": 20.47}}, "note": null}, {"id": "111-10", "year": "111", "no": 10, "group": null, "stem": "Bob is ____ of the boys in the family. He never does any housework. His brothers at least take out the garbage sometimes.", "options": {"A": "lazier", "B": "the lazy", "C": "the lazier", "D": "the laziest"}, "ans": "D", "tags": ["g_compare"], "ex": "of the boys in the family（家裡所有男孩之中）→ 三者以上比較用最高級：the laziest。", "trap": "the lazier 用於兩者之間比較；他還有好幾個兄弟。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.6983, "disc": 0.7, "basic": 0.7879, "weak": 0.1699}, "opts": {"A": {"all": 9.82, "basic": 7.46, "weak": 26.01}, "B": {"all": 10.21, "basic": 6.1, "weak": 30.73}, "C": {"all": 10.04, "basic": 7.62, "weak": 25.85}, "D": {"all": 69.83, "basic": 78.79, "weak": 16.99}}, "note": null}, {"id": "111-11", "year": "111", "no": 11, "group": null, "stem": "Aunt Gina has lived in this town for more than sixty years, so she ____ it very well.", "options": {"A": "will know", "B": "knew", "C": "knows", "D": "was going to know"}, "ans": "C", "tags": ["g_tense"], "ex": "住了六十多年，所以現在「很熟悉」這個小鎮 → 簡單現在式 knows（know 表狀態）。", "trap": "knew 是過去式，但她現在還住在那裡。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.6357, "disc": 0.57, "basic": 0.6533, "weak": 0.2463}, "opts": {"A": {"all": 8.69, "basic": 5.48, "weak": 25.55}, "B": {"all": 17.7 rate": {"all": 0.5231, "disc": 0.56, "basic": 0.4532, "weak": 0.2227}, "opts": {"A": {"all": 11.75, "basic": 11.63, "weak": 23.61}, "B": {"all": 17.55, "basic": 19.27, "weak": 31.32}, "C": {"all": 52.31, "basic": 45.32, "weak": 22.27}, "D": {"all": 18.26, "basic": 23.73, "weak": 22.36}}, "note": null}, {"id": "111-15", "year": "111", "no": 15, "group": null, "stem": "Have you found a summer job yet? Mr. Firth ____ someone to take care of his kids during the vacation. Maybe you can talk to him.", "options": {"A": "has looked for", "B": "is looking for", "C": "looks for", "D": "was looking for"}, "ans": "B", "tags": ["g_tense"], "ex": "暑假還沒到，Firth 先生「現在正在」找人顧小孩 → 現在進行式 is looking for。", "trap": "has looked for 不常用來表示「目前正在找」。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5834, "disc": 0.59, "basic": 0.5495, "weak": 0.2409}, "opts": {"A": {"all": 16.87, "basic": 20.7, "weak": 24.63}, "B": {"all": 58.34, "basic": 54.95, "weak": 24.09}, "C": {"all": 11.9, "basic": 9.93, "weak": 28.99}, "D": {"all": 12.76, "basic": 14.37, "weak": 21.83}}, "note": null}, {"id": "111-16", "year": "111", "no": 16, "group": null, "stem": "David looked out of the balcony window and saw a woman get in his car ____ away.", "options": {"A": "drive", "B": "drove", "C": "and drive", "D": "and drove"}, "ans": "C", "tags": ["g_verbform", "g_conj"], "ex": "感官動詞 saw + 受詞 + 原形動詞：saw a woman get in his car and drive away（兩個原形動詞用 and 連接）。", "trap": "and drove：drove 不和前面的原形 get 對稱；四成以上選它。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.3323, "disc": 0.28, "basic": 0.2577, "weak": 0.222}, "opts": {"A": {"all": 13.98, "basic": 12.32, "weak": 30.35}, "B": {"all": 16.96, "basic": 18.97, "weak": 28.7}, "C": {"all": 33.23, "basic": 25.77, "weak": 22.2}, "D": {"all": 35.71, "basic": 42.92, "weak": 18.29}}, "note": null}, {"id": "111-17", "year": "111", "no": 17, "group": null, "stem": "The police haven’t found the little girl who ____ at a supermarket. They’ll keep doing all they can to find her.", "options": {"A": "took away", "B": "taken away", "C": "has taken away", "D": "was taken away"}, "ans": "D", "tags": ["g_passive", "g_relative"], "ex": "小女孩是「被」帶走的 → 被動：who was taken away。", "trap": "has taken away 是主動，變成「小女孩帶走了別人」。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.4915, "disc": 0.55, "basic": 0.4136, "weak": 0.1916}, "opts": {"A": {"all": 15.34, "basic": 18.93, "weak": 21.13}, "B": {"all": 12.73, "basic": 12.12, "weak": 27.52}, "C": {"all": 22.65, "basic": 27.55, "weak": 31.72}, "D": {"all": 49.15, "basic": 41.36, "weak": 19.16}}, "note": null}, {"id": "111-18", "year": "111", "no": 18, "group": null, "stem": "Buses to the airport only come once every hour, and we just missed ____ . Why don’t we take a taxi?", "options": {"A": "another", "B": "it", "C": "one", "D": "them"}, "ans": "C", "tags": ["g_pron"], "ex": "公車一小時一班，我們剛錯過「一班」（不特定的一輛）→ one。", "trap": "it 會指特定那一班；這裡是說錯過了一班公車，所以用 one。一半的人選 it。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.3097, "disc": 0.24, "basic": 0.2666, "weak": 0.1935}, "opts": {"A": {"all": 8.86, "basic": 6.71, "weak": 23.29}, "B": {"all": 42.28, "basic": 49.98, "weak": 27.3}, "C": {"all": 30.97, "basic": 26.66, "weak": 19.35}, "D": {"all": 17.77, "basic": 16.62, "weak": 29.6}}, "note": null}, {"id": "111-19", "year": "111", "no": 19, "group": null, "stem": "Ariel ____ every night for a week before her Chinese test and got a very good grade.", "options": {"A": "studied", "B": "studies", "C": "has studied", "D": "was going to study"}, "ans": "A", "tags": ["g_tense"], "ex": "考試前一週每晚讀書，而且已經拿到好成績 → 都是過去的事：studied。", "trap": "has studied：got a very good grade 已經是過去式，前面也要用過去式。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.3497, "disc": 0.31, "basic": 0.2899, "weak": 0.2019}, "opts": {"A": {"all": 34.97, "basic": 28.99, "weak": 20.19}, "B": {"all": 21.85, "basic": 27.12, "weak": 27.56}, "C": {"all": 33.54, "basic": 35.62, "weak": 29.62}, "D": {"all": 9.53, "basic": 8.25, "weak": 22.19}}, "note": null}, {"id": "111-20", "year": "111", "no": 20, "group": null, "stem": "While reading this story, Brad saw the word “trolling” and didn’t know what it meant. Josh turned off the screen and sat back. “Why are they trolling me like this?” He didn’t understand. They wanted him to share what he thought about the show, and he did. And now look what he got. In the end, all they wanted was nice words. He found several meanings of the word in a dictionary. Which one should Brad choose?", "options": {"A": "To celebrate in song.", "B": "To make someone or something move around.", "C": "To pull a fishing line through the water, often from a boat.", "D": "To write something on the Internet to hurt someone or make them angry."}, "ans": "D", "tags": ["r_wordguess"], "ex": "Josh 分享自己的想法後，「他們」卻只想聽好話，讓他不開心 → trolling＝在網路上發文惹怒或傷害別人。", "trap": "B／C 是字典裡的其他意思，要選符合上下文的那一個。", "goal": "指出適合句中的單字或片語（單題）", "perf": "7-Ⅳ-1", "cont": "D-Ⅳ-1", "rate": {"all": 0.5249, "disc": 0.58, "basic": 0.4714, "weak": 0.1985}, "opts": {"A": {"all": 11.82, "basic": 12.71, "weak": 22.08}, "B": {"all": 21.52, "basic": 26.59, "weak": 28.66}, "C": {"all": 14.0, "basic": 13.48, "weak": 28.92}, "D": {"all": 52.49, "basic": 47.14, "weak": 19.85}}, "note": null}, {"id": "111-21", "year": "111", "no": 21, "group": "21-22", "stem": "What does Tea-Rock celebrate?", "options": {"A": "Their sales in 20 countries.", "B": "The coming out of their 20th kind of tea.", "C": "Their 20th year of business.", "D": "The opening of their 20th store in the USA."}, "ans": "C", "tags": ["r_detail"], "ex": "Thank You for Being with Us for Twenty Summers & Winters → 慶祝成立第 20 年。", "trap": "D：文中沒有說在美國開了 20 家店。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-11", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.6214, "disc": 0.69, "basic": 0.6207, "weak": 0.2079}, "opts": {"A": {"all": 9.11, "basic": 6.88, "weak": 24.23}, "B": {"all": 14.63, "basic": 14.8 ublic of Cameroon → 1962 年是一個合併後的國家。", "trap": "要依年代判斷：1962 年已經合併，不再分成兩國。", "goal": "用圖表表徵文意", "perf": "3-Ⅳ-9", "cont": "Ae-Ⅳ-6", "rate": {"all": 0.5728, "disc": 0.62, "basic": 0.5448, "weak": 0.1983}, "opts": {"A": {"all": 6.27, "basic": 4.16, "weak": 17.96}, "B": {"all": 18.38, "basic": 21.07, "weak": 31.89}, "C": {"all": 17.89, "basic": 20.22, "weak": 29.76}, "D": {"all": 57.28, "basic": 54.48, "weak": 19.83}}, "note": null, "img": "y111_q33", "imgFull": true}, {"id": "111-34", "year": "111", "no": 34, "group": "33-36", "stem": "What does resentful mean in the reading?", "options": {"A": "Sad.", "B": "Angry.", "C": "Careful.", "D": "Worried."}, "ans": "B", "tags": ["r_wordguess"], "ex": "覺得在自己國家不受歡迎、決定為自己抗爭 → resentful＝憤恨的。", "trap": "worried／sad 都不會導致「決定抗爭、建國」。", "goal": "根據上下文意猜測字詞的意義", "perf": "3-Ⅳ-12", "cont": "C-Ⅳ-2", "rate": {"all": 0.6124, "disc": 0.62, "basic": 0.6089, "weak": 0.2281}, "opts": {"A": {"all": 9.96, "basic": 8.45, "weak": 22.42}, "B": {"all": 61.24, "basic": 60.89, "weak": 22.81}, "C": {"all": 14.93, "basic": 14.54, "weak": 31.37}, "D": {"all": 13.73, "basic": 16.06, "weak": 22.88}}, "note": null}, {"id": "111-35", "year": "111", "no": 35, "group": "33-36", "stem": "What does Cameroon’s government most likely think of Ambazonia?", "options": {"A": "It plans to do business with Ambazonia.", "B": "It needs Ambazonia for money and help.", "C": "It does not want to be part of Ambazonia.", "D": "It does not agree that Ambazonia is a country."}, "ans": "D", "tags": ["r_infer"], "ex": "他們宣布獨立時，警察去阻止集會 → 政府不承認 Ambazonia 是一個國家。", "trap": "C 把主客對調了：是 Ambazonia 不想屬於喀麥隆。", "goal": "推論文中隱含的訊息", "perf": "3-Ⅳ-12", "cont": "C-Ⅳ-2", "rate": {"all": 0.5804, "disc": 0.62, "basic": 0.5354, "weak": 0.229}, "opts": {"A": {"all": 13.02, "basic": 14.75, "weak": 23.49}, "B": {"all": 11.23, "basic": 10.05, "weak": 26.34}, "C": {"all": 17.53, "basic": 21.57, "weak": 26.73}, "D": {"all": 58.04, "basic": 53.54, "weak": 22.9}}, "note": null}, {"id": "111-36", "year": "11 C": "it makes", "D": "me steak"}, "ans": "C", "tags": ["r_cloze"], "ex": "mistake 的字母重新排列：i, t, m, a, k, e, s → it makes。", "trap": "其他選項的字母數量或種類對不上（例如 take sit 有兩個 t）。", "goal": "根據上下文辨認符合文意的字句（克漏字）", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-1", "rate": {"all": 0.756, "disc": 0.52, "basic": 0.8011, "weak": 0.399}, "opts": {"A": {"all": 9.69, "basic": 8.85, "weak": 21.53}, "B": {"all": 6.74, "basic": 3.75, "weak": 20.84}, "C": {"all": 75.6, "basic": 80.11, "weak": 39.9}, "D": {"all": 7.71, "basic": 7.12, "weak": 16.98}}, "note": null, "cloze": true}, {"id": "111-42", "year": "111", "no": 42, "group": "40-43", "stem": "", "options": {"A": "strange", "B": "difficult", "C": "delicious", "D": "important"}, "ans": "A", "tags": ["r_cloze"], "ex": "restaurant 變成 Eat rats, run!（吃老鼠，快跑）→ 意思很奇怪：strange。", "trap": "difficult 不是這個例子要表達的效果。", "goal": "根據上下文辨認符合文意的字句（克漏字）", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-1", "rate": {"all": 0.5376, "disc": 0.64, "basic": 0.4846, "weak": 0.1907}, "opts": {"A": {"all": 53.76, "basic": 48.46, "weak": 19.07}, "B": {"all": 23.55, "basic": 30.25, "weak": 32.2}, "C": {"all": 9.94, "basic": 8.06, "weak": 24.77}, "D": {"all": 12.44, "basic": 13.01, "weak": 23.16}}, "note": null, "cloze": true}, {"id": "111-43", "year": "111", "no": 43, "group": "40-43", "stem": "", "options": {"A": "more than just games", "B": "often played in public", "C": "not so popular as before", "D": "not first used to learn words"}, "ans": "A", "tags": ["r_cloze"], "ex": "後文說可用來學數學、作曲、隱藏研究成果 → 不只是遊戲：more than just games。", "trap": "", "goal": "根據上下文辨認符合文意的字句（克漏字）", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-1", "rate": {"all": 0.434, "disc": 0.41, "basic": 0.3443, "weak": 0.2189}, "opts": {"A": {"all": 43.4, "basic": 34.43, "weak": 21.89}, "B": {"all": 23.06, "basic": 28.27, "weak": 27.11}, "C": {"all": 11.36, "basic": 10.55, "weak": 24.97}, "D": {"all": 21.34, "basic": 26.06, "weak": 23.89}}, "note": null, "cloze": true}], "groups": {"21-22": {"title": "Tea-Rock 二十週年抽獎活動", "kind": "img", "img": "y111_g21"}, "23-24": {"title": "Dangerously Sweet: Sugar（資訊圖表）", "kind": "img", "img": "y111_g23"}, "25-26": {"title": "Darrell 與 Marina 的對話", "kind": "img", "img": "y111_g25"}, "27-29": {"title": "Tabata 訓練", "kind": "img", "img": "y111_g27"}, "30-32": {"title": "No Overtime Day（報導＋兩張圖）", "kind": "img", "img": "y111_g30"}, "33-36": {"title": "Language and Power: Cameroon's Story", "kind": "img", "img": "y111_g33"}, "37-39": {"title": "Southend Trail 步道指南＋地圖", "kind": "img", "img": "y111_g37"}, "40-43": {"title": "回文與重組字（克漏字）", "kind": "img", "img": "y111_g40"}}}, "110": {"items": [{"id": "110-01", "year": "110", "no": 1, "group": null, "stem": "In the picture, the boy is ____ the old man.", "options": {"A": "smiling at", "B": "dancing with", "C": "cheering for", "D": "bowing to"}, "ans": "D", "tags": ["r_picture", "v_verb"], "ex": "圖中男孩彎腰向老人鞠躬：bow to。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.77}, "opts": null, "note": null, "img": "y110_q1", "imgFull": true}, {"id": "110-02", "year": "110", "no": 2, "group": null, "stem": "Listen! The baby ____ in the bedroom. Why don’t you go in and take a look?", "options": {"A": "cried", "B": "cries", "C": "is crying", "D": "will cry"}, "ans": "C", "tags": ["g_tense"], "ex": "Listen!（你聽！）表示此刻正在發生 → 現在進行式 is crying。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.84}, "opts": null, "note": null}, {"id": "110-03", "year": "110", "no": 3, "group": null, "stem": "Jill is ____ that the city park is closed for the music festival because now she can’t jog there.", "options": {"A": "excited", "B": "proud", "C": "scared", "D": "unhappy"}, "ans": "D", "tags": ["v_adj"], "ex": "公園因音樂節關閉，她不能去慢跑 → 不開心：unhappy。", "trap": "excited 與「不能慢跑」的結果相反。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.75}, "opts": null, "note": null}, {"id": "110-04", "year": "110", "no": 4, "group": null, "stem": "Steven wants to be a ____ , because he loves to watch people enjoy the food he prepares.", "options": {"A": "cook", "B": "doctor", "C": "driver", "D": "farmer"}, "ans": "A", "tags": ["v_noun"], "ex": "喜歡看別人享用他準備的食物 → 想當廚師：cook。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.86}, "opts": null, "note": null}, {"id": "110-05", "year": "110", "no": 5, "group": null, "stem": "Paul misses his parents a lot. He ____ them since he came to work in Taiwan a year ago.", "options": {"A": "didn’t see", "B": "doesn’t see", "C": "hasn’t seen", "D": "won’t see"}, "ans": "C", "tags": ["g_tense"], "ex": "since he came… a year ago（從一年前來台灣到現在）→ 現在完成式否定：hasn't seen。", "trap": "didn't see 不能接 since 表示「一直到現在」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.67}, "opts": null, "note": null}, {"id": "110-06", "year": "110", "no": 6, "group": null, "stem": "Our teacher Ms. Wu seldom laughs, but when she ____ , everyone in the same building can hear her.", "options": {"A": "can", "B": "does", "C": "has", "D": "will"}, "ans": "B", "tags": ["g_aux"], "ex": "前面說 she seldom laughs，後面用助動詞 does 代替 laughs：when she does（當她笑的時候）。", "trap": "can／will 改變了語意，而且原句沒有這些助動詞。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.73}, "opts": null, "note": null}, {"id": "110-07", "year": "110", "no": 7, "group": null, "stem": "My sister is coming to my home today. She ____ with me for a week.", "options": {"A": "stays", "B": "stayed", "C": "has stayed", "D": "will stay"}, "ans": "D", "tags": ["g_tense"], "ex": "姊姊今天才要來，接下來會住一週 → 未來式 will stay。", "trap": "has stayed 表示已經住了，但她今天才來。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.7}, "opts": null, "note": null}, {"id": "110-08", "year": "110", "no": 8, "group": null, "stem": "Edward had worked as a computer engineer for ten years. This ____ helped him a lot when he started his own computer shop.", "options": {"A": "chance", "B": "experience", "C": "hobby", "D": "knowledge"}, "ans": "B", "tags": ["v_noun"], "ex": "當了十年電腦工程師，這段「經驗」幫他開店 → experience。", "trap": "knowledge 也說得通一部分，但 This 指的是「十年的工作」，那是經驗。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null}, {"id": "110-09", "year": "110", "no": 9, "group": null, "stem": "If you’re interested in our business plan, ____ this number and ask for Ms. Lee. She’ll answer your questions.", "options": {"A": "calling", "B": "call", "C": "and call", "D": "to call"}, "ans": "B", "tags": ["g_verbform"], "ex": "If 子句之後是祈使句（請對方打電話）→ 原形動詞 call。", "trap": "and call：If 子句和主要子句之間不能用 and 連接。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "110-10", "year": "110", "no": 10, "group": null, "stem": "Jimmy would not get up for breakfast, ____ his dad had already tried to pull him from his bed several times.", "options": {"A": "although", "B": "because", "C": "if", "D": "until"}, "ans": "A", "tags": ["g_conj"], "ex": "爸爸已經拉他好幾次，他還是不起床 → 讓步：although。", "trap": "because 會變成「因為爸爸拉他，所以不起床」，邏輯不通。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.47}, "opts": null, "note": null}, {"id": "110-11", "year": "110", "no": 11, "group": null, "stem": "Duncan spent all his money trying to ____ the bookstore his mom left him. Sadly, the business never got better, and he had to close it in the end.", "options": {"A": "build", "B": "buy", "C": "save", "D": "start"}, "ans": "C", "tags": ["v_verb"], "ex": "生意一直沒有起色，最後還是關門 → 他花光錢想「挽救」媽媽留下的書店：save。", "trap": "build／start／buy：書店是媽媽留給他的，已經存在了。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null}, {"id": "110-12", "year": "110", "no": 12, "group": null, "stem": "Fiona loves listening to her children sing songs ____ at school.", "options": {"A": "are learned", "B": "that learned", "C": "they learned", "D": "that they are learned"}, "ans": "C", "tags": ["g_relative"], "ex": "songs (that) they learned at school：省略關係代名詞的關係子句，子句裡要有主詞 they。", "trap": "that learned：歌不會自己學；that they are learned 文法錯誤。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.43}, "opts": null, "note": null}, {"id": "110-13", "year": "110", "no": 13, "group": null, "stem": "Beverly eats lots of snacks ____ meals. That’s why she is often too full to eat anything at mealtimes.", "options": {"A": "after", "B": "between", "C": "during", "D": "from"}, "ans": "B", "tags": ["v_prep"], "ex": "她常在正餐「之間」吃零食，所以吃飯時很飽：between meals。", "trap": "after／during 不能解釋「吃飯時已經太飽」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.38}, "opts": null, "note": null}, {"id": "110-14", "year": "110", "no": 14, "group": null, "stem": "Nora: Can I check your drawer for some tools we can use? Matt: Sure. Take a look. See if you can find ____ in there.", "options": {"A": "any", "B": "it", "C": "others", "D": "those"}, "ans": "A", "tags": ["g_pron"], "ex": "看看抽屜裡能不能找到「任何」可用的工具：any（用在疑問、條件句）。", "trap": "it／those 要指前面提過的特定東西，這裡沒有。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.41}, "opts": null, "note": null}, {"id": "110-15", "year": "110", "no": 15, "group": "15-16", "stem": "What is this ad for?", "options": {"A": "Teaching people how to use their BeautiMed points.", "B": "Telling people they can shop at BeautiMed on the Internet now.", "C": "Inviting people to share their shopping experience at e-BeautiMed.", "D": "Letting people know what is on sale at e-BeautiMed from 7/1 to 8/31."}, "ans": "B", "tags": ["r_main"], "ex": "開頭：many surprises for you at e-BeautiMed, BeautiMed's online store → 告訴大家現在可以在網路上購物了。", "trap": "D：五個驚喜大多是點數活動，不是特價品清單。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.6}, "opts": null, "note": null}, {"id": "110-16", "year": "110", "no": 16, "group": "15-16", "stem": "What will NOT get you BeautiMed points?", "options": {"A": "Shopping at e-BeautiMed.", "B": "Joining “BeautiMed Friend” online.", "C": "Inviting a friend to join “BeautiMed Friend.”", "D": "Entering the “BeautiMed Friend” card number."}, "ans": "D", "tags": ["r_detail", "r_not"], "ex": "Surprise 2：輸入會員卡號是領「免費禮物」，不是拿點數 → D。", "trap": "NOT 題：要逐 "cont": null, "rate": {"all": 0.52}, "opts": null, "note": null, "img": "y110_q20", "imgFull": true}, {"id": "110-21", "year": "110", "no": 21, "group": "19-21", "stem": "What happened when Woollie was put down?", "options": {"A": "He was sold.", "B": "He couldn’t be found.", "C": "He died.", "D": "He became famous."}, "ans": "C", "tags": ["r_wordguess"], "ex": "太病了、沒辦法救，Katie 哭了，希望牠在天上快樂 → put down＝讓動物安樂死，也就是死了。", "trap": "put down 平常是「放下」，這裡要靠上下文判斷。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.76}, "opts": null, "note": null}, {"id": "110-22", "year": "110", "no": 22, "group": "22-24", "stem": "What can we learn about The Piano Lesson from the reading?", "options": {"A": "Matisse painted it when his son was away from home.", "B": "The woman who sits on a seat behind the boy is his mother.", "C": "Matisse uses yellow and red to show that his son was happy.", "D": "The candle on the piano shows that the piano lesson has just begun."}, "ans": "A", "tags": ["r_detail"], "ex": "1916 年作畫時 Pierre 去當兵，馬諦斯不知道他會不會回來 → 畫的時候兒子不在家。", "trap": "D：蠟燭快燒完，表示已經練很久了，不是剛開始。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.57}, "opts": null, "note": null}, {"id": "110-23", "year": "110", "no": 23, "group": "22-24", "stem": "What does do that mean in the reading?", "options": {"A": "Put his family in his paintings.", "B": "Paint to remember the good old days.", "C": "Use a lot of fun colors in his art works.", "D": "Put his earlier art work in a new painting."}, "ans": "D", "tags": ["r_reference"], "ex": "do that 指前一句：把自己的另一幅畫《Woman on a High Stool》畫進新作品裡。", "trap": "後一句又提到畫中有他的雕塑，也是同一種做法。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null}, {"id": "110-24", "year": "110", "no": 24, "group": "22-24", "stem": "What is NOT used in the reading to refer to Henri Matisse?", "options": {"A": "The artist.", "B": "The painter.", "C": "The poor kid.", "D": "A worried father."}, "ans": "C", "tags": ["r_reference", "r_not"], "ex": "the poor kid 指的是兒子 Pierre，不是馬諦斯。", "trap": "NOT 題：the artist／the painter／a worried father 都指馬諦斯。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "110-25", "year": "110", "no": 25, "group": "25-28", "stem": "What idea is talked about in the reading?", "options": {"A": "How Teachers’ Day is celebrated now.", "B": "Why Teachers’ Day was celebrated at first.", "C": "Why Confucius was seen as a great teacher.", "D": "How teachers today feel about Teachers’ Day."}, "ans": "B", "tags": ["r_main"], "ex": "全文說第一個教師節是 1930 年老師們為了爭取待遇而辦的 → 當初為什麼有教師節。", "trap": "A：文章談的是歷史，不是現在怎麼慶祝。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "110-26", "year": "110", "no": 26, "group": "25-28", "stem": "Which is true about Teachers’ Day from the reading?", "options": {"A": "It used to be celebrated on different dates.", "B": "It was started by students for their teachers.", "C": "It has been celebrated in Nanjing for over 2,500 years.", "D": "Teachers decided to celebrate it on Confucius’s birthday."}, "ans": "A", "tags": ["r_detail"], "ex": "先是 6 月 6 日，後來改 8 月 27 日，再改 9 月 28 日 → 以前在不同日期慶祝。", "trap": "D：是政府決定在孔子誕辰慶祝，不是老師們。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null}, {"id": "110-27", "year": "110", "no": 27, "group": "25-28", "stem": "What does “not everyone hailed this decision” mean in the reading?", "options": {"A": "Not everyone cared about the decision.", "B": "Not everyone welcomed the decision.", "C": "Not everyone heard about the decision.", "D": "Not everyone remembered the decision."}, "ans": "B", "tags": ["r_wordguess"], "ex": "冒號後說明理由：教師節本來就不是為了孔子 → 不是每個人都「贊成」這個決定。", "trap": "hail 的意思要從後面的反對理由推出來。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.37}, "opts": null, "note": null}, {"id": "110-28", "year": "110", "no": 28, "group": "25-28", "stem": "What does the writer try to do with this reading?", "options": {"A": "To talk about a problem that no one notices.", "B": "To share a fun experience that was not common.", "C": "To tell a piece of history that few people know about.", "D": "To give an example of an idea that is hard to understand."}, "ans": "C", "tags": ["r_author"], "ex": "開頭說「這是我們學到的全部，但第一個教師節其實不是…」→ 告訴讀者一段少有人知的歷史。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.67}, "opts": null, "note": null}, {"id": "110-29", "year": "110", "no": 29, "group": "29-31", "stem": "Why does National Formosa Railway write this letter?", "options": {"A": "There is a train ticket sale.", "B": "A train line will be closed in July.", "C": "It will open a new train line in August.", "D": "Some of its trains will run on different lines."}, "ans": "D", "tags": ["r_main"], "ex": "因颱風，Sand Town–Spring Town 線關閉，部分列車改走別的路線 → D。", "trap": "B：關閉是 8 月 14–28 日，不是 7 月。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "110-30", "year": "110", "no": 30, "group": "29-31", "stem": "What is true about NFR’s trains between August 14 and 28 2016?", "options": {"A": "No trains will stop at Spring Town.", "B": "Trains that change lines will all stop at Cloud City.", "C": "People can take the free buses to any station on the Sand Town - Spring Town line.", "D": "People can go to Hill Town on any train that runs between Green City and Cloud City."}, "ans": "D", "tags": ["r_picture", "r_detail"], "ex": "Green City 到 Cloud City 的列車改走 Smoke Town–Spring Town 線，而且每站都停，Hill Town 在那條線上 → D。", "trap": "C：免費接駁車不停 Gray Village。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.45}, "opts": null, "note": null}, {"id": "110-31", "year": "110", "no": 31, "group": "29-31", "stem": "James lives in Smoke Town. He wants to go to Black Town on August 19. How can he get there?", "options": {"A": "Take Train RL202 to Green City, get off there, and take the free bus.", "B": "Take Train RL103 to Green City, get off there, and take the free bus.", "C": "Take Train RL102 to Spring Town, get off there, and take Train RL201.", "D": "Take Train RL101 to Cloud City, get off there, and take the free bus."}, "ans": "A", "tags": ["r_picture"], "ex": "Black Town 在關閉的那條線上。RL202 往北經過 Smoke Town 到 Green City，免費接駁車在 Green City 等往南的旅客 → A。", "trap": "要先在圖上找出 Black Town 在哪條線，再看哪班車會經過 Smoke Town。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.46}, "opts": null, "note": null}, {"id": "110-32", "year": "110", "no": 32, "group": "32-34", "stem": "Below are the ideas that are talked about in the reading. a. The problems Darayya has. b. How Darayya’s library was started. c. What makes Darayya’s library special. d. How Darayya’s library helps people there. In what order does the writer put his ideas in the reading?", "options": {"A": "c b a d.", "B": "b a d c.", "C": "a c b d.", "D": "c a b d."}, "ans": "D", "tags": ["r_main"], "ex": "c 地下秘密圖書館很特別 → a 戰爭帶來的問題 → b Ahmad 如何建館 → d 圖書館如何幫助居民 → cabd。", "trap": "要回到每一段的開頭句判斷段落主旨。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.48}, "opts": null, "note": null}, {"id": "110-33", "year": "110", "no": 33, "group": "32-34", "stem": "Why do people in Darayya go to the library even during the war?", "options": {"A": "They can get free food.", "B": "They find joy and hope in reading.", "C": "They want to learn how to win the war.", "D": "Their school teachers give lessons there."}, "ans": "B", "tags": ["r_detail"], "ex": "讀書讓人忘記地面上的可怕世界，也能夢想戰後更好的生活 → 在閱讀中找到快樂與希望。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null}, {"id": "110-34", "year": "110", "no": 34, "group": "32-34", "stem": "What do we know about Darayya’s library?", "options": {"A": "It was built during the war.", "B": "It has been bombed many times.", "C": "It was built to remember people who died in the war.", "D": "Most of its books are collected from outside of Darayya."}, "ans": "A", "tags": ["r_detail"], "ex": "為了幫助戰爭中的孩子學習，Ahmad 和朋友蓋了這座圖書館 → 戰時興建。", "trap": "B：蓋在地下就是為了避免被轟炸。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "110-35", "year": "110", "no": 35, "group": "35-37", "stem": "", "options": {"A": "Victor Zoo", "B": "Carlton City", "C": "Mosman Garden", "D": "Northbank Park"}, "ans": "D", "tags": ["r_cloze"], "ex": "之前說派對在舊家附近，後文 Please don't go to Northbank Park next to our old house → Northbank Park。", "trap": "Mosman Garden 是「新」地點。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.48}, "opts": null, "note": null, "cloze": true}, {"id": "110-36", "year": "110", "no": 36, "group": "35-37", "stem": "", "options": {"A": "we have a plan if this happens", "B": "we could just wait for the rain to stop", "C": "we should be fine if the rain isn’t too heavy", "D": "we will let you know if we’ll still have the party"}, "ans": "A", "tags": ["r_cloze"], "ex": "後面接 If it rains, we'll move the party inside → 已經有備案。", "trap": "D：後面已經說明下雨怎麼辦，不需要再通知。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null, "cloze": true}, {"id": "110-37", "year": "110", "no": 37, "group": "35-37", "stem": "", "options": {"A": "crazy", "B": "good", "C": "lucky", "D": "strong"}, "ans": "C", "tags": ["r_cloze"], "ex": "if we're lucky and it is fine（天氣好）→ 幸運：lucky。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.73}, "opts": null, "note": null, "cloze": true}, {"id": "110-38", "year": "110", "no": 38, "group": "38-41", "stem": "", "options": {"A": "are all coming", "B": "have all come", "C": "were all coming", "D": "would all come"}, "ans": "C", "tags": ["r_cloze", "g_tense"], "ex": "故事用過去式敘述「在那一刻」，聽過的故事一一湧進腦中 → 過去進行式 were all coming。", "trap": "are all coming 是現在式，和全文的過去時態不合。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.57}, "opts": null, "note": null, "cloze": true}, {"id": "110-39", "year": "110", "no": 39, "group": "38-41", "stem": "", "options": {"A": "another", "B": "one", "C": "the last", "D": "the other"}, "ans": "A", "tags": ["r_cloze", "g_pron"], "ex": "前面已經說「第一件蠢事」，現在又做了「另一件」：another。", "trap": "the last：最後一句才說對那人說的話是最蠢的事，這時還不是最後一件。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.47}, "opts": null, "note": null, "cloze": true}, {"id": "110-40", "year": "110", "no": 40, "group": "38-41", "stem": "", "options": {"A": "have", "B": "did", "C": "had", "D": "would"}, "ans": "B", "tags": ["r_cloze", "g_aux"], "ex": "我原本希望樹能擋點雨，它們確實擋了 → And they did（did 代替 kept some rain off）。", "trap": "had：原句動詞是 keep，不是 have。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null, "cloze": true}, {"id": "110-41", "year": "110", "no": 41, "group": "38-41", "stem": "", "options": {"A": "was trying", "B": "try", "C": "would try", "D": "will try"}, "ans": "A", "tags": ["r_cloze", "g_tense"], "ex": "那個人說「我（剛剛）是在試著把包包還你」→ 過去進行式 was trying。", "trap": "will try 是未來，但他已經追上來還包包了。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.51}, "opts": null, "note": null, "cloze": true}], "groups": {"15-16": {"title": "e-BeautiMed 網路商店開幕", "kind": "img", "img": "y110_g15"}, "17-18": {"title": "Joey 與 Lynn 談 Caldron 餐廳", "kind": "img", "img": "y110_g17"}, "19-21": {"title": "Katie 的日記：綿羊 Woollie", "kind": "img", "img": "y110_g19"}, "22-24": {"title": "馬諦斯〈鋼琴課〉", "kind": "img", "img": "y110_g22"}, "25-28": {"title": "教師節的由來", "kind": "img", "img": "y110_g25"}, "29-31": {"title": "NFR 鐵路改線通知＋路線圖", "kind": "img", "img": "y110_g29"}, "32-34": {"title": "敘利亞 Darayya 的地下圖書館", "kind": "img", "img": "y110_g32"}, "35-37": {"title": "生日派對邀請信（克漏字）", "kind": "img", "img": "y110_g35"}, "38-41": {"title": "雨夜穿越公園（克漏字）", "kind": "img", "img": "y110_g38"}}}, "109": {"items": [{"id": "109-01", "year": "109", "no": 1, "group": null, "stem": "Look at the picture. The man is holding one of the ____ .", "options": {"A": "bowls", "B": "glasses", "C": "plates", "D": "spoons"}, "ans": "B", "tags": ["r_picture", "v_noun"], "ex": "圖中男子拿著一個玻璃杯：one of the glasses。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.82}, "opts": null, "note": null, "img": "y109_q1", "imgFull": true}, {"id": "109-02", "year": "109", "no": 2, "group": null, "stem": "My mom puts the ____ on to keep her hands away from water when she washes the dishes.", "options": {"A": "gloves", "B": "jacket", "C": "ring", "D": "socks"}, "ans": "A", "tags": ["v_noun"], "ex": "洗碗時讓手不碰到水 → 戴手套：gloves（put on 戴上）。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null}, {"id": "109-03", "year": "109", "no": 3, "group": null, "stem": "Can you ____ your feet a little off the floor? I want to see if my keys are under the sofa.", "options": {"A": "check", "B": "kick", "C": "raise", "D": "show"}, "ans": "C", "tags": ["v_verb"], "ex": "想看鑰匙有沒有在沙發下，請你把腳稍微抬離地面：raise。", "trap": "kick（踢）不是「抬高」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "109-04", "year": "109", "no": 4, "group": null, "stem": "____ of my sisters are older than I am. I’m the youngest of the three children in my family.", "options": {"A": "Both", "B": "Few", "C": "Most", "D": "Some"}, "ans": "A", "tags": ["g_pron"], "ex": "家裡三個孩子、我最小 → 我的兩個姊姊「都」比我大：Both。", "trap": "Most／Some 用在三個以上，而這裡姊姊只有兩個。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.75}, "opts": null, "note": null}, {"id": "109-05", "year": "109", "no": 5, "group": null, "stem": "The beach near our town is a very ____ place. Every summer at least one kid dies there in the water.", "options": {"A": "dangerous", "B": "exciting", "C": "lonely", "D": "popular"}, "ans": "A", "tags": ["v_adj"], "ex": "每年夏天至少一個孩子在那裡溺水 → 很危險：dangerous。", "trap": "popular 可能是真的，但不能解釋「每年有人死」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.71}, "opts": null, "note": null}, {"id": "109-06", "year": "109", "no": 6, "group": null, "stem": "My wife enjoys going to the movies with her friends, but I like to watch TV at home by ____ .", "options": {"A": "I", "B": "me", "C": "myself", "D": "mine"}, "ans": "C", "tags": ["g_pron"], "ex": "by oneself＝獨自：watch TV at home by myself。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.83}, "opts": null, "note": null}, {"id": "109-07", "year": "109", "no": 7, "group": null, "stem": "For the past twenty years, my father ____ in a school library. But he’ll leave the job next month.", "options": {"A": "worked", "B": "has worked", "C": "is working", "D": "works"}, "ans": "B", "tags": ["g_tense"], "ex": "For the past twenty years 到現在還在做（下個月才離職）→ 現在完成式 has worked。", "trap": "worked 表示已結束，但他現在還在那裡工作。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "109-08", "year": "109", "no": 8, "group": null, "stem": "It’s great that we can buy train tickets over the phone without going out. It ____ us a lot of time.", "options": {"A": "lends", "B": "prepares", "C": "saves", "D": "takes"}, "ans": "C", "tags": ["v_verb", "v_colloc"], "ex": "不用出門就能電話訂票 → 省下很多時間：save us a lot of time。", "trap": "takes us a lot of time 意思相反。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.63}, "opts": null, "note": null}, {"id": "109-09", "year": "109", "no": 9, "group": null, "stem": "Mozart ____ his first music when he was only six years old.", "options": {"A": "is writing", "B": "has written", "C": "will write", "D": "wrote"}, "ans": "D", "tags": ["g_tense"], "ex": "when he was only six years old 是過去的時間 → 過去式 wrote。", "trap": "has written 不能和明確的過去時間連用。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null}, {"id": "109-10", "year": "109", "no": 10, "group": null, "stem": "Jill: Have you decided ____ you will celebrate your 30th birthday? Sue: Yeah, I’m going to have a big barbecue party.", "options": {"A": "how", "B": "where", "C": "what", "D": "when"}, "ans": "A", "tags": ["g_noun_clause"], "ex": "回答說要辦烤肉派對 → 問的是「怎麼」慶祝：how。", "trap": "where／when 的答案應該是地點或時間。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.6}, "opts": null, "note": null}, {"id": "109-11", "year": "109", "no": 11, "group": null, "stem": "Alison doesn’t like ____ what to do. She only does things she wants to do.", "options": {"A": "told", "B": "to tell", "C": "be told", "D": "to be told"}, "ans": "D", "tags": ["g_passive", "g_verbform"], "ex": "她不喜歡「被」別人告訴該做什麼 → like + to be + p.p.：to be told。", "trap": "to tell 是主動，變成她告訴別人；本題只有四成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.42}, "opts": null, "note": null}, {"id": "109-12", "year": "109", "no": 12, "group": null, "stem": "Josh has planned to make a trip to New York and ____ some of his friends there.", "options": {"A": "visit", "B": "visits", "C": "visiting", "D": "visited"}, "ans": "A", "tags": ["g_verbform", "g_conj"], "ex": "has planned to make… and (to) visit…：and 連接兩個不定詞，第二個 to 省略 → visit。", "trap": "visits／visited：and 前後要對稱，前面是 to make。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.34}, "opts": null, "note": null}, {"id": "109-13", "year": "109", "no": 13, "group": null, "stem": "Ms. Johnson has been taking phone calls since she entered the office this morning. Just when she thought she could finally leave work, ____ call came in.", "options": {"A": "another", "B": "each", "C": "the next", "D": "the other"}, "ans": "A", "tags": ["g_pron"], "ex": "一早就一直接電話，正以為可以下班時，又來「另一通」：another call。", "trap": "the other 用於兩者中剩下的那一個；the next 這裡語感不對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.4}, "opts": null, "note": null}, {"id": "109-14", "year": "109", "no": 14, "group": null, "stem": "We were so sure that Jerry ____ well on the difficult job. His past experience in other work showed he was the right guy for it. So when he failed, no one believed it.", "options": {"A": "had done", "B": "did", "C": "has done", "D": "would do"}, "ans": "D", "tags": ["g_tense", "g_aux"], "ex": "當時「很確定他『會』做得好」（從過去看未來）→ would do。後面 So when he failed… 表示結果與預期相反。", "trap": "did／had done 表示已經做好了，但他其實失敗了。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.43}, "opts": null, "note": null}, {"id": "109-15", "year": "109", "no": 15, "group": null, "stem": "For Mike, the price is ____ important thing when he shops for jeans. He cares even more about the shape and the size of the pockets.", "options": {"A": "the more", "B": "the most", "C": "the less", "D": "the least"}, "ans": "D", "tags": ["g_compare"], "ex": "後句：他更在乎口袋的形狀和大小 → 價格是「最不重要」的：the least important。", "trap": "the most 意思相反；比較的是好幾個條件，所以用最高級。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.37}, "opts": null, "note": null}, {"id": "109-16", "year": "109", "no": 16, "group": "16-17", "stem": "What is it in the reading?", "options": {"A": "The sun.", "B": "The rain.", "C": "The wind.", "D": "The rainbow."}, "ans": "C", "tags": ["r_infer"], "ex": "衣服在曬衣繩上跳舞、樹在揮手、雲在賽跑、外套被吹進池塘 → it 是風。", "trap": "要把每一段的線索合起來看。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "109-17", "year": "109", "no": 17, "group": "16-17", "stem": "How does Dad feel“when it comes”?", "options": {"A": "He is scared.", "B": "He is excited.", "C": "He is not happy.", "D": "He is not interested."}, "ans": "C", "tags": ["r_infer"], "ex": "Dad's face falls（臉一沉），外套被吹進池塘、新車堆滿落葉 → 不開心。", "trap": "face falls 是慣用說法，不是臉真的掉下來。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "109-18", "year": "109", "no": 18, "group": "18-19", "stem": "What can we learn about Buffy’s friends?", "options": {"A": "Matt has experience of yard sales.", "B": "Jamie had a successful yard sale last week.", "C": "Albert thinks weather is important for yard sales.", "D": "Debby thinks things are cheaper online than at yard sales."}, "ans": "A", "tags": ["r_detail"], "ex": "Matt：I made some good friends at my last yard sale → 他辦過。", "trap": "B：Jamie 上週是把東西送人，不是辦 yard sale。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null}, {"id": "109-19", "year": "109", "no": 19, "group": "18-19", "stem": "What do Buffy’s friends think about having a yard sale?", "options": {"A": "Albert and Matt think it’s a nice way to make friends.", "B": "Debby and Albert think it’s difficult to make money from it.", "C": "Matt agrees with Jamie that it’s a good chance to help people.", "D": "Jamie agrees with Debby that it’s a lot of trouble to prepare for it."}, "ans": "D", "tags": ["r_compare"], "ex": "Debby 說辦 yard sale 很累，Jamie 說 Debby's right → D。", "trap": "A：只有 Matt 提到交朋友，Albert 說的是賺錢。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "109-20", "year": "109", "no": 20, "group": "20-21", "stem": "From the ad, which is true about Sunny Sun pictures?", "options": {"A": "The first day to use Sunny Sun pictures is Feb. 4.", "B": "The last day to collect Sunny Sun pictures is Feb. 10.", "C": "You cannot use Sunny Sun pictures to get free desserts.", "D": "You cannot get Sunny Sun pictures when you buy books."}, "ans": "D", "tags": ["r_detail"], "ex": "買書和 CD 以外的東西才能拿到貼紙 → 買書拿不到。", "trap": "A／B：集點到 2/4，兌換到 2/10，兩個日期容易看反。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null}, {"id": "109-21", "year": "109", "no": 21, "group": "20-21", "stem": "Sammy has 7 Sunny Sun pictures. She wants to get a Sunny Cup. How can she get one?", "options": {"A": "Use 6 Sunny Sun pictures and pay $100.", "B": "Use 6 Sunny Sun pictures and pay $200.", "C": "Spend $150 to get 3 more Sunny Sun pictures.", "D": "Spend $200 to get 4 more Sunny Sun pictures."}, "ans": "B", "tags": ["r_detail"], "ex": "她只有 7 張，不到免費杯子需要的 12 張；集滿 6 張可以用 $200 買 Sunny Cup → B。", "trap": "A：$100 是用來買甜點的價格。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "109-22", "year": "109", "no": 22, "group": "22-24", "stem": "From the reading, which picture best shows the “bain-marie” way of working with chocolate?", "options": {"A": "", "B": "", "C": "", "D": ""}, "ans": "B", "tags": ["r_picture", "r_detail"], "ex": "小鍋裡放巧克力、奶油和糖，架在裝溫水的大鍋上 → B。", "trap": "要看清楚哪個鍋子裝水、哪個鍋子裝巧克力。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.76}, "opts": null, "note": null, "img": "y109_q22", "imgFull": true}, {"id": "109-23", "year": "109", "no": 23, "group": "22-24", "stem": "What does them mean in the reading?", "options": {"A": "Bains-marie.", "B": "Butter and sugar.", "C": "Chocolate desserts.", "D": "Small pieces of chocolate."}, "ans": "B", "tags": ["r_reference"], "ex": "if you do (mix chocolate with butter and sugar), put them in the pot too → them＝butter and sugar。", "trap": "D：巧克力已經放進去了，這裡說的是「也要放」的東西。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null}, {"id": "109-24", "year": "109", "no": 24, "group": "22-24", "stem": "From the reading, which is true about working with chocolate?", "options": {"A": "It is better to use a “bain-marie” than a “water bath.”", "B": "The water in the pot should not be warmer than 50ºC.", "C": "It is better to finish mixing it in less than five minutes.", "D": "We should not mix butter and sugar together at the same time."}, "ans": "B", "tags": ["r_detail"], "ex": "Keep the water under 50ºC → 水溫不要超過 50 度。", "trap": "A：作者只是「比較喜歡」bain-marie 這個名字，兩者是同一種方法。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "109-25", "year": "109", "no": 25, "group": "25-27", "stem": "What does the news story say about the Yangs’ food truck?", "options": {"A": "What people love about their food.", "B": "What made them start their business.", "C": "How they made delicious fried chicken.", "D": "How they fixed their business problems."}, "ans": "D", "tags": ["r_main"], "ex": "生意一開始很差，他們把車漆藍、畫梅花、改名「便當」，生意才變好 → 怎麼解決生意問題。", "trap": "B：文中沒有說他們為什麼開始做生意。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null}, {"id": "109-26", "year": "109", "no": 26, "group": "25-27", "stem": "What does it mean when business is slack?", "options": {"A": "It is bad.", "B": "It is for sale.", "C": "It is growing.", "D": "It is open every day."}, "ans": "A", "tags": ["r_wordguess"], "ex": "後文：很少人停下來試吃、免費都送不出去 → slack＝生意很差。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.63}, "opts": null, "note": null}, {"id": "109-27", "year": "109", "no": 27, "group": "25-27", "stem": "What does that mean in the news story?", "options": {"A": "A Taiwanese restaurant.", "B": "A second Taiwanese food truck.", "C": "A city block that sells Taiwanese food.", "D": "A business that is popular across the country."}, "ans": "C", "tags": ["r_reference"], "ex": "that 指前一句他們希望的：城裡有一整個街區賣台灣食物（像中國城、韓國城）。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "109-28", "year": "109", "no": 28, "group": "28-30", "stem": "What problem is Selena Bieber trying to fix?", "options": {"A": "High school lessons are too difficult.", "B": "Classes start too early in the morning.", "C": "Too many students are late for school.", "D": "Lunch break is too short for taking a rest."}, "ans": "B", "tags": ["r_main"], "ex": "標題 Later Is Better!，主張上課時間應該晚一點 → 課太早開始。", "trap": "C：遲到不是她要解決的問題。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.72}, "opts": null, "note": null}, {"id": "109-29", "year": "109", "no": 29, "group": "28-30", "stem": "What can we learn from the letter?", "options": {"A": "Too much melatonin can hurt teenagers’ brain.", "B": "The brain stops making melatonin after 11 p.m.", "C": "Sleeping longer helps the body make more melatonin.", "D": "It is easier to fall asleep when the brain is making melatonin."}, "ans": "D", "tags": ["r_detail"], "ex": "melatonin, the hormone that helps sleep → 大腦在分泌它的時候比較好入睡。", "trap": "B：大腦在晚上 11 點到早上 8 點之間分泌，不是 11 點後停止。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.51}, "opts": null, "note": null}, {"id": "109-30", "year": "109", "no": 30, "group": "28-30", "stem": "Below is some information from another study. We studied 48 high school students and found that the students who went to bed earlier did better on their school tests. This is not only true for those who slept nine hours, but also true for those who slept less. And some of them agreed that they learned better in early morning classes. Do the ideas in Selena Bieber’s letter agree with the information?", "options": {"A": "Yes, because her letter says it is better to sleep from 11 p.m. to 8 a.m.", "B": "Yes, because her letter says getting up early is not helpful for learning.", "C": "No, because her letter says students are asked to get to school by 7:30 a.m.", "D": "No, because her letter says teenagers’ brains do not work well in early morning classes."}, "ans": "D", "tags": ["r_compare", "r_infer"], "ex": "另一份研究說有些學生覺得早上的課學得比較好；Selena 認為早上大腦不清醒 → 不一致，選 D。", "trap": "C 雖然是信中的內容，但不是兩者不一致的地方。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.46}, "opts": null, "note": null}, {"id": "109-31", "year": "109", "no": 31, "group": "31-34", "stem": "What can we learn about Kivalina?", "options": {"A": "It is waiting to shine.", "B": "It has become history.", "C": "It is fighting for one last hope.", "D": "It has given up its chance to rise."}, "ans": "C", "tags": ["r_main"], "ex": "團體正和村民一起努力拯救村子，但沒人知道會不會成功 → 在為最後的希望奮鬥。", "trap": "B／D：村子還在，也還沒放棄。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null}, {"id": "109-32", "year": "109", "no": 32, "group": "31-34", "stem": "What does it mean when we say a place is uninhabitable?", "options": {"A": "It is not big.", "B": "It is not popular.", "C": "It cannot be bought.", "D": "It cannot be lived in."}, "ans": "D", "tags": ["r_wordguess"], "ex": "島可能被海淹沒，居民得離開 → uninhabitable＝不能住人的。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.7}, "opts": null, "note": null}, {"id": "109-33", "year": "109", "no": 33, "group": "31-34", "stem": "What does the writer think about the Inuit people in Kivalina?", "options": {"A": "Their way of living has been hurting the earth.", "B": "They might not be able to get enough money to move their village.", "C": "They should make the oil and power companies fix their problems.", "D": "There are better ways than to move their village to somewhere else."}, "ans": "B", "tags": ["r_detail"], "ex": "遷村要花上億元，they have no idea where to get the money → B。", "trap": "C：村民「認為」是石油和電力公司造成的，但作者沒有說他們應該叫公司處理。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null}, {"id": "109-34", "year": "109", "no": 34, "group": "31-34", "stem": "What does the reading say about the Arctic ice?", "options": {"A": "The Arctic ice covered 10 km2 of Kivalina.", "B": "The melting Arctic ice kills about 400 Inuit people each year.", "C": "The Arctic ice helped the Inuit people in Kivalina during bad weather.", "D": "The melting Arctic ice has given the Inuit people enough water to use."}, "ans": "C", "tags": ["r_detail"], "ex": "現在沒有夠厚的冰保護他們免於狂風暴雨 → 以前北極冰在壞天氣時保護他們。", "trap": "A：10 km² 是村子的面積。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null}, {"id": "109-35", "year": "109", "no": 35, "group": "35-37", "stem": "", "options": {"A": "what else you can do", "B": "how you can enjoy it more", "C": "how it will change your life", "D": "what is the best way of commute for you"}, "ans": "C", "tags": ["r_cloze"], "ex": "後兩段都在說長途通勤會讓你睡更少、沒時間陪家人、影響健康 → 它會如何改變你的生活。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.5}, "opts": null, "note": null, "cloze": true}, {"id": "109-36", "year": "109", "no": 36, "group": "35-37", "stem": "", "options": {"A": "costs you money", "B": "hurts your health", "C": "makes traffic terrible", "D": "kills the planet slowly"}, "ans": "B", "tags": ["r_cloze"], "ex": "後句：容易變胖、脖子背部有毛病、心臟問題 → 傷害健康。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null, "cloze": true}, {"id": "109-37", "year": "109", "no": 37, "group": "35-37", "stem": "", "options": {"A": "And that’s why", "B": "But that’s not all", "C": "And here’s an example", "D": "But that can be stopped"}, "ans": "B", "tags": ["r_cloze"], "ex": "前面說身體健康，後面接著說心情和工作表現也變差 → 還不只這樣：But that's not all。", "trap": "C：後面是新的一類影響，不是前句的例子。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null, "cloze": true}, {"id": "109-38", "year": "109", "no": 38, "group": "38-41", "stem": "", "options": {"A": "this is surely a surprise", "B": "this sounds like a good idea", "C": "this is perhaps a smart answer", "D": "this is old news they have heard"}, "ans": "A", "tags": ["r_cloze"], "ex": "後句：奧運通常為主辦城市帶來工作、遊客和錢 → 對爭取主辦的城市來說，慕尼黑拒絕很令人意外。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.49}, "opts": null, "note": null, "cloze": true}, {"id": "109-39", "year": "109", "no": 39, "group": "38-41", "stem": "", "options": {"A": "had given hopes", "B": "are a different story", "C": "bring a bright future", "D": "have been a great plan"}, "ans": "B", "tags": ["r_cloze"], "ex": "前面說奧運有好處，但對慕尼黑人來說「是另一回事」→ are a different story。", "trap": "C／D 都是正面說法，和後文的「嚴重麻煩」不合。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.52}, "opts": null, "note": null, "cloze": true}, {"id": "109-40", "year": "109", "no": 40, "group": "38-41", "stem": "", "options": {"A": "this will not go away; it will stay", "B": "they are not just saying it; they are going to do it", "C": "they do not speak for others; they only speak for themselves", "D": "this is not a guess; it is a lesson they learned from hard experience"}, "ans": "D", "tags": ["r_cloze"], "ex": "冒號後說慕尼黑辦過 1972 夏季奧運、鄰鎮辦過 1936 冬季奧運 → 這不是猜測，而是從辛苦經驗學到的教訓。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.5}, "opts": null, "note": null, "cloze": true}, {"id": "109-41", "year": "109", "no": 41, "group": "38-41", "stem": "", "options": {"A": "In fact", "B": "If so", "C": "However", "D": "Finally"}, "ans": "A", "tags": ["r_cloze", "g_conj"], "ex": "前句說其他城市不擔心，後句更進一步說他們很高興 → In fact（事實上，更進一步說明）。", "trap": "However 表示轉折，但前後語意是同一個方向。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.49}, "opts": null, "note": null, "cloze": true}], "groups": {"16-17": {"title": "小詩：When it arrives…", "kind": "img", "img": "y109_g16"}, "18-19": {"title": "群組討論：要不要辦 yard sale", "kind": "img", "img": "y109_g18"}, "20-21": {"title": "Sunny Market 集點廣告", "kind": "img", "img": "y109_g20"}, "22-24": {"title": "隔水加熱融化巧克力", "kind": "img", "img": "y109_g22"}, "25-27": {"title": "紐約的台灣便當餐車", "kind": "img", "img": "y109_g25"}, "28-30": {"title": "公開信：Later Is Better!", "kind": "img", "img": "y109_g28"}, "31-34": {"title": "阿拉斯加 Kivalina 村", "kind": "img", "img": "y109_g31"}, "35-37": {"title": "長途通勤的代價（克漏字）", "kind": "img", "img": "y109_g35"}, "38-41": {"title": "慕尼黑拒辦冬奧（克漏字）", "kind": "img", "img": "y109_g38"}}}, "108": {"items": [{"id": "108-01", "year": "108", "no": 1, "group": null, "stem": "Look at the picture. The mother duck is ____ the baby ducks across the street.", "options": {"A": "carrying", "B": "leading", "C": "pushing", "D": "watching"}, "ans": "B", "tags": ["r_picture", "v_verb"], "ex": "圖中鴨媽媽走在前面，帶著小鴨過馬路：leading。", "trap": "carrying 是把小鴨背著或抱著，圖中小鴨是跟在後面自己走。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.72}, "opts": null, "note": null, "img": "y108_q1", "imgFull": true}, {"id": "108-02", "year": "108", "no": 2, "group": null, "stem": "Ms. Liu usually gives us a lot of homework, ____ she didn’t give us any today.", "options": {"A": "but", "B": "if", "C": "or", "D": "so"}, "ans": "A", "tags": ["g_conj"], "ex": "平常作業很多，今天卻沒有 → 轉折：but。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.82}, "opts": null, "note": null}, {"id": "108-03", "year": "108", "no": 3, "group": null, "stem": "Playing games on the cellphone ____ popular with high school students.", "options": {"A": "is", "B": "are", "C": "being", "D": "to be"}, "ans": "A", "tags": ["g_agreement"], "ex": "動名詞片語 Playing games on the cellphone 當主詞，視為單數 → is。", "trap": "are：看到 games 就以為主詞是複數。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "108-04", "year": "108", "no": 4, "group": null, "stem": "There ____ more than twenty clubs in our school. Which one would you like to join?", "options": {"A": "has", "B": "have", "C": "is", "D": "are"}, "ans": "D", "tags": ["g_agreement"], "ex": "There be 句型，be 動詞跟著後面的名詞 more than twenty clubs（複數）→ are。", "trap": "have／has 不能用在 There 句型裡。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.6}, "opts": null, "note": null}, {"id": "108-05", "year": "108", "no": 5, "group": null, "stem": "Diane had a bad cold last week. She is still too ____ to go mountain climbing with you.", "options": {"A": "busy", "B": "short", "C": "weak", "D": "young"}, "ans": "C", "tags": ["v_adj"], "ex": "上週重感冒，現在還太虛弱，不能去爬山：too weak to…。", "trap": "busy 和「感冒」無關。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.78}, "opts": null, "note": null}, {"id": "108-06", "year": "108", "no": 6, "group": null, "stem": "The book under Mary’s desk is ____ , but I don’t know why it is there.", "options": {"A": "us", "B": "me", "C": "my", "D": "mine"}, "ans": "D", "tags": ["g_pron"], "ex": "be 動詞後面用所有格代名詞：The book is mine（是我的）。", "trap": "my 後面一定要接名詞。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.76}, "opts": null, "note": null}, {"id": "108-07", "year": "108", "no": 7, "group": null, "stem": "Last night a garbage truck hit a tree and turned over. Now the street is ____ with lots of garbage.", "options": {"A": "dark", "B": "dirty", "C": "heavy", "D": "poor"}, "ans": "B", "tags": ["v_adj"], "ex": "垃圾車翻倒，街上滿是垃圾 → 很髒：dirty。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "108-08", "year": "108", "no": 8, "group": null, "stem": "It almost killed Kevin to take care of his baby sister for one afternoon. He wondered how his mom could do ____ every day.", "options": {"A": "her", "B": "it", "C": "one", "D": "them"}, "ans": "B", "tags": ["g_pron", "r_reference"], "ex": "do it＝做「照顧妹妹」這件事（一件事用 it）。", "trap": "her 會變成「做她」，語意不通。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null}, {"id": "108-09", "year": "108", "no": 9, "group": null, "stem": "Joyce tells her brother everything. She never ____ anything from him.", "options": {"A": "covers", "B": "believes", "C": "hides", "D": "takes"}, "ans": "C", "tags": ["v_verb"], "ex": "什麼都告訴哥哥 → 從不對他隱瞞任何事：hide anything from him。", "trap": "cover 是「覆蓋」，不能搭配 from 表示隱瞞。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.52}, "opts": null, "note": null}, {"id": "108-10", "year": "108", "no": 10, "group": null, "stem": "Ben always uses his birthday as a(n) ____ to ask Dad to buy him something expensive.", "options": {"A": "action", "B": "excuse", "C": "prize", "D": "rule"}, "ans": "B", "tags": ["v_noun"], "ex": "用生日當作要爸爸買貴東西的「藉口、理由」：excuse。", "trap": "prize（獎品）是他想要的東西，不是理由。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "108-11", "year": "108", "no": 11, "group": null, "stem": "____ that last piece of pie? If not, can I have it? I didn’t eat much this morning.", "options": {"A": "Had you eaten", "B": "Were you eating", "C": "Do you eat", "D": "Are you going to eat"}, "ans": "D", "tags": ["g_tense"], "ex": "問對方「你等一下要不要吃那塊派？不吃的話我可以吃嗎？」→ 未來打算：Are you going to eat。", "trap": "Had you eaten 是過去完成式，和「如果不吃我可以吃嗎」不合。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.42}, "opts": null, "note": null}, {"id": "108-12", "year": "108", "no": 12, "group": null, "stem": "Everyone in the class enjoys playing chess ____ Bill; he thinks the game is boring.", "options": {"A": "except", "B": "for", "C": "like", "D": "of"}, "ans": "A", "tags": ["v_prep"], "ex": "全班都喜歡下棋，「除了」Bill，他覺得很無聊：except。", "trap": "like Bill 會變成「像 Bill 一樣」，但 Bill 不喜歡。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null}, {"id": "108-13", "year": "108", "no": 13, "group": null, "stem": "In my school days, I ____ to English radio programs every day. That was how I learned English at that time.", "options": {"A": "listen", "B": "have listened", "C": "used to listen", "D": "was listening"}, "ans": "C", "tags": ["g_tense", "v_colloc"], "ex": "In my school days（學生時代）每天聽 → 過去的習慣：used to listen。", "trap": "was listening 是過去某一刻正在進行，不能表示每天的習慣。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.44}, "opts": null, "note": null}, {"id": "108-14", "year": "108", "no": 14, "group": null, "stem": "Tom’s voice ____ when he talks about his neighbors. He speaks faster, his face becomes redder and you can almost see fire in his eyes.", "options": {"A": "appears", "B": "drops", "C": "grows", "D": "rises"}, "ans": "D", "tags": ["v_verb"], "ex": "說話變快、臉變紅、眼裡冒火 → 聲音提高：his voice rises。", "trap": "drops（降低）意思相反。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null}, {"id": "108-15", "year": "108", "no": 15, "group": null, "stem": "____ other waiters in the restaurant have worked here longer than Clark; only Lois and Lana started working here before him.", "options": {"A": "All", "B": "Most", "C": "Some", "D": "Few"}, "ans": "D", "tags": ["g_pron"], "ex": "只有 Lois 和 Lana 比他早來 → 「很少」其他服務生比他資深：Few。", "trap": "Most／Some 會變成很多人比他資深；本題只有三成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.3}, "opts": null, "note": null}, {"id": "108-16", "year": "108", "no": 16, "group": "16-17", "stem": "What are “Daddy and me” doing in the poem?", "options": {"A": "Eating.", "B": "Singing.", "C": "Dancing.", "D": "Cooking."}, "ans": "D", "tags": ["r_infer"], "ex": "切牛肉、馬鈴薯在水裡翻滾、湯在鍋裡沸騰 → 一起煮 goulash（燉牛肉）。", "trap": "dancing／singing 是詩中的比喻，不是真的在跳舞唱歌。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.71}, "opts": null, "note": null}, {"id": "108-17", "year": "108", "no": 17, "group": "16-17", "stem": "What can we most likely know about the speaker?", "options": {"A": "He seldom understands his father.", "B": "He enjoys his time with his father.", "C": "He often makes goulash for his father.", "D": "He wants to be as famous as his father."}, "ans": "B", "tags": ["r_infer"], "ex": "父子雖然話不多，但一切盡在不言中，最後還擁抱 → 他享受和父親在一起的時光。", "trap": "A：I see what he means 表示他懂爸爸的意思。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null}, {"id": "108-18", "year": "108", "no": 18, "group": "18-19", "stem": "Which is true about City Sight Bus tickets?", "options": {"A": "It costs less to buy tickets on the Internet.", "B": "People must pay the full ticket price for a pet.", "C": "Tickets are more expensive in the high season.", "D": "People save 10% if they buy two tickets for the same line."}, "ans": "A", "tags": ["r_detail"], "ex": "Save 10% if you buy tickets on the Internet → 網路買比較便宜。", "trap": "D：要「兩條路線都買」才打九折，不是同一條路線買兩張。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.66}, "opts": null, "note": null}, {"id": "108-19", "year": "108", "no": 19, "group": "18-19", "stem": "Which is true about the bus lines?", "options": {"A": "Line B takes more time.", "B": "Both lines cross Farmers’ Bridge.", "C": "Both lines leave from Central Station.", "D": "There are more gardens to see on Line A."}, "ans": "C", "tags": ["r_detail"], "ex": "Buses for both lines leave every hour from Central Station → C。", "trap": "A：Line A 要一小時，Line B 只要 50 分鐘。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.77}, "opts": null, "note": null}, {"id": "108-20", "year": "108", "no": 20, "group": "20-22", "stem": "Why were there seventeen calls asking for Mike?", "options": {"A": "His team was angry at him.", "B": "He is a popular soccer player.", "C": "He did not show up for the game on Friday.", "D": "His name did not appear on the list of players."}, "ans": "A", "tags": ["r_infer"], "ex": "Mike 忘了去拿球衣，隔天就是重要比賽，打電話的是全體隊友 → 隊友在生他的氣。", "trap": "B：Mike 以為自己有粉絲了，其實不是。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "108-21", "year": "108", "no": 21, "group": "20-22", "stem": "What does It mean in the dialogue?", "options": {"A": "The shop.", "B": "The fan club.", "C": "The soccer game.", "D": "The soccer season."}, "ans": "A", "tags": ["r_reference"], "ex": "It's not open on the weekend → It＝那家店。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null}, {"id": "108-22", "year": "108", "no": 22, "group": "20-22", "stem": "What can we learn about Mike?", "options": {"A": "He is nice to people from his fan club.", "B": "He plays soccer with Johnny and Ricky.", "C": "He found a way to fix the trouble he made.", "D": "He decided not to go to the game on Sunday."}, "ans": "B", "tags": ["r_detail"], "ex": "打電話的 Johnny、Ricky… 都是 everyone on my team → 他和 Johnny、Ricky 是隊友。", "trap": "C：店週末不開，他沒辦法補救。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "108-23", "year": "108", "no": 23, "group": "23-25", "stem": "Which is the best title for this reading?", "options": {"A": "Australia: The Best Place for Birds.", "B": "Mother Bird Fights Weather Changes.", "C": "Larger Mother Birds Have Larger Eggs.", "D": "Family Love: Brothers & Sisters Work Together."}, "ans": "B", "tags": ["r_main"], "ex": "全文說鳥媽媽依天氣好壞產不同大小的蛋 → 鳥媽媽對抗天氣變化。", "trap": "C：重點是蛋的大小隨天氣改變，不是鳥媽媽體型大。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "108-24", "year": "108", "no": 24, "group": "23-25", "stem": "What does this trick mean in the reading?", "options": {"A": "Having eggs of different sizes.", "B": "Growing stronger inside the egg.", "C": "Saving food for weaker baby birds.", "D": "Helping baby birds break out of the eggs."}, "ans": "A", "tags": ["r_reference"], "ex": "this trick 指前一段：依天氣產下不同大小的蛋。", "trap": "B 是大蛋帶來的結果，不是 trick 本身。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.49}, "opts": null, "note": null}, {"id": "108-25", "year": "108", "no": 25, "group": "23-25", "stem": "What can we learn about superb fairy-wrens from the reading?", "options": {"A": "Male birds can usually live for ten years.", "B": "Baby birds grow well in hot, dry weather.", "C": "Young male birds share the job of feeding the baby birds.", "D": "Mother birds make smaller eggs when there is less food outside."}, "ans": "C", "tags": ["r_detail"], "ex": "her sons will bring food back for their baby brothers and sisters → 年輕的雄鳥幫忙餵食。", "trap": "D 剛好相反：食物少時要產「較大」的蛋。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null}, {"id": "108-26", "year": "108", "no": 26, "group": "26-28", "stem": "What idea is talked about in both pieces of news?", "options": {"A": "More young people need to join in making art.", "B": "People’s ways of enjoying art change with time.", "C": "Bringing important art works to Taiwan from abroad.", "D": "Giving new life to old arts that were almost forgotten."}, "ans": "D", "tags": ["r_compare", "r_main"], "ex": "紙紮原本快消失，被帶到法國、拍成電影；相聲原本只有少數人愛好，被賴聲川帶紅 → 讓快被遺忘的傳統藝術重獲新生。", "trap": "C：紙紮是被帶到「國外」展出，不是從國外帶回台灣。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.52}, "opts": null, "note": null}, {"id": "108-27", "year": "108", "no": 27, "group": "26-28", "stem": "What does it mean when something is a smash hit?", "options": {"A": "It is old.", "B": "It is successful.", "C": "It is foreign.", "D": "It is useful."}, "ans": "B", "tags": ["r_wordguess"], "ex": "後句：大家又重新對相聲有興趣 → smash hit＝大受歡迎、非常成功。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.63}, "opts": null, "note": null}, {"id": "108-28", "year": "108", "no": 28, "group": "26-28", "stem": "What do we know from the news?", "options": {"A": "Lai has taught xiangsheng in many schools.", "B": "Lai often puts his own life stories into his art works.", "C": "The owner of Hsin Hsin Paper Offering Store is a Frenchman.", "D": "People do not burn papier-mâché for dead people as often as before."}, "ans": "D", "tags": ["r_infer"], "ex": "紙紮 is dying because it is not much needed now → 現在比較少燒紙紮給往生者。", "trap": "C：法國人是邀請這家店去法國展覽，不是店主。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.43}, "opts": null, "note": null}, {"id": "108-29", "year": "108", "no": 29, "group": "29-32", "stem": "Which idea is talked about in the news?", "options": {"A": "How often we should drink coffee.", "B": "What happens when we have too much coffee.", "C": "How to help the body make the cortisol we need.", "D": "What happens when we have coffee at the wrong time."}, "ans": "D", "tags": ["r_main"], "ex": "剛起床時喝咖啡最糟，皮質醇下降時喝最好 → 在錯的時間喝咖啡會怎樣。", "trap": "A／B：文章談的是時間點，不是次數或份量。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "108-30", "year": "108", "no": 30, "group": "29-32", "stem": "What does it mean when someone thinks otherwise about something?", "options": {"A": "They are serious about it.", "B": "They have no idea about it.", "C": "They think differently about it.", "D": "They do not think it is a problem."}, "ans": "C", "tags": ["r_wordguess"], "ex": "很多人覺得起床喝咖啡最好，But a report… says otherwise（卻說最糟）→ 看法不同。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "108-31", "year": "108", "no": 31, "group": "29-32", "stem": "The picture below shows how the cortisol levels rise and fall during the day. From the news, which is a good time for coffee?", "options": {"A": "", "B": "", "C": "", "D": ""}, "ans": "D", "tags": ["r_picture"], "ex": "文中說皮質醇「下降」時喝最好 → 選曲線剛過高峰、正在往下的那一點：D。", "trap": "A／B／C 在上升或在高峰，這時喝咖啡效果最差。", "goal": null, "perf": null, "c
