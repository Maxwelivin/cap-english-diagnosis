<title>會考英文診斷</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1f2a26;--mute:#5f6d67;--pri:#2f6f5e;--pri2:#e3efe9;--ok:#2e7d32;--okbg:#e8f5e9;--ng:#c62828;--ngbg:#fdecea;--warn:#b26a00;--warnbg:#fff4e0;--line:#d9e2dc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 84px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:12px;color:var(--mute)}
nav.tabs button b{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:14px 0 6px}
.mute{color:var(--mute);font-size:14px}
.small{font-size:13px}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font-size:16px;background:var(--pri);color:#fff;font-weight:600;text-align:center}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn.danger{background:var(--ngbg);color:var(--ng)}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1}
.big{font-size:30px;font-weight:700;color:var(--pri)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;background:var(--pri2);color:var(--pri);margin:2px 4px 2px 0}
.pill.v{background:#eef0fb;color:#3949ab}.pill.g{background:#fbeef4;color:#ad1457}.pill.r{background:#e8f4f8;color:#00695c}
.badge{display:inline-block;min-width:22px;padding:0 7px;border-radius:99px;background:var(--ng);color:#fff;font-size:13px;text-align:center}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--pri)}
.passage{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.passage summary{font-weight:600;color:var(--pri);cursor:pointer}
.en{font-family:"Times New Roman",Georgia,serif;font-size:18px;line-height:1.55}
.passage .en p{margin:.55em 0}
.passage img.pimg{width:100%;border:1px solid var(--line);border-radius:6px;margin-top:8px}
.zoomhint{font-size:12px;color:var(--mute);text-align:right}
figure.fr{float:right;width:38%;margin:4px 0 6px 10px}figure.fr img{width:100%;border-radius:4px}figure.fr figcaption{font-size:11px;color:var(--mute);font-family:sans-serif}
.web{border:1px solid #999;border-radius:6px;padding:4px 12px 8px}.webbar{font-family:sans-serif;font-size:12px;background:#eee;margin:0 -12px 6px;padding:6px 12px;border-radius:6px 6px 0 0;font-weight:600}
.news{border:1px solid #999;padding:6px 12px;margin-bottom:10px;background:#fafafa}.newshd{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:4px}.newshd b{font-size:20px}.newshd span{font-size:12px;font-family:sans-serif;text-align:right}
.book{background:#fbf8ef;border:1px solid #c9bd9c;border-radius:6px;padding:4px 14px}
.gloss{font-size:13px;text-align:right;margin-top:6px}
.blank{display:inline-block;min-width:44px;border-bottom:1.5px solid #333;text-align:center;font-family:sans-serif;font-size:14px;color:var(--mute)}
.blank.cur{background:#fff3b0;color:#000;font-weight:700}
.stem{margin:4px 0 12px}
.stem p{margin:0 0 .6em}
table.ptab{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:15px;font-family:-apple-system,"PingFang TC",sans-serif}table.ptab th,table.ptab td{border:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:top}table.ptab th{background:var(--pri2);color:var(--pri)}
.tabwrap{overflow-x:auto}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 12px;margin:0 0 9px;font-size:17px;color:var(--ink)}
.opt .k{font-family:sans-serif;font-weight:700;color:var(--pri);min-width:26px}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.guess{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:15px;color:var(--warn)}
.guess input{width:22px;height:22px}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0}
.fb.ok{background:var(--okbg)}.fb.ng{background:var(--ngbg)}.fb.gs{background:var(--warnbg)}
.fb h4{margin:0 0 4px;font-size:16px}
.fb p{margin:6px 0}
.stat{font-size:14px;background:#fff;border-radius:10px;padding:8px 10px;margin-top:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:3px 0 2px;background:#eee}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.grid button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-size:14px}
.grid button.a{background:var(--pri2);border-color:var(--pri)}
.grid button.cur{outline:2px solid var(--pri)}
.grid button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.grid button.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.grid button.gs{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.navq{position:sticky;bottom:0;display:flex;gap:8px;margin:10px -14px 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);background:rgba(243,246,241,.94);border-top:1px solid var(--line)}
.navq .btn{flex:1}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n{text-align:right;white-space:nowrap}
.meter{height:8px;background:#eee;border-radius:4px;position:relative;margin-top:3px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--pri)}
.meter s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#333}
textarea{width:100%;min-height:150px;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.taglist button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;font-size:15px;text-align:left;color:var(--ink)}
.taglist button:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;-webkit-overflow-scrolling:touch}
.overlay img{display:block;width:100%;background:#fff}
.overlay .tools{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:8px;display:flex;gap:6px;z-index:51}
.overlay .tools button{border:0;border-radius:8px;padding:8px 12px;font-size:15px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:60}
.concept{border-left:4px solid var(--pri);padding:4px 0 4px 12px;margin:8px 0}
.concept ul{margin:4px 0;padding-left:20px}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.hv{font-weight:700;color:#1b5e20;border-bottom:2px solid #66bb6a}
.hc{background:#fff3b0;border-radius:3px;padding:0 2px}
.exl{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#f7faf8}
.exl.bad{background:var(--ngbg)}
.exl .zh{font-size:14px;color:var(--mute)}
.rulebox{background:var(--pri2);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600;color:var(--pri)}
ol.steps{padding-left:22px;margin:6px 0}ol.steps li{margin:4px 0}
.lv{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;background:#eef0fb;color:#3949ab;margin-right:6px}
.streak{display:flex;gap:6px;margin:6px 0 10px}.streak i{width:22px;height:22px;border-radius:50%;background:var(--line);display:inline-block}.streak i.on{background:var(--ok)}
.skrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;font-size:15px;text-align:left;color:var(--ink)}
.skrow.off{color:var(--mute)}
.skchip{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;background:#e8f4f8;color:#00695c;border:1px solid #b2dfdb}
.skchip.link{background:#fff;border-color:var(--pri);color:var(--pri);font-weight:600}
.qtext{white-space:pre-line}
</style>
</head>

<script>
const BANK={"years": {"115": {"items": [{"id": "115-01", "year": "115", "no": 1, "group": null, "stem": "Look at the picture. All of the students who are exercising are wearing ____ .", "options": {"A": "caps", "B": "glasses", "C": "jackets", "D": "pants"}, "ans": "B", "tags": ["r_picture", "v_noun"], "ex": "題目限定「正在運動的」學生：打羽球的兩人與跳繩的一人都戴眼鏡（glasses）。坐在長椅上的兩人戴帽子但沒在運動，所以不是 caps。", "trap": "先把圖中所有人看一遍，而不是只看「正在運動」的人，就會選到 caps 或 jackets。", "goal": "用圖表表徵文意（單題）", "perf": "3-Ⅳ-4", "cont": "B-Ⅳ-6", "rate": {"all": 0.7013, "disc": 0.58, "mastery": 0.9739, "basic": 0.7392, "weak": 0.3169}, "opts": {"A": {"all": 6.04, "mastery": 0.08, "basic": 4.34, "weak": 16.2}, "B": {"all": 70.13, "mastery": 97.39, "basic": 73.92, "weak": 31.69}, "C": {"all": 14.18, "mastery": 2.23, "basic": 12.61, "weak": 30.87}, "D": {"all": 9.56, "mastery": 0.3, "basic": 9.12, "weak": 20.93}}, "note": null, "img": "y115_q01"}, {"id": "115-02", "year": "115", "no": 2, "group": null, "stem": "Rita ____ her dogs many times a day. That’s why they’re too fat.", "options": {"A": "feeds", "B": "kisses", "C": "walks", "D": "washes"}, "ans": "A", "tags": ["v_verb"], "ex": "後句 That's why they're too fat（所以牠們太胖）是結果，原因應該是「一天餵很多次」：feed 餵食。", "trap": "walk（遛狗）一天很多次會讓狗變瘦，和 too fat 的因果相反。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7373, "disc": 0.65, "mastery": 0.9939, "basic": 0.8335, "weak": 0.2543}, "opts": {"A": {"all": 73.73, "mastery": 99.39, "basic": 83.35, "weak": 25.43}, "B": {"all": 6.25, "mastery": 0.01, "basic": 2.6, "weak": 20.59}, "C": {"all": 14.86, "mastery": 0.59, "basic": 11.46, "weak": 37.84}, "D": {"all": 5.08, "mastery": 0.0, "basic": 2.59, "weak": 15.8}}, "note": null}, {"id": "115-03", "year": "115", "no": 3, "group": null, "stem": "You can ask Sophia anything about butterflies and bees. She has great ____ of insects.", "options": {"A": "chances", "B": "knowledge", "C": "news", "D": "power"}, "ans": "B", "tags": ["v_noun", "v_colloc"], "ex": "前句說蝴蝶、蜜蜂什麼都可以問她 → 她對昆蟲有很多知識：have great knowledge of…。", "trap": "news（消息）、chances（機會）都不能搭配 of insects 表示「對昆蟲的了解」。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7639, "disc": 0.65, "mastery": 0.9995, "basic": 0.8704, "weak": 0.2842}, "opts": {"A": {"all": 7.58, "mastery": 0.01, "basic": 4.22, "weak": 22.88}, "B": {"all": 76.39, "mastery": 99.95, "basic": 87.04, "weak": 28.42}, "C": {"all": 8.3, "mastery": 0.04, "basic": 4.52, "weak": 25.22}, "D": {"all": 7.63, "mastery": 0.01, "basic": 4.21, "weak": 23.1}}, "note": null}, {"id": "115-04", "year": "115", "no": 4, "group": null, "stem": "Adam slept ____ last night because he kept waking up from bad dreams.", "options": {"A": "deeply", "B": "early", "C": "terribly", "D": "quickly"}, "ans": "C", "tags": ["v_adv"], "ex": "because 後說他一直被惡夢驚醒 → 睡得很糟：sleep terribly。", "trap": "deeply（睡得很熟）跟一直醒來相反；early 與惡夢無因果。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.706, "disc": 0.67, "mastery": 0.9963, "basic": 0.7759, "weak": 0.2377}, "opts": {"A": {"all": 7.02, "mastery": 0.15, "basic": 5.07, "weak": 18.68}, "B": {"all": 14.36, "mastery": 0.17, "basic": 12.75, "weak": 33.64}, "C": {"all": 70.6, "mastery": 99.63, "basic": 77.59, "weak": 23.77}, "D": {"all": 7.92, "mastery": 0.05, "basic": 4.58, "weak": 23.52}}, "note": null}, {"id": "115-05", "year": "115", "no": 5, "group": null, "stem": "Tara enjoys being with all kinds of animals; she even ____ a snake as a pet.", "options": {"A": "drops", "B": "gives", "C": "keeps", "D": "makes"}, "ans": "C", "tags": ["v_verb", "v_colloc"], "ex": "keep… as a pet 是固定說法「把…當寵物養」。", "trap": "make 不表示飼養；give a snake as a pet 是「送」人，與「她喜歡動物，甚至…」的語意不合。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5492, "disc": 0.57, "mastery": 0.9543, "basic": 0.466, "weak": 0.2565}, "opts": {"A": {"all": 8.86, "mastery": 0.1, "basic": 8.22, "weak": 20.08}, "B": {"all": 12.49, "mastery": 0.13, "basic": 11.54, "weak": 28.38}, "C": {"all": 54.92, "mastery": 95.43, "basic": 46.6, "weak": 25.65}, "D": {"all": 23.61, "mastery": 4.33, "basic": 33.58, "weak": 25.51}}, "note": null}, {"id": "115-06", "year": "115", "no": 6, "group": null, "stem": "Little Eric chose the doll ____ big brown eyes because it was the cutest in the store.", "options": {"A": "at", "B": "in", "C": "on", "D": "with"}, "ans": "D", "tags": ["v_prep"], "ex": "with 表示「帶有、具有」：the doll with big brown eyes（有著大大棕色眼睛的娃娃）。", "trap": "in 常用於「穿著」（the girl in red），不表示身體特徵。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7064, "disc": 0.62, "mastery": 0.981, "basic": 0.7787, "weak": 0.2508}, "opts": {"A": {"all": 7.34, "mastery": 0.02, "basic": 4.44, "weak": 21.42}, "B": {"all": 13.1, "mastery": 1.84, "basic": 11.6, "weak": 28.84}, "C": {"all": 8.82, "mastery": 0.04, "basic": 6.07, "weak": 24.28}, "D": {"all": 70.64, "mastery": 98.1, "basic": 77.87, "weak": 25.08}}, "note": null}, {"id": "115-07", "year": "115", "no": 7, "group": null, "stem": "After four hours of mountain climbing, Rosa’s legs got ____ , so she took a rest on the top of the mountain.", "options": {"A": "dirty", "B": "sick", "C": "sore", "D": "strong"}, "ans": "C", "tags": ["v_adj"], "ex": "爬了四小時山 → 腿痠：sore（痠痛的），所以 so 後面才休息。", "trap": "strong 與「需要休息」不構成因果；sick 不用來形容腿痠。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5998, "disc": 0.65, "mastery": 0.9615, "basic": 0.5918, "weak": 0.2061}, "opts": {"A": {"all": 9.01, "mastery": 0.17, "basic": 6.56, "weak": 23.91}, "B": {"all": 14.65, "mastery": 3.52, "basic": 15.75, "weak": 25.07}, "C": {"all": 59.98, "mastery": 96.15, "basic": 59.18, "weak": 20.61}, "D": {"all": 16.26, "mastery": 0.16, "basic": 18.5, "weak": 30.01}}, "note": null}, {"id": "115-08", "year": "115", "no": 8, "group": null, "stem": "Having three cups of coffee a day can’t be bad for our health, ____ ?", "options": {"A": "can it", "B": "can they", "C": "is it", "D": "are they"}, "ans": "A", "tags": ["g_tag", "g_agreement"], "ex": "主詞 Having three cups of coffee a day 是動名詞片語，視為單數 → 代名詞用 it；主句 can't 是否定 → 附加問句用肯定 can：can it?", "trap": "看到 three cups 就以為主詞是複數而選 can they。動名詞當主詞一律當單數。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5252, "disc": 0.51, "mastery": 0.8668, "basic": 0.4897, "weak": 0.2091}, "opts": {"A": {"all": 52.52, "mastery": 86.68, "basic": 48.97, "weak": 20.91}, "B": {"all": 19.67, "mastery": 7.93, "basic": 22.12, "weak": 28.08}, "C": {"all": 16.58, "mastery": 4.68, "basic": 19.09, "weak": 25.06}, "D": {"all": 11.12, "mastery": 0.69, "basic": 9.79, "weak": 25.58}}, "note": null}, {"id": "115-09", "year": "115", "no": 9, "group": null, "stem": "You can’t push that door open with only one hand. It’s too heavy. You have to use ____ !", "options": {"A": "all", "B": "another", "C": "both", "D": "one"}, "ans": "C", "tags": ["g_pron"], "ex": "前句說「只用一隻手推不開」，人只有兩隻手 → 要用兩隻：both。", "trap": "another（另一個）只是換一隻手，仍是一隻；all 用於三者以上。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.672, "disc": 0.65, "mastery": 0.9894, "basic": 0.7041, "weak": 0.2484}, "opts": {"A": {"all": 9.34, "mastery": 0.25, "basic": 8.38, "weak": 21.54}, "B": {"all": 13.98, "mastery": 0.77, "basic": 13.57, "weak": 29.76}, "C": {"all": 67.2, "mastery": 98.94, "basic": 70.41, "weak": 24.84}, "D": {"all": 9.38, "mastery": 0.04, "basic": 7.62, "weak": 23.46}}, "note": null}, {"id": "115-10", "year": "115", "no": 10, "group": null, "stem": "Alan works hard in his new job, and he wants to know ____ his boss feels about him.", "options": {"A": "how", "B": "that", "C": "whether", "D": "why"}, "ans": "A", "tags": ["g_noun_clause"], "ex": "know 後接間接問句：how his boss feels about him（老闆覺得他怎麼樣）。feel about 後面需要「怎樣」，空格本身就是那個「怎樣」。", "trap": "that／whether／why 放進去後，feels about him 都缺少「感覺如何」的內容，句意不完整。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.6037, "disc": 0.65, "mastery": 0.9646, "basic": 0.6127, "weak": 0.1769}, "opts": {"A": {"all": 60.37, "mastery": 96.46, "basic": 61.27, "weak": 17.69}, "B": {"all": 16.7, "mastery": 1.54, "basic": 17.21, "weak": 32.84}, "C": {"all": 13.41, "mastery": 1.9, "basic": 12.19, "weak": 28.91}, "D": {"all": 9.4, "mastery": 0.1, "basic": 9.3, "weak": 20.15}}, "note": null}, {"id": "115-11", "year": "115", "no": 11, "group": null, "stem": "I thought the girl ____ was Kate, but it was her sister, Candy. They sounded almost the same.", "options": {"A": "answered the phone", "B": "she answered the phone", "C": "who answered the phone", "D": "and answered the phone"}, "ans": "C", "tags": ["g_relative"], "ex": "句子主幹是 the girl ____ was Kate，空格修飾 the girl，要用關係子句：who answered the phone（接電話的那個女孩）。", "trap": "A 少了關係代名詞，一句裡出現 answered 和 was 兩個動詞；B 多了 she；D 的 and 讓句子結構錯誤。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.7006, "disc": 0.63, "mastery": 0.9895, "basic": 0.7504, "weak": 0.274}, "opts": {"A": {"all": 13.26, "mastery": 0.8, "basic": 13.13, "weak": 27.62}, "B": {"all": 10.04, "mastery": 0.19, "basic": 6.89, "weak": 27.48}, "C": {"all": 70.06, "mastery": 98.95, "basic": 75.04, "weak": 27.4}, "D": {"all": 6.53, "mastery": 0.05, "basic": 4.92, "weak": 17.09}}, "note": null}, {"id": "115-12", "year": "115", "no": 12, "group": null, "stem": "Ken is going abroad with a woman he met online, though he doesn’t know ____ well.", "options": {"A": "her", "B": "each other", "C": "any", "D": "another"}, "ans": "A", "tags": ["g_pron"], "ex": "受詞指前面的 a woman → 用受格 her：he doesn't know her well。", "trap": "each other 需要主詞是兩人以上（they know each other），這裡主詞只有 he。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5015, "disc": 0.58, "mastery": 0.9142, "basic": 0.4273, "weak": 0.1821}, "opts": {"A": {"all": 50.15, "mastery": 91.42, "basic": 42.73, "weak": 18.21}, "B": {"all": 17.07, "mastery": 5.74, "basic": 19.27, "weak": 25.51}, "C": {"all": 20.8, "mastery": 2.61, "basic": 25.62, "weak": 31.79}, "D": {"all": 11.84, "mastery": 0.22, "basic": 12.3, "weak": 24.08}}, "note": null}, {"id": "115-13", "year": "115", "no": 13, "group": null, "stem": "Joe is happy he is not at the ____ of the class now. His grades are better than half of his classmates’ this school year.", "options": {"A": "side", "B": "front", "C": "center", "D": "bottom"}, "ans": "D", "tags": ["v_noun", "v_colloc"], "ex": "成績比班上一半的人好 → 現在已經不是班上最後面：at the bottom of the class（全班吊車尾）。", "trap": "front／center／side 都不是表示排名的慣用說法。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5593, "disc": 0.62, "mastery": 0.945, "basic": 0.521, "weak": 0.1989}, "opts": {"A": {"all": 14.51, "mastery": 1.57, "basic": 16.22, "weak": 25.73}, "B": {"all": 14.72, "mastery": 1.7, "basic": 15.79, "weak": 27.32}, "C": {"all": 14.72, "mastery": 2.22, "basic": 15.85, "weak": 26.61}, "D": {"all": 55.93, "mastery": 94.5, "basic": 52.1, "weak": 19.89}}, "note": null}, {"id": "115-14", "year": "115", "no": 14, "group": null, "stem": "Look! There is not a cloud in the sky. I think the chances of getting some rain today are really ____ .", "options": {"A": "far", "B": "good", "C": "possible", "D": "small"}, "ans": "D", "tags": ["v_adj", "v_colloc"], "ex": "天上沒有一片雲 → 下雨的機會很小：the chances are small。", "trap": "good（機會很大）與沒雲相反；possible 和 chances 語意重複，不能說 chances are possible。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5182, "disc": 0.6, "mastery": 0.9198, "basic": 0.4613, "weak": 0.1768}, "opts": {"A": {"all": 10.66, "mastery": 2.03, "basic": 10.89, "weak": 19.98}, "B": {"all": 12.91, "mastery": 0.19, "basic": 11.85, "weak": 29.41}, "C": {"all": 24.49, "mastery": 5.79, "basic": 31.09, "weak": 32.49}, "D": {"all": 51.82, "mastery": 91.98, "basic": 46.13, "weak": 17.68}}, "note": null}, {"id": "115-15", "year": "115", "no": 15, "group": null, "stem": "On windy days, the flowers in my garden ____ like shy children with their heads down.", "options": {"A": "bow", "B": "fall", "C": "rise", "D": "smell"}, "ans": "A", "tags": ["v_verb"], "ex": "後面的比喻 like shy children with their heads down（像低著頭的害羞孩子）→ 花被風吹得低頭：bow。", "trap": "fall（掉落）只看「風大」就選，忽略了「低頭的害羞孩子」這個比喻。本題全國通過率只有 38%。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.3817, "disc": 0.44, "mastery": 0.745, "basic": 0.275, "weak": 0.1835}, "opts": {"A": {"all": 38.17, "mastery": 74.5, "basic": 27.5, "weak": 18.35}, "B": {"all": 32.68, "mastery": 21.87, "basic": 39.98, "weak": 30.35}, "C": {"all": 17.36, "mastery": 2.81, "basic": 19.97, "weak": 28.64}, "D": {"all": 11.63, "mastery": 0.82, "basic": 12.49, "weak": 22.19}}, "note": null}, {"id": "115-16", "year": "115", "no": 16, "group": null, "stem": "Mr. Olson went to the doctor when he found he ____ his hair. He hoped he would be able to keep his thick hair.", "options": {"A": "was losing", "B": "is losing", "C": "will lose", "D": "has lost"}, "ans": "A", "tags": ["g_tense"], "ex": "主要子句 went／found 是過去時間，而且後句說他希望保住濃密的頭髮 → 當時「正在」掉頭髮：過去進行式 was losing。", "trap": "has lost（已經掉了）與過去時間 found 不一致，也與「希望保住」不合；is losing 時態沒跟著過去。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5834, "disc": 0.43, "mastery": 0.8449, "basic": 0.588, "weak": 0.2781}, "opts": {"A": {"all": 58.34, "mastery": 84.49, "basic": 58.8, "weak": 27.81}, "B": {"all": 13.73, "mastery": 8.02, "basic": 12.11, "weak": 23.42}, "C": {"all": 10.48, "mastery": 0.92, "basic": 7.67, "weak": 26.95}, "D": {"all": 17.32, "mastery": 6.56, "basic": 21.38, "weak": 21.38}}, "note": null}, {"id": "115-17", "year": "115", "no": 17, "group": null, "stem": "Do you know what Lindsey’s first job was? Before becoming a movie star, she ____ the floors at the supermarket.", "options": {"A": "mops", "B": "is mopping", "C": "has mopped", "D": "mopped"}, "ans": "D", "tags": ["g_tense"], "ex": "她的第一份工作、在成為電影明星之前 → 過去已結束的事：簡單過去式 mopped。", "trap": "has mopped 是現在完成式，不能搭配「成為明星之前」這個已結束的過去時段。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": eone <u>bombed</u> something?"}, {"id": "115-24", "year": "115", "no": 24, "group": "24-26", "stem": "Which question can the brochure answer?", "options": {"A": "Can I order tickets online?", "B": "How much are the tickets?", "C": "How can I get to the Marigolds’ Home?", "D": "When can I visit the Marigolds’ Home?"}, "ans": "D", "tags": ["r_detail"], "ex": "手冊列了 Opening times（開放時間）與 Closed on Mondays → 可以回答「什麼時候能去」。", "trap": "網址是用來加入會員的，沒說能線上訂票；手冊沒有票價，也沒有交通方式。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-3", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.681, "disc": 0.66, "mastery": 0.9878, "basic": 0.7387, "weak": 0.2181}, "opts": {"A": {"all": 7.71, "mastery": 0.15, "basic": 6.42, "weak": 18.84}, "B": {"all": 9.73, "mastery": 0.38, "basic": 7.81, "weak": 24.14}, "C": {"all": 14.34, "mastery": 0.69, "basic": 11.88, "weak": 34.73}, "D": {"all": 68.1, "mastery": 98.78, "basic": 73.87, "weak": 21.81}}, "note": null}, {"id": "115-25", "year": "115", "no": 25, "group": "24-26", "stem": "What breaks the rules for visitors to the Marigolds’ Home?", "options": {"A": "Eating burgers in the Rose Garden.", "B": "Taking pictures in the Main House.", "C": "Entering the Rabbit’s Temple without shoes.", "D": "Taking pet dogs for a walk on the playground."}, "ans": "D", "tags": ["r_detail", "r_infer"], "ex": "規則 1：任何區域都不准帶寵物 → 帶狗在遊樂場散步違規。", "trap": "C：規則要求進兔子神殿「要脫鞋」，不穿鞋進去正是守規則。A：只禁止在建築物內吃東西，玫瑰園在戶外。B：只禁止在 Sir Archie's House 拍照。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.4952, "disc": 0.61, "mastery": 0.9186, "basic": 0.4138, "weak": 0.1779}, "opts": {"A": {"all": 15.73, "mastery": 6.08, "basic": 17.7, "weak": 22.74}, "B": {"all": 14.24, "mastery": 0.43, "basic": 14.61, "weak": 29.13}, "C": {"all": 20.37, "mastery": 1.62, "basic": 26.26, "weak": 29.85}, "D": {"all": 49.52, "mastery": 91.86, "basic": 41.38, "weak": 17.79}}, "note": null}, {"id": "115-26", "year": "115", "no": 26, "group": "24-26", "stem": "After shopping at the gift shop of the Main House, Lizzy walks out and sees the Family Library in front of her. She wants to visit the Rose Garden. How can she get there?", "options": {"A": "Turn left and walk past the Main House, then go straight and turn right at the corner.", "B": "\u0007Turn left and walk past Sir Archie’s House, then turn right and walk past the Main House.", "C": "\u0007Turn right and go straight to the Farmyard, then turn right and go straight, then turn left at the corner.", "D": "\u0007Turn right and walk through the Butterfly Garden, then walk past the Rabbit’s Temple and the café."}, "ans": "C", "tags": ["r_picture"], "ex": "從 Main House 的禮品店出來看到北方的 Family Library → 面向北。右轉往東到農場，右轉往南直走，在轉角左轉 → 玫瑰園。", "trap": "要先依「看到什麼建築在前面」判斷自己面向哪裡，左右才不會轉錯。", "goal": "在圖表中找出所需的資訊", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.6553, "disc": 0.62, "mastery": 0.9719, "basic": 0.6802, "weak": 0.247}, "opts": {"A": {"all": 14.28, "mastery": 1.47, "basic": 15.11, "weak": 27.14}, "B": {"all": 11.15, "mastery": 0.21, "basic": 9.4, "weak": 27.04}, "C": {"all": 65.53, "mastery": 97.19, "basic": 68.02, "weak": 24.7}, "D": {"all": 8.89, "mastery": 1.13, "basic": 7.4, "weak": 20.64}}, "note": null}, {"id": "115-27", "year": "115", "no": 27, "group": "27-28", "stem": "Why was Beatrice Harrison called the Nightingale Lady?", "options": {"A": "She wrote songs about nightingales.", "B": "She sang as beautifully as a nightingale did.", "C": "She taught nightingales to sing in a radio show.", "D": "She was famous for playing music with nightingales."}, "ans": "D", "tags": ["r_main"], "ex": "她和夜鶯一起在電台演出十二年、收到五萬封信，所以被稱為 Nightingale Lady → 以和夜鶯一起演奏聞名。", "trap": "文中沒說她教夜鶯唱歌，夜鶯是自己飛來加入的。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-8", "rate": {"all": 0.5901, "disc": 0.61, "mastery": 0.9844, "basic": 0.5441, "weak": 0.2354}, "opts": {"A": {"all": 9.05, "mastery": 0.05, "basic": 7.86, "weak": 21.62}, "B": {"all": 13.49, "mastery": 0.6, "basic": 15.09, "weak": 24.88}, "C": {"all": 18.29, "mastery": 0.9, "basic": 22.55, "weak ackson get to know each other?", "options": {"A": "They met at a party.", "B": "They were relatives.", "C": "They worked in the same office.", "D": "They took a course on movies together."}, "ans": "A", "tags": ["r_detail"], "ex": "I was at a party to pick up my wife when I heard Rose… → 在派對上認識。", "trap": "invited her to write 是認識之後的事，不代表他們原本是同事。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-14", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.67, "disc": 0.67, "mastery": 0.9882, "basic": 0.714, "weak": 0.2219}, "opts": {"A": {"all": 67.0, "mastery": 98.82, "basic": 71.4, "weak": 22.19}, "B": {"all": 9.39, "mastery": 0.09, "basic": 6.98, "weak": 24.73}, "C": {"all": 8.66, "mastery": 0.14, "basic": 5.43, "weak": 24.77}, "D": {"all": 14.79, "mastery": 0.95, "basic": 16.14, "weak": 27.78}}, "note": null}, {"id": "115-31", "year": "115", "no": 31, "group": "29-31", "stem": "What is special about Rose Lacey’s articles?", "options": {"A": "They are important to movie makers.", "B": "They talk about movies from a fresh angle.", "C": "They give interesting information about actors.", "D": "They are good examples of how to write stories."}, "ans": "B", "tags": ["r_infer"], "ex": "Rose could always bring out something new from movies that we thought we knew so well → 從新的角度談電影（a fresh angle）。", "trap": "A：文中沒提到電影製作人；這一題要把原文換句話說。", "goal": "推論文中隱含的訊息", "perf": "3-Ⅳ-14", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5331, "disc": 0.6, "mastery": 0.9687, "basic": 0.4376, "weak": 0.2305}, "opts": {"A": {"all": 17.49, "mastery": 1.87, "basic": 20.99, "weak": 28.19}, "B": {"all": 53.31, "mastery": 96.87, "basic": 43.76, "weak": 23.05}, "C": {"all": 16.26, "mastery": 0.7, "basic": 19.59, "weak": 27.23}, "D": {"all": 12.77, "mastery": 0.55, "basic": 15.59, "weak": 21.0}}, "note": null}, {"id": "115-32", "year": "115", "no": 32, "group": "32-34", "stem": "Why does the title say “Glass Bottles’ Second Life” ?", "options": {"A": "People collect sea glass and use it to make new glass bottles.", "B": "People collect sea glass at the beach and use it to make wishes.", "C": "Glass bottles that are thrown into the sea become the homes of sea animals.", "D": "Glass bottles that are thrown into the sea become sea glass which is used in art pieces."}, "ans": "D", "tags": ["r_main"], "ex": "瓶子被丟進海裡 → 變成海玻璃 → 被藝術家用在作品上，就是瓶子的「第二次生命」。", "trap": "A：海玻璃沒有再做成瓶子；C：文中沒提到海洋生物。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-11", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.6536, "disc": 0.66, "mastery": 0.9895, "basic": 0.6792, "weak": 0.2218}, "opts": {"A": {"all": 11.77, "mastery": 0.65, "basic": 11.63, "weak": 24.64}, "B": {"all": 12.2, "mastery": 0.36, "basic": 12.26, "weak": 25.5}, "C": {"all": 10.51, "mastery": 0.03, "basic": 8.13, "weak": 27.12}, "D": {"all": 65.36, "mastery": 98.95, "basic": 67.92, "weak": 22.18}}, "note": null}, {"id": "115-33", "year": "115", "no": 33, "group": "32-34", "stem": "According to the reading, how is sea glass made?", "options": {"A": "Sea glass becomes rounder after it is pushed up to the beach.", "B": "Colder sea water helps pieces of glass become sea glass faster.", "C": "Pieces of glass become white on the outside after many years in the sea.", "D": "Glass bottles break into pieces when they are dug out from the sea floor."}, "ans": "C", "tags": ["r_picture", "r_detail"], "ex": "步驟 4：在海裡幾十到幾百年後，外表長出冰一般的白色 → C。", "trap": "A：變圓是在海裡發生的（步驟 3），不是被推上岸之後；D：玻璃是被浪打碎，不是從海底挖出來。", "goal": "在圖表中找出所需的資訊", "perf": "3-Ⅳ-4", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.5774, "disc": 0.56, "mastery": 0.947, "basic": 0.5256, "weak": 0.2619}, "opts": {"A": {"all": 19.72, "mastery": 3.71, "basic": 24.88, "weak": 27.54}, "B": {"all": 10.45, "mastery": 0.17, "basic": 8.88, "weak": 25.25}, "C": {"all": 57.74, "mastery": 94.7, "basic": 52.56, "weak": 26.19}, "D": {"all": 11.92, "mastery": 1.42, "basic": 13.6, "weak": 20.47}}, "note": null}, {"id": "115-34", "year": "115", "no": 34, "group": "32-34", "stem": "According to the reading, why will less sea glass be found in the future?", "options": {"A": "People do not make as many glass items as before.", "B": "People have learned not to throw garbage into the sea.", "C": "Artists are using too much sea glass in their art pieces.", "D": "Waves are not big enough to push sea glass up to the beach."}, "ans": "A", "tags": ["r_infer"], "ex": "最後一段：人們很少用玻璃做瓶子和碗 → 海裡的玻璃變少 → A。", "trap": "B 聽起來合理，但文中沒說人們不再亂丟垃圾。", "goal": "推論文中隱含的訊息", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-2", "rate": {"all": 0.5514, "disc": 0.67, "mastery": 0.9794, "basic": 0.4839, "weak": 0.2015}, "opts": {"A": {"all": 55.14, "mastery": 97.94, "basic": 48.39, "weak": 20.15}, "B": {"all": 20.19, "mastery": 1.18, "basic": 26.01, "weak": 30.1}, "C": {"all": 15.11, "mastery": 0.85, "basic": 17.5, "weak": 26.5}, "D": {"all": 9.4, "mastery": 0.02, "basic": 8.05, "weak": 22.71}}, "note": null}, {"id": "115-35", "year": "115", "no": 35, "group": "35-39", "stem": "What does the prevalence of English mean?", "options": {"A": "That English is very common.", "B": "That English is not welcomed.", "C": "That English is easy and simple.", "D": "That English is not a national language."}, "ans": "A", "tags": ["r_wordguess"], "ex": "後文舉例：用英文和機器人說話、用手機、看電影，Actually, you see English everywhere → prevalence 意指「普遍、盛行」。", "trap": "要用後面的例子回推生字的意思，不要只看字形。", "goal": "根據上下文意猜測字詞的意義", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.6292, "disc": 0.69, "mastery": 0.9909, "basic": 0.6417, "weak": 0.1946}, "opts": {"A": {"all": 62.92, "mastery": 99.09, "basic": 64.17, "weak": 19.46}, "B": {"all": 9.96, "mastery": 0.24, "basic": 8.82, "weak": 23.23}, "C": {"all": 10.27, "mastery": 0.13, "basic": 8.34, "weak": 25.6}, "D": {"all": 16.64, "mastery": 0.54, "basic": 18.55, "weak": 31.05}}, "note": null, "stemHTML": "What does <u>the prevalence of English</u> mean?"}, {"id": "115-36", "year": "115", "no": 36, "group": "35-39", "stem": "In the first reading, which is one of the ways that Anna Adams uses to make readers believe in her ideas?", "options": {"A": "Sharing her own life stories.", "B": "Borrowing from people’s experience.", "C": "Using examples from another language.", "D": "Showing information from news reports."}, "ans": "B", "tags": ["r_author"], "ex": "Adams 引用工程師 Helgi 和老師 Eirikur 的親身說法 → 借用別人的經驗。", "trap": "C：例子都是冰島語和英語的使用情況，不是「用另一種語言當例子」。", "goal": "指出作者的目的或態度", "perf": "3-Ⅳ-15", "cont": "Ae-Ⅳ-7", "rate": {"all": 0.4646, "disc": 0.52, "mastery": 0.9038, "basic": 0.3337, "weak": 0.2285}, "opts": {"A": {"all": 13.86, "mastery": 2.96, "basic": 15.32, "weak": 23.29}, "B": {"all": 46.46, "mastery": 90.38, "basic": 33.37, "weak": 22.85}, "C": {"all": 24.48, "mastery": 2.99, "basic": 32.52, "weak": 32.77}, "D": {"all": 14.99, "mastery": 3.66, "basic": 18.67, "weak": 20.49}}, "note": null}, {"id": "115-37", "year": "115", "no": 37, "group": "35-39", "stem": "Which words in the second reading are NOT used to describe Icelandic?", "options": {"A": "A language in its sickbed.", "B": "A dying language.", "C": "Our first language.", "D": "This beautiful language."}, "ans": "B", "tags": ["r_reference", "r_not"], "ex": "a dying language 出現在一般原則（語言至少要 35,000 人說才能免於成為垂死語言），不是用來形容冰島語。A 是「很多人認為」冰島語的狀態，C、D 都指冰島語。", "trap": "NOT 題加指涉題：要看每個詞在原句裡描述的是誰。", "goal": "掌握上下文意了解文章中的句法連貫：代詞指涉", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5022, "disc": 0.53, "mastery": 0.9077, "basic": 0.4066, "weak": 0.2336}, "opts": {"A": {"all": 16.19, "mastery": 2.06, "basic": 18.89, "weak": 26.82}, "B": {"all": 50.22, "mastery": 90.77, "basic": 40.66, "weak": 23.36}, "C": {"all": 19.99, "mastery": 4.89, "basic": 24.59, "weak": 27.9}, "D": {"all": 13.4, "mastery": 2.27, "basic": 15.73, "weak": 21.35}}, "note": null}, {"id": "115-38", "year": "115", "no": 38, "group": "35-39", "stem": "Are Anna Adams and Gunnar Eggertsson worried about the future of Icelandic?", "options": {"A": "No, they are not.", "B": "Yes, they both are.", "C": "Adams is, but Eggertsson is not.", "D": "Adams is not, but Eggertsson is."}, "ans": "C", "tags": ["r_author", "r_compare"], "ex": "Adams 結尾說 It may hap 012, "basic": 0.387, "weak": 0.2342}, "opts": {"A": {"all": 9.9, "mastery": 0.13, "basic": 9.41, "weak": 21.94}, "B": {"all": 49.1, "mastery": 90.12, "basic": 38.7, "weak": 23.42}, "C": {"all": 23.98, "mastery": 6.48, "basic": 29.81, "weak": 32.15}, "D": {"all": 16.71, "mastery": 3.26, "basic": 21.83, "weak": 21.74}}, "note": null, "cloze": true}, {"id": "115-43", "year": "115", "no": 43, "group": "40-43", "stem": "", "options": {"A": "wise", "B": "strong", "C": "honest", "D": "popular"}, "ans": "C", "tags": ["r_cloze", "r_main"], "ex": "種子是煮過的，不可能發芽，只有 Wong 誠實帶著空盆來 → honest。", "trap": "wise／strong／popular 都不是這個故事要考驗的品格。", "goal": "根據上下文辨認符合文意的字句（克漏字）", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-6", "rate": {"all": 0.6085, "disc": 0.66, "mastery": 0.9776, "basic": 0.5927, "weak": 0.2218}, "opts": {"A": {"all": 14.39, "mastery": 1.82, "basic": 17.09, "weak": 23.23}, "B": {"all": 12.57, "mastery": 0.29, "basic": 12.37, "weak": 26.88}, "C": {"all": 60.85, "mastery": 97.76, "basic": 59.27, "weak": 22.18}, "D": {"all": 11.37, "mastery": 0.06, "basic": 10.59, "weak": 25.75}}, "note": null, "cloze": true}], "groups": {"20-21": {"kind": "img", "img": "y115_g20", "title": "Fruit Tea DIY（網頁食譜）"}, "22-23": {"kind": "img", "img": "y115_g22", "title": "四格漫畫"}, "24-26": {"kind": "img", "img": "y115_g24", "title": "The Marigolds' Home 宣傳手冊與地圖"}, "27-28": {"kind": "html", "title": "The Nightingale Lady", "html": "<figure class='fr'><img data-img='y115_g27photo' alt='Photo: Ms. Harrison with the cello'></figure><p>One summer evening when English cello player Beatrice Harrison was practicing in her garden, she was joined by a visitor she did not expect.</p><p>The visitor was a nightingale. The small brown bird sang together with Harrison’s cello music, and the birdsong sounded like the piece she was playing. For the next few evenings, her visitor kept coming back, sometimes with several of its friends. Harrison decided that more people should hear the little singers.</p><p>So, on May 19, 1924, Harrison worked with the BBC, the UK’s national TV and radio station, and played in her garden. At first, the artist was playing alone. Fifteen minutes before the end of her playing, the nightingales began to sing with the cello.</p><p>The nightingale show was popular with radio listeners. It was repeated the next week, and for the next twelve years Harrison played on the radio with her garden friends. During this time, she got 50,000 fan letters. People called her “the Nightingale Lady.”</p>"}, "29-31": {"kind": "html", "title": "Action! US（網路文章）", "html": "<div class='web'><div class='webbar'>Action! US　｜ MOVIE ｜ TV ｜ MUSIC ｜ THEATER ｜ VIDEO ｜ Q&amp;A</div><p>With heavy hearts, we are here to say goodbye to Rose Lacey, a wonderful writer who will be sadly missed.</p><p>Rose and I first met in 2010. I was at a party to pick up my wife when I heard Rose explaining to her and her friends why <i>Get Across</i> was a great movie. Her ideas were so interesting that I invited her to write some articles about movies for <i>Action! US</i>. Rose was very excited and agreed right away.</p><p>Over the next ten years, Rose wrote more than 150 articles. Rose could always bring out something new from movies that we thought we knew so well. People often told me that Rose never failed to surprise them. Her articles often made them think whether they actually saw the same movie, but if they went to see it again, they experienced the movie in a whole new way.</p><p>In her short life of 40 years, Rose has made her mark on the world of movies with her articles for <i>Action! US</i>. We are lucky to have had her in our lives. She was a very special person.</p><p>Alex Jackson<br>Head of <i>Action! US</i></p></div><div class='gloss'>📖 article 文章</div>"}, "32-34": {"kind": "img", "img": "y115_g32", "title": "Sea Glass（步驟圖解）"}, "35-39": {"kind": "html", "title": "兩篇冰島語評論", "html": "<div class='news'><div class='newshd'><b>The Future of Icelandic</b><span>Scandinavian News<br>by Anna Adams</span></div><figure class='fr'><img data-img='y115_g35map' alt='map of Iceland and Scandinavia'></figure><p>Icelandic is a language that is spoken only in Iceland. It has a long history. But many Icelanders are worried that they’re losing Icelandic.</p><p>The reason for their worry is <u>the prevalence of English</u> in Iceland. “I use English when I talk to my housework robot, use my phone, and watch movies,” said Helgi Atlason, an engineer. There is a reason for that. Most of these products use English, and few companies care to change the language into Icelandic because there are only a small number of Icelandic speakers (314,000 people). Actually, you see English everywhere in Iceland.</p><p>Icelanders also speak and hear more English than Icelandic these days because many foreigners who come to live and work in Iceland speak only English. “We can’t use Icelandic abroad, and we’re not using it much in Iceland, either. How do you expect our kids will want to learn it?” said Eirikur Wilson, a teacher.</p><p>Will Iceland one day give up Icelandic for English? It may happen soon.</p></div><div class='news'><div class='newshd'><b>Our Future with Icelandic</b><span>Scandinavian News<br>by Gunnar Eggertsson</span></div><p>Many people think Icelandic is a language in its sickbed and that it needs to be saved. I understand their worries, but does the future of our language really look that bad?</p><p>According to Dr. David Clingingsmith, a language needs at least 35,000 speakers to be “safe” from becoming a dying language. There are now 314,000 Icelandic speakers. Also, every year Iceland spends 51.3 million Icelandic crowns (3.7 million US dollars) teaching Icelandic to machines: phones, computers, and robots. Icelandic is appearing more often in products. Most importantly, schools still teach Icelandic to children. Clearly, we are not giving up our first language.</p><p>However, I’m not saying that Iceland has done enough for Icelandic. Our country can do a better job at getting more people to speak this beautiful language. One way to do so is to give more language courses to foreigners. With much more work, I’m sure Icelandic can grow and even reach farther into the world.</p></div><div class='gloss'>📖 Icelander 冰島人　product 商品</div>"}, "40-43": {"kind": "html", "title": "國王與種子（克漏字）", "html": "<div class='book'><p>A long time ago, there was an old king who had no child of his own. The king was worried that his land would fall into the wrong hands after his death, so he decided to pick a child in his land to take the high seat. One day, he called all the children to his castle and gave each of them a seed. “Come back on New Year’s Day and show me what you have grown,” he said to them, “and I will <span class='blank' data-b='40'>40</span> .”</p><p>Every child brought their seeds home carefully. One of the children, Wong, planted his seed in a pot. He gave it water every day and made sure there was sun to help it grow. <span class='blank' data-b='41'>41</span> .</p><p>Then, Sung, the child of the richest family in the land, told people that a small plant was growing from his seed. He was <span class='blank' data-b='42'>42</span> . Everyone excitedly said that he would be king. Soon, one after another, more and more children were also saying that they had something in their pots. But Wong still didn’t find anything in his.</p><p>On the big day, when Wong brought his pot to the castle, he saw all the other children carrying interesting plants. Some had flowers in the shape of a bird, and some had grasses of different colors. Everyone proudly showed their plants to the king, but the king looked unhappy until he saw Wong’s pot. “I boiled the seeds before I gave them out, so no plants could grow from them.” The king looked seriously at the children. “There is only one child who is <span class='blank' data-b='43'>43</span> enough to be king.”</p><p>Ten years later, the king died. On his deathbed, he was not worried because he knew Wong would be a good king.</p></div>"}}}, "114": {"items": [{"id": "114-01", "year": "114", "no": 1, "group": null, "stem": "Look at the picture. A ____ is flying over the houses.", "options": {"A": "bird", "B": "butterfly", "C": "kite", "D": "plane"}, "ans": "D", "tags": ["r_picture", "v_noun"], "ex": "圖中房子上方飛過的是飛機：plane。", "trap": "先看清楚「在房子上方飛」的是哪一個東西，不要看到天空就選鳥。", "goal": "用圖表表徵文意（單題）", "perf": "3-Ⅳ-4", "cont": "B-Ⅳ-6", "rate": {"all": 0.8124, "disc": 0.55, "mastery": 0.9959, "basic": 0.8991, "weak": 0.4174}, "opts": {"A": {"all": 5.55, "mastery": 0.05, "basic": 2.74, "weak": 17.81}, "B": {"all": 6.33, "mastery": 0.11, "basic": 2.88, "weak": 20.79}, "C": {"all": 6.81, "mastery": 0.25, "basic": 4.47, "weak": 19.39}, "D": {"all": 81.24, "mastery": 99.59, "basic": 89.91, "weak": 41.74}}, "note": null, "img": "y114_q1", "imgFull": true}, {"id": "114-02", "year": "114", "no": 2, "group": null, "stem": "When I was a teenager, I was very ____ . But now, it’s easier for me to talk to people.", "options": {"A": "happy", "B": "lazy", "C": "popular", "D": "shy"}, "ans": "D", "tags": ["v_adj"], "ex": "But now, it's easier for me to talk to people（現在比較容易跟人說話）→ 以前很害羞：shy。", "trap": "But 表示前後相反，空格要和「容易跟人說話」相反。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7277, "disc": 0.72, "mastery": 0.9994, "basic": 0.8384, "weak": 0.1792}, "opts": {"A": {"all": 10.51, "mastery": 0.0, "basic": 5.26, "weak": 33.71}, "B": {"all": 8.57, "mastery": 0.02, "basic": 5.71, "weak": 24.54}, "C": {"all": 8.07, "mastery": 0.03, "basic": 5.18, "weak": 23.52}, "D": {"all": 72.77, "mastery": 99.94, "basic": 83.84, "weak": 17.92}}, "note": null}, {"id": "114-03", "year": "114", "no": 3, "group": null, "stem": "Lena doesn’t want to go ____ with John because she is afraid of water.", "options": {"A": "dancing", "B": "hiking", "C": "sailing", "D": "shopping"}, "ans": "C", "tags": ["v_verb", "v_colloc"], "ex": "她怕水 → 不想去航海：go sailing（go + V-ing 表示從事某活動）。", "trap": "hiking、dancing、sh c": 82.69, "weak": 23.42}}, "note": null}, {"id": "114-06", "year": "114", "no": 6, "group": null, "stem": "There are so many new ____ in the office. It’ll take me some time to remember who is who.", "options": {"A": "faces", "B": "ideas", "C": "rules", "D": "tools"}, "ans": "A", "tags": ["v_noun", "v_colloc"], "ex": "要花時間記住「誰是誰」→ 辦公室有很多新面孔（new faces＝新來的人）。", "trap": "rules／tools 和「記住誰是誰」無關。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7632, "disc": 0.65, "mastery": 0.998, "basic": 0.8656, "weak": 0.2751}, "opts": {"A": {"all": 76.32, "mastery": 99.8, "basic": 86.56, "weak": 27.51}, "B": {"all": 9.76, "mastery": 0.02, "basic": 4.81, "weak": 31.41}, "C": {"all": 8.41, "mastery": 0.04, "basic": 5.42, "weak": 24.46}, "D": {"all": 5.42, "mastery": 0.14, "basic": 3.2, "weak": 16.24}}, "note": null}, {"id": "114-07", "year": "114", "no": 7, "group": null, "stem": "I feel like a ____ . I was looking for my keys for hours but they have been in my pocket the whole time.", "options": {"A": "fool", "B": "ghost", "C": "king", "D": "stranger"}, "ans": "A", "tags": ["v_noun"], "ex": "找了好幾個小時的鑰匙，其實一直在口袋裡 → 覺得自己像個傻瓜：feel like a fool。", "trap": "stranger（陌生人）和「找不到其實在身上的鑰匙」沒有關係。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5952, "disc": 0.64, "mastery": 0.9741, "basic": 0.5645, "weak": 0.2068}, "opts": {"A": {"all": 59.52, "mastery": 97.41, "basic": 56.45, "weak": 20.68}, "B": {"all": 14.52, "mastery": 0.79, "basic": 16.68, "weak": 26.46}, "C": {"all": 7.74, "mastery": 0.01, "basic": 4.76, "weak": 22.99}, "D": {"all": 18.1, "mastery": 1.79, "basic": 22.06, "weak": 29.46}}, "note": null}, {"id": "114-08", "year": "114", "no": 8, "group": null, "stem": "Mr. and Mrs. Wu have three daughters. Two are in high school, and ____ is in elementary school.", "options": {"A": "each", "B": "the other", "C": "the one", "D": "the next"}, "ans": "B", "tags": ["g_pron"], "ex": "三個女兒：兩個讀高中，剩下的那一個讀小學 → the other（三者中剩下的最後一個）。", D": {"all": 10.63, "mastery": 0.23, "basic": 9.18, "weak": 25.96}}, "note": null}, {"id": "114-11", "year": "114", "no": 11, "group": null, "stem": "Jo won’t be happy if you’re late for his party tonight, so ____ sure that you arrive on time.", "options": {"A": "make", "B": "makes", "C": "to make", "D": "is making"}, "ans": "A", "tags": ["g_verbform"], "ex": "so 後面是一個新的祈使句（叫對方做事），祈使句用原形動詞：make sure that…。", "trap": "to make 不能單獨當句子的動詞。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.6092, "disc": 0.59, "mastery": 0.9577, "basic": 0.5892, "weak": 0.2353}, "opts": {"A": {"all": 60.92, "mastery": 95.77, "basic": 58.92, "weak": 23.53}, "B": {"all": 15.08, "mastery": 1.46, "basic": 16.36, "weak": 28.68}, "C": {"all": 16.84, "mastery": 2.73, "basic": 19.45, "weak": 28.29}, "D": {"all": 7.04, "mastery": 0.05, "basic": 5.21, "weak": 19.07}}, "note": null}, {"id": "114-12", "year": "114", "no": 12, "group": null, "stem": "You may have a long drive because of the terrible ____ . There are usually a lot of cars and buses during this time.", "options": {"A": "experience", "B": "machine", "C": "service", "D": "traffic"}, "ans": "D", "tags": ["v_noun"], "ex": "後句說這段時間通常有很多汽車和公車 → 交通很糟：terrible traffic。", "trap": "service（服務）、machine 和「很多車」無關。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7004, "disc": 0.72, "mastery": 0.9988, "basic": 0.784, "weak": 0.1751}, "opts": {"A": {"all": 12.02, "mastery": 0.07, "basic": 8.53, "weak": 33.36}, "B": {"all": 7.76, "mastery": 0.02, "basic": 5.27, "weak": 22.06}, "C": {"all": 10.06, "mastery": 0.03, "basic": 7.78, "weak": 26.63}, "D": {"all": 70.04, "mastery": 99.88, "basic": 78.4, "weak": 17.51}}, "note": null}, {"id": "114-13", "year": "114", "no": 13, "group": null, "stem": "In the future, there will ____ be greater basketball players than Stephen Curry, but now we believe he is the best!", "options": {"A": "again", "B": "already", "C": "never", "D": "perhaps"}, "ans": "D" all": 55.52, "mastery": 91.45, "basic": 49.23, "weak": 25.6}, "B": {"all": 17.42, "mastery": 5.59, "basic": 21.29, "weak": 23.6}, "C": {"all": 14.6, "mastery": 2.67, "basic": 16.62, "weak": 24.69}, "D": {"all": 12.33, "mastery": 0.29, "basic": 12.81, "weak": 25.68}}, "note": null}, {"id": "114-16", "year": "114", "no": 16, "group": null, "stem": "There are online videos that teach you exercises you can do at home. They’ll ____ you a trip to the gym, and some money too.", "options": {"A": "cost", "B": "give", "C": "keep", "D": "save"}, "ans": "D", "tags": ["v_verb", "v_colloc"], "ex": "在家看影片運動，可以省下去健身房的路程和錢：save you a trip（save + 人 + 東西）。", "trap": "cost 是「讓人花費」，意思相反；give 不能搭配 a trip 表示省下。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5614, "disc": 0.68, "mastery": 0.9666, "basic": 0.5206, "weak": 0.1624}, "opts": {"A": {"all": 11.58, "mastery": 0.68, "basic": 12.6, "weak": 22.47}, "B": {"all": 20.51, "mastery": 2.07, "basic": 24.76, "weak": 33.77}, "C": {"all": 11.64, "mastery": 0.58, "basic": 10.54, "weak": 27.02}, "D": {"all": 56.14, "mastery": 96.66, "basic": 52.06, "weak": 16.24}}, "note": null}, {"id": "114-17", "year": "114", "no": 17, "group": null, "stem": "Jane’s parents are always happy to see their grandchildren, but mine ____ less so when I visit them with my kids.", "options": {"A": "is", "B": "are", "C": "do", "D": "does"}, "ans": "B", "tags": ["g_agreement", "g_pron"], "ex": "mine＝my parents（複數），原句是 be happy → mine are less so（沒那麼高興）。", "trap": "do／does：前面的動詞是 be（are happy），所以要用 be 動詞代替，不能用助動詞 do。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.4758, "disc": 0.47, "mastery": 0.8376, "basic": 0.3813, "weak": 0.2378}, "opts": {"A": {"all": 17.27, "mastery": 2.09, "basic": 22.12, "weak": 25.46}, "B": {"all": 47.58, "mastery": 83.76, "basic": 38.13, "weak": 23.78}, "C": {"all": 21.21, "mastery": 12.0, "basic": 25.52, "weak": 23.37}, "D": {"all": 13.81, "mastery": 2.13, "basic": 14.19, "w "114-31", "year": "114", "no": 31, "group": "29-31", "stem": "What does did it in Picture 7 mean?", "options": {"A": "Fall to the ground.", "B": "Cut down the last trees.", "C": "Move the statues to fighting grounds.", "D": "Understand how important trees were."}, "ans": "B", "tags": ["r_reference"], "ex": "第 7 格：Those who cut down the last trees surely understood… but still, they did it → did it＝cut down the last trees。", "trap": "指涉要往前找最近、而且語意說得通的動作。", "goal": "掌握上下文意了解文章中的句法連貫：代詞指涉", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-6", "rate": {"all": 0.6866, "disc": 0.65, "mastery": 0.9907, "basic": 0.7173, "weak": 0.2622}, "opts": {"A": {"all": 7.54, "mastery": 0.06, "basic": 4.97, "weak": 21.65}, "B": {"all": 68.66, "mastery": 99.07, "basic": 71.73, "weak": 26.22}, "C": {"all": 9.85, "mastery": 0.42, "basic": 7.51, "weak": 25.82}, "D": {"all": 13.82, "mastery": 0.44, "basic": 15.76, "weak": 25.81}}, "note": null}, {"id": "114-32", "year": "114", "no": 32, "group": "32-34", "stem": "What did Ariely try to find out in the origami study?", "options": {"A": "If he could stop the IKEA effect.", "B": "Why people love making origami.", "C": "Why IKEA furniture is so famous.", "D": "If anyone shared his IKEA experience."}, "ans": "D", "tags": ["r_detail"], "ex": "Ariely wanted to know if anyone shared his feelings, so he did a fun origami study → D。", "trap": "C：研究和 IKEA 為什麼有名無關。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-8", "rate": {"all": 0.4592, "disc": 0.47, "mastery": 0.821, "basic": 0.3684, "weak": 0.2136}, "opts": {"A": {"all": 11.05, "mastery": 0.51, "basic": 11.07, "weak": 23.54}, "B": {"all": 18.8, "mastery": 6.93, "basic": 23.18, "weak": 24.0}, "C": {"all": 24.09, "mastery": 10.44, "basic": 28.85, "weak": 30.61}, "D": {"all": 45.92, "mastery": 82.1, "basic": 36.84, "weak": 21.36}}, "note": null}, {"id": "114-33", "year": "114", "no": 33, "group": "32-34", "stem": "Which is true about the origami study?", "options": {"A": "Buyers would spend less on builders’ origami than builders would.", "B": "Builders and buyers needed to decide a price on the origami they made.", "C": "Builders knew others would not pay as much for the origami as they would.", "D": "Buyers would spend more on builders’ origami after knowing how they were made."}, "ans": "A", "tags": ["r_detail"], "ex": "Buyers 只願付 5 分錢，builders 卻願意花 25 分錢 → 買家願付的比製作者少。", "trap": "B：buyers 沒有做摺紙；C：builders 以為別人也會付那麼多，剛好相反。", "goal": "找出已明確敘述的細節", "perf": "3-Ⅳ-16", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.5739, "disc": 0.63, "mastery": 0.98, "basic": 0.5113, "weak": 0.2184}, "opts": {"A": {"all": 57.39, "mastery": 98.0, "basic": 51.13, "weak": 21.84}, "B": {"all": 15.07, "mastery": 0.96, "basic": 17.54, "weak": 26.82}, "C": {"all": 13.62, "mastery": 0.3, "basic": 14.44, "weak": 27.79}, "D": {"all": 13.76, "mastery": 0.73, "basic": 16.82, "weak": 23.03}}, "note": null}, {"id": "114-34", "year": "114", "no": 34, "group": "32-34", "stem": "Jerry just can’t get his daughter Mia to eat more vegetables at dinner. Every time he tries to do so, there is always a lot of shouting and crying. If Jerry wants to have Mia eat more vegetables by using the IKEA effect, what should he do?", "options": {"A": "Tell Mia that he cooks the vegetables just for her.", "B": "Ask Mia to help him cook vegetables for her meal.", "C": "Give Mia her favorite candy after she eats vegetables.", "D": "Ask Mia what vegetables she likes and cook them for her."}, "ans": "B", "tags": ["r_infer"], "ex": "IKEA effect：自己動手做的東西會更喜歡 → 讓 Mia 幫忙煮自己要吃的青菜。", "trap": "D 只是照她的喜好煮，她沒有參與製作，不是 IKEA effect。", "goal": "依文意做出延伸推論", "perf": "3-Ⅳ-12", "cont": "D-Ⅳ-1", "rate": {"all": 0.5712, "disc": 0.61, "mastery": 0.978, "basic": 0.4951, "weak": 0.2422}, "opts": {"A": {"all": 12.83, "mastery": 1.12, "basic": 14.45, "weak": 23.45}, "B": {"all": 57.12, "mastery": 97.8, "basic": 49.51, "weak": 24.22}, "C": {"all": 15.06, "mastery": 0.37, "basic": 17.22, "weak": 28.17}, "D": {"all": 14.83, "mastery": 0.72, "basic": 18.76, "weak": 23.63}}, "note": null}, {"id": "114-35", "year": "114", "no": 35, "group": "35-37", "stem": "What is the reading mainly about?", "options": {"A": "The tips on using a picture to tell a story.", "B": "The change that electricity brought to people’s lives.", "C": "The history behind the picture of a UK electricity worker.", "D": "The story of a famous UK electricity worker from the 1970s."}, "ans": "C", "tags": ["r_main"], "ex": "文章從「圖中是 1970 年代的英國電力工人」開始，說明這張圖出現的背景（罷工、政府限電）→ 這張圖背後的歷史。", "trap": "B：限電改變生活只是其中一段，不是整篇主旨。", "goal": "指出內容的主旨", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-8", "rate": {"all": 0.5984, "disc": 0.56, "mastery": 0.9406, "basic": 0.564, "weak": 0.2613}, "opts": {"A": {"all": 9.19, "mastery": 1.03, "basic": 9.57, "weak": 18.13}, "B": {"all": 15.34, "mastery": 4.19, "basic": 17.43, "weak": 24.34}, "C": {"all": 59.84, "mastery": 94.06, "basic": 56.4, "weak": 26.13}, "D": {"all": 15.42, "mastery": 0.71, "basic": 16.5, "weak": 30.74}}, "note": null}, {"id": "114-36", "year": "114", "no": 36, "group": "35-37", "stem": "In the UK in the 1970s, what did people most likely think of the UK electricity workers?", "options": {"A": "They were not brave enough to fix their problems.", "B": "They worked like robots and never learned to change.", "C": "They were asking too much and did not know when to stop.", "D": "They did not care whether their job might hurt people’s health."}, "ans": "C", "tags": ["r_infer", "r_picture"], "ex": "工人第二次又要求加薪，人民為此受苦好幾個月；圖中工人伸手要錢 → 大家覺得他們要求太多、不知節制。", "trap": "D 說工人不在乎工作會傷害健康，文中沒有這個訊息。", "goal": "推論文中隱含的訊息", "perf": "3-Ⅳ-12", "cont": "D-Ⅳ-1", "rate": {"all": 0.4948, "disc": 0.49, "mastery": 0.8824, "basic": 0.3896, "weak": 0.2479}, "opts": {"A": {"all": 12.21, "mastery": 0.39, "basic": 13.79, "weak": 23.06}, "B": {"all": 16.81, "mastery": 2.57, "basic": 19.42, "weak": 28.41}, "C": {"all": 49.48, "mastery": 88.24, "basic": 38.96, "weak": 24.79}, "D": {"all": 21.33, "mastery": 8.8, "basic": 27.74, "weak": 23.17}}, "note": null}, {"id": "114-37", "year": "114", "no": 37, "group": "35-37", "stem": "Why does the writer put the “ ” mark around the word dark in the last sentence?", "options": {"A": "To say that the “dark” time was actually not dark.", "B": "To tell people that the word was said by the government.", "C": "To mean both the days without lights and the difficult lives people lived.", "D": "To show that the government and the electricity workers both lost their fights."}, "ans": "C", "tags": ["r_author"], "ex": "dark 同時指「限電時沒有燈」和「人民生活艱困」，所以加上引號表示特殊用法。", "trap": "A：那段時間是真的暗，也真的很苦，引號不是表示反話。", "goal": "指出作者的目的或態度", "perf": "3-Ⅳ-15", "cont": "Ae-Ⅳ-7", "rate": {"all": 0.5428, "disc": 0.56, "mastery": 0.932, "basic": 0.4667, "weak": 0.2349}, "opts": {"A": {"all": 17.45, "mastery": 5.27, "basic": 19.99, "weak": 26.76}, "B": {"all": 14.15, "mastery": 0.46, "basic": 15.77, "weak": 27.15}, "C": {"all": 54.28, "mastery": 93.2, "basic": 46.67, "weak": 23.49}, "D": {"all": 13.92, "mastery": 1.07, "basic": 17.46, "weak": 22.0}}, "note": null}, {"id": "114-38", "year": "114", "no": 38, "group": "38-43", "stem": "", "options": {"A": "starts", "B": "started", "C": "has started", "D": "will start"}, "ans": "B", "tags": ["r_cloze", "g_tense"], "ex": "in his first year of junior high school 是過去的特定時間 → 過去式 started。", "trap": "has started 是現在完成式，不能和過去特定時間連用。", "goal": "根據文意使用正確的動詞時態（克漏字）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.4496, "disc": 0.42, "mastery": 0.7627, "basic": 0.3751, "weak": 0.2289}, "opts": {"A": {"all": 18.53, "mastery": 4.6, "basic": 23.06, "weak": 25.87}, "B": {"all": 44.96, "mastery": 76.27, "basic": 37.51, "weak": 22.89}, "C": {"all": 27.15, "mastery": 19.06, "basic": 31.26, "weak": 28.39}, "D": {"all": 9.16, "mastery": 0.06, "basic": 8.08, "weak": 22.19}}, "note": null, "cloze": true}, {"id": "114-39", "year": "114", "no": 39, "group": "38-43", "stem": "", "options": {"A": "he got quite scared of two things", "B": "he still couldn’t understand two things", "C": "he couldn’t stop thinki D": "For example"}, "ans": "D", "tags": ["r_cloze", "g_conj"], "ex": "前句說 Portland 同時用了好幾種方法，後面列出隔離病人、停課、禁止活動 → For example。", "trap": "However 表示轉折，但前後語意一致。", "goal": "根據上下文辨認符合文意的字句（克漏字）", "perf": "3-Ⅳ-12", "cont": "Ae-Ⅳ-5", "rate": {"all": 0.6002, "disc": 0.64, "mastery": 0.9824, "basic": 0.5856, "weak": 0.2117}, "opts": {"A": {"all": 10.7, "mastery": 0.93, "basic": 9.72, "weak": 23.45}, "B": {"all": 9.87, "mastery": 0.27, "basic": 8.98, "weak": 22.27}, "C": {"all": 18.53, "mastery": 0.53, "basic": 22.01, "weak": 30.98}, "D": {"all": 60.02, "mastery": 98.24, "basic": 58.56, "weak": 21.17}}, "note": null, "cloze": true}], "groups": {"22-23": {"title": "Philip 與警察", "kind": "img", "img": "y113_g22"}, "24-25": {"title": "Baker's Kitchen 出爐時間表", "kind": "img", "img": "y113_g24"}, "26-27": {"title": "2021 Green Festival 公告與地圖", "kind": "img", "img": "y113_g26"}, "28-29": {"title": "兩則小氣主人的故事", "kind": "img", "img": "y113_g28"}, "30-32": {"title": "書醫生陳秉鴻", "kind": "img", "img": "y113_g30"}, "33-35": {"title": "Habibi & Hawara 餐廳", "kind": "img", "img": "y113_g33"}, "36-39": {"title": "讀者投書：讓絕種動物復活？", "kind": "img", "img": "y113_g36"}, "40-43": {"title": "1918 流感與社交距離（克漏字＋圖表）", "kind": "img", "img": "y113_g40"}}}, "112": {"items": [{"id": "112-01", "year": "112", "no": 1, "group": null, "stem": "Look at the picture. The man is holding a ____ of grapes in his hands.", "options": {"A": "bag", "B": "basket", "C": "bowl", "D": "box"}, "ans": "B", "tags": ["r_picture", "v_noun"], "ex": "圖中男子手裡拿著一籃葡萄：a basket of grapes。官方說明：本題與 108 年公告的參考試題相同，考試時一律給分，所以沒有通過率資料。", "trap": "", "goal": "用圖表表徵文意（單題）", "perf": "3-Ⅳ-2", "cont": "Ac-Ⅳ-4", "rate": {"all": null, "disc": null, "basic": null, "weak": null}, "opts": {"A": {"all": null, "basic": null, "weak": null}, "B": {"all": null, "basic": null, "weak": null}, "C": {"all": null, "basic": null, "weak": null}, "D": {"all": null, "basic": null, "weak": null}}, "note": "該題正確答案為B，惟該題與108年公告的參考試題本第1題內容相同，故一律給分，相關數據以--呈現。", "img": "y112_q1", "imgFull": true}, {"id": "112-02", "year": "112", "no": 2, "group": null, "stem": "Dennis enjoys ____ in public. He is proud of his beautiful voice.", "options": {"A": "dancing", "B": "drawing", "C": "shopping", "D": "singing"}, "ans": "D", "tags": ["v_verb", "g_verbform"], "ex": "他對自己美妙的「聲音」很自豪 → 喜歡在大家面前唱歌：enjoy singing。", "trap": "dancing／drawing 都與 voice 無關。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7292, "disc": 0.67, "basic": 0.8236, "weak": 0.2265}, "opts": {"A": {"all": 10.02, "basic": 7.44, "weak": 26.58}, "B": {"all": 9.48, "basic": 6.48, "weak": 26.51}, "C": {"all": 7.5, "basic": 3.7, "weak": 23.94}, "D": {"all": 72.92, "basic": 82.36, "weak": 22.65}}, "note": null}, {"id": "112-03", "year": "112", "no": 3, "group": null, "stem": "Mrs. Johnson can’t hear very well. If you need to talk to her, you must ____ .", "options": {"A": "explain", "B": "hurry", "C": "listen", "D": "shout"}, "ans": "D", "tags": ["v_verb"], "ex": "她聽力不好，跟她說話時必須大聲：shout。", "trap": "listen 是「你去聽」，但問題是她聽不清楚。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7097, "disc": 0.68, "basic": 0.7903, "weak": 0.2152}, "opts": {"A": {"all": 9.82, "basic": 7.71, "weak": 24.97}, "B": {"all": 8.24, "basic": 5.85, "weak": 22.6}, "C": {"all": 10.87, "basic": 7.4, "weak": 30.55}, "D": {"all": 70.97, "basic": 79.03, "weak": 21.52}}, "note": null}, {"id": "112-04", "year": "112", "no": 4, "group": null, "stem": "People got very excited when they watched Ms. Smith ____ at the party.", "options": {"A": "danced", "B": "dancing", "C": "has danced", "D": "to dance"}, "ans": "B", "tags": ["g_verbform"], "ex": "感官動詞 watch + 受詞 + V-ing／原形：watched Ms. Smith dancing（看到她正在跳舞）。", "trap": "danced：watch 後面的受詞補語不能用過去式；to dance 也不能接在 watch 後面。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5992, "disc": 0.57, "basic": 0.5852, "weak": 0.2385}, "opts": {"A": {"all": 18.35, "basic": 22.73, "weak": 23.88}, "B": {"all": 59.92, "basic": 58.52, "weak": 23.85}, "C": {"all": 12.77, "basic": 11.49, "weak": 29.9}, "D": {"all": 8.87, "basic": 7.24, "weak": 22.01}}, "note": null}, {"id": "112-05", "year": "112", "no": 5, "group": null, "stem": "I tried on these shoes in several different ____ , and I thought the white pair looked best on me.", "options": {"A": "colors", "B": "prices", "C": "shapes", "D": "sizes"}, "ans": "A", "tags": ["v_noun"], "ex": "後句說「白色那雙」最好看 → 試穿了不同的顏色：colors。", "trap": "sizes（尺寸）和「白色那雙」不對應。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7208, "disc": 0.63, "basic": 0.8002, "weak": 0.2507}, "opts": {"A": {"all": 72.08, "basic": 80.02, "weak": 25.07}, "B": {"all": 7.99, "basic": 4.1, "weak": 25.16}, "C": {"all": 7.35, "basic": 4.36, "weak": 21.87}, "D": {"all": 12.47, "basic": 11.49, "weak": 27.5}}, "note": null}, {"id": "112-06", "year": "112", "no": 6, "group": null, "stem": "Rex did not feel the earthquake this morning. He ____ in the park at the time.", "options": {"A": "jogged", "B": "was jogging", "C": "has jogged", "D": "would jog"}, "ans": "B", "tags": ["g_tense"], "ex": "地震發生的那個時候他「正在」公園慢跑 → 過去進行式 was jogging。", "trap": "has jogged 不能搭配 this morning 的某一時刻。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.7629, "disc": 0.57, "basic": 0.8197, "weak": 0.378}, "opts": {"A": {"all": 7.62, "basic": 5.88, "weak": 19.54}, "B": {"all": 76.29, "basic": 81.97, "weak": 37.8}, "C": {"all": 11.9, "basic": 9.75, "weak": 29.99}, "D": {"all": 4.09, "basic": 2.39, "weak": 12.3}}, "note": null}, {"id": "112-07", "year": "112", "no": 7, "group": null, "stem": "Mr. Lee has worked in the same store for ten years; he’s never thought about ____ his job.", "options": {"A": "changing", "B": "finding", "C": "remembering", "D": "starting"}, "ans": "A", "tags": ["v_verb", "g_verbform"], "ex": "同一家店做了十年，從沒想過換工作：think about changing his job。", "trap": "finding 是「找工作」，但他本來就有工作。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7221, "disc": 0.68, "basic": 0.8085, "weak": 0.2254}, "opts": {"A": {"all": 72.21, "basic": 80.85, "weak": 22.54}, "B": {"all": 9.39, "basic": 7.06, "weak": 24.96}, "C": {"all": 10.2, "basic": 6.9, "weak": 28.68}, "D": {"all": 8.09, "basic": 5.16, "weak": 23.44}}, "note": null}, {"id": "112-08", "year": "112", "no": 8, "group": null, "stem": "I didn’t take the bus today because it was ____ . All the seats were taken and a lot of students were standing.", "options": {"A": "dirty", "B": "fast", "C": "full", "D": "wrong"}, "ans": "C", "tags": ["v_adj"], "ex": "座位都坐滿、很多學生站著 → 公車很擠：full。", "trap": "", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.7387, "disc": 0.65, "basic": 0.8213, "weak": 0.2695}, "opts": {"A": {"all": 7.76, "basic": 4.97, "weak": 22.43}, "B": {"all": 10.03, "basic": 6.99, "weak": 27.69}, "C": {"all": 73.87, "basic": 82.13, "weak": 26.95}, "D": {"all": 8.24, "basic": 5.89, "weak": 22.54}}, "note": null}, {"id": "112-09", "year": "112", "no": 9, "group": null, "stem": "Don’t go away when you’re cooking, ____ the food might burn.", "options": {"A": "but", "B": "if", "C": "or", "D": "so"}, "ans": "C", "tags": ["g_conj"], "ex": "祈使句＋or＝「否則」：別走開，否則食物會燒焦。", "trap": "if：if 後面接條件，「如果食物會燒焦」語意不通。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.6372, "disc": 0.71, "basic": 0.6538, "weak": 0.1871}, "opts": {"A": {"all": 9.11, "basic": 5.77, "weak": 26.49}, "B": {"all": 19.56, "basic": 22.44, "weak": 36.02}, "C": {"all": 63.72, "basic": 65.38, "weak": 18.71}, "D": {"all": 7.5, "basic": 6.39, "weak": 18.37}}, "note": null}, {"id": "112-10", "year": "112", "no": 10, "group": null, "stem": "Jerry wanted to know ____ he was kicked off the soccer team, but no one gave him a good reason.", "options": {"A": "where", "B": "when", "C": "whether", "D": "why"}, "ans": "D", "tags": ["g_noun_clause"], "ex": "後句 no one gave him a good reason（理由）→ 他想知道「為什麼」被踢出隊：why。", "trap": "whether（是否）：他已經被踢出去了，要問的是原因。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.6495, "disc": 0.67, "basic": 0.6881, "weak": 0.1835}, "opts": {"A": {"all": 7.99, "basic": 5.75, "weak": 21.78}, "B": {"all": 12.5, "basic": 9.67, "weak": 32.7}, "C": {"all": 14.44, "basic": 15.74, "weak": 26.75}, "D": {"all": 64.95, "basic": 68.81, "weak": 18.35}}, "note": null}, {"id": "112-11", "year": "112", "no": 11, "group": null, "stem": "Jenny is already forty, doesn’t have a job and often makes trouble for her parents. To them, she is really a(n) ____ .", "options": {"A": "daughter", "B": "example", "C": "gift", "D": "headache"}, "ans": "D", "tags": ["v_noun"], "ex": "四十歲沒工作、常給父母惹麻煩 → 對父母來說是個頭痛人物：a headache。", "trap": "example（榜樣）意思相反。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.6533, "disc": 0.7, "basic": 0.7009, "weak": 0.1685}, "opts": {"A": {"all": 11.03, "basic": 11.17, "weak": 22.49}, "B": {"all": 14.06, "basic": 12.49, "weak": 33.32}, "C": {"all": 9.46, "basic": 6.23, "weak": 26.93}, "D": {"all": 65.33, "basic": 70.09, "weak": 16.85}}, "note": null}, {"id": "112-12", "year": "112", "no": 12, "group": null, "stem": "Ed and Jill ____ camping this weekend, so they have to finish their homework by Friday.", "options": {"A": "went", "B": "were going", "C": "are going", "D": "have gone"}, "ans": "C", "tags": ["g_tense"], "ex": "this weekend 是未來的計畫，所以要在週五前寫完作業 → 現在進行式表示已安排的未來：are going camping。", "trap": "were going 是過去時間，和 this weekend 的計畫不合。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.6258, "disc": 0.61, "basic": 0.6141, "weak": 0.2482}, "opts": {"A": {"all": 11.88, "basic": 11.91, "weak": 23.88}, "B": {"all": 14.49, "basic": 15.82, "weak": 27.72}, "C": {"all": 62.58, "basic": 61.41, "weak": 24.82}, "D": {"all": 10.93, "basic": 10.84, "weak": 23.16}}, "note": null}, {"id": "112-13", "year": "112", "no": 13, "group": null, "stem": "Doraemon, a blue Japanese robot cat, has hated mice since his ears ____ by a mouse.", "options": {"A": "bit", "B": "bite", "C": "were bitten", "D": "have bitten"}, "ans": "C", "tags": ["g_passive", "g_tense"], "ex": "耳朵「被」老鼠咬，是過去發生的一件事 → 過去式被動：were bitten。since 後面接過去的時間點或事件。", "trap": "have bitten：耳朵不會主動咬人，而且 since 子句要用過去式。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5799, "disc": 0.56, "basic": 0.5416, "weak": 0.2485}, "opts": {"A": {"all": 9.77, "basic": 9.25, "weak": 20.07}, "B": {"all": 11.25, "basic": 9.86, "weak": 26.77}, "C": {"all": 57.99, "basic": 54.16, "weak": 24.85}, "D": {"all": 20.86, "basic": 26.68, "weak": 27.87}}, "note": null}, {"id": "112-14", "year": "112", "no": 14, "group": null, "stem": "If we play some interesting games in class, there ____ more fun in learning English.", "options": {"A": "are", "B": "has", "C": "will be", "D": "will have"}, "ans": "C", "tags": ["g_tense"], "ex": "If 條件句，主要子句用未來：there will be more fun（there be 句型）。", "trap": "will have：there 句型要用 be 動詞，不能用 have。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.6175, "disc": 0.48, "basic": 0.6071, "weak": 0.2969}, "opts": {"A": {"all": 13.29, "basic": 13.23, "weak": 27.01}, "B": {"all": 8.22, "basic": 5.88, "weak": 22.35}, "C": {"all": 61.75, "basic": 60.71, "weak": 29.69}, "D": {"all": 16.61, "basic": 20.14, "weak": 20.5}}, "note": null}, {"id": "112-15", "year": "112", "no": 15, "group": null, "stem": "The ____ of this shop was so bad; I never got any answer after I emailed them my questions.", "options": {"A": "item", "B": "business", "C": "price", "D": "service"}, "ans": "D", "tags": ["v_noun"], "ex": "寄信問問題卻從沒得到回覆 → 這家店的服務很差：service。", "trap": "business（生意）不是回覆客人問題這件事。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5841, "disc": 0.7, "basic": 0.5582, "weak": 0.1682}, "opts": {"A": {"all": 12.38, "basic": 13.5, "weak": 23.96}, "B": {"all": 19.7, "basic": 24.34, "weak": 32.26}, "C": {"all": 9.38, "basic": 6.3, "weak": 26.51}, "D": {"all": 58.41, "basic": 55.82, "weak": 16.82}}, "note": null}, {"id": "112-16", "year": "112", "no": 16, "group": null, "stem": "It’s not easy to see those islands clearly from here on sunny days, and it’s even less ____ to see them on cloudy days.", "options": {"A": "difficult", "B": "lucky", "C": "possible", "D": "special"}, "ans": "C", "tags": ["v_adj", "g_compare"], "ex": "晴天都不容易看清楚，陰天「更不可能」看到：even less possible。", "trap": "difficult：even less difficult 會變成「更容易」，意思相反。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.5221, "disc": 0.61, "basic": 0.4372, "weak": 0.196}, "opts": {"A": {"all": 19.52, "basic": 26.07, "weak": 24.51}, "B": {"all": 19.96, "basic": 23.15, "weak": 35.71}, "C": {"all": 52.21, "basic": 43.72, "weak": 19.6}, "D": {"all": 8.17, "basic": 7.01, "weak": 19.74}}, "note": null}, {"id": "112-17", "year": "112", "no": 17, "group": null, "stem": "Do you remember the CD I was looking for for months? I ____ found it in a small shop. Look, here it is!", "options": {"A": "almost", "B": "even", "C": "finally", "D": "still"}, "ans": "C", "tags": ["v_adv"], "ex": "找了好幾個月的 CD，終於在一家小店找到：finally。", "trap": "almost found（幾乎找到）與「你看，就在這裡」矛盾。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.628, "disc": 0.68, "basic": 0.6257, "weak": 0.2131}, "opts": {"A": {"all": 12.15, "basic": 12.98, "weak": 24.19}, "B": {"all": 13.25, "basic": 13.23, "weak": 28.14}, "C": {"all": 62.8, "basic": 62.57, "weak": 21.31}, "D": {"all": 11.68, "basic": 11.2, "weak": 25.93}}, "note": null}, {"id": "112-18", "year": "112", "no": 18, "group": null, "stem": "Business at Jane’s shop has not been good these days. And the new supermarket across the street only makes things ____ .", "options": {"A": "easier", "B": "worse", "C": "more boring", "D": "more convenient"}, "ans": "B", "tags": ["v_adj", "g_compare"], "ex": "生意本來就不好，對面開了新超市只會讓情況更糟：makes things worse。", "trap": "more convenient：超市讓「顧客」更方便，但這句說的是 Jane 的生意；四成以上選這個。", "goal": "指出適合句中的單字或片語（單題）", "perf": "3-Ⅳ-5", "cont": "Ac-Ⅳ-4", "rate": {"all": 0.4903, "disc": 0.56, "basic": 0.3782, "weak": 0.2193}, "opts": {"A": {"all": 10.66, "basic": 11.22, "weak": 20.57}, "B": {"all": 49.03, "basic": 37.82, "weak": 21.93}, "C": {"all": 11.5, "basic": 9.4, "weak": 28.72}, "D": {"all": 28.67, "basic": 41.51, "weak": 28.31}}, "note": null}, {"id": "112-19", "year": "112", "no": 19, "group": null, "stem": "Scott wasn’t sure if the young woman before him was ____ pulled him out of a car on fire.", "options": {"A": "who", "B": "the one", "C": "the one she", "D": "the one who"}, "ans": "D", "tags": ["g_relative"], "ex": "was 後面要接名詞，再用關係子句修飾：the one who pulled him out…（把他從著火的車裡拉出來的那個人）。", "trap": "who：was 後面缺少名詞；the one she 多了主詞 she。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.5617, "disc": 0.65, "basic": 0.5266, "weak": 0.1718}, "opts": {"A": {"all": 15.48, "basic": 19.5, "weak": 23.23}, "B": {"all": 17.04, "basic": 17.66, "weak": 33.63}, "C": {"all": 11.18, "basic": 10.12, "weak": 25.52}, "D": {"all": 56.17, "basic": 52.66, "weak": 17.18}}, "note": null}, {"id": "112-20", "year": "112", "no": 20, "group": null, "stem": "I ____ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": {"A": "have practiced", "B": "am practicing", "C": "practiced", "D": "would practice"}, "ans": "C", "tags": ["g_tense"], "ex": "上高中「之前」練了幾年，後來放棄 → 過去已結束的事：簡單過去式 practiced。", "trap": "have practiced：現在完成式表示延續到現在，但他已經放棄了。本題超過一半的人選它。", "goal": "指出句中正確的文法（單題）", "perf": "3-Ⅳ-6", "cont": "Ad-Ⅳ-1", "rate": {"all": 0.3644, "disc": 0.28, "basic": 0.3229, "weak": 0.2102}, "opts": {"A": {"all": 44.44, "basic": 50.62, "weak": 34.01}, "B": {"all": 9.58, "basic": 8.01, "weak": 23.75}, "C": {"all": 36.44, "basic": 32.29, "weak": 21.02}, "D": {"all": 9.42, "basic": 9.06, "weak": 20.77}}, "note": null}, {"id": "112-21", "year": "112", "no": 21, "group": null, "stem": "
