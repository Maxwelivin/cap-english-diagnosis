    if(last.c&&!last.ok&&it.opts&&it.opts[last.c].basic!=null){const o=it.opts[last.c];p+=`｜我最近選的 (${last.c})：基礎組 ${o.basic}%、待加強組 ${o.weak}%`+(o.mastery!=null?`、精熟組 ${o.mastery}%`:"")+` 選它`}
    p+=`\n  參考解析：${it.ex}\n`}
  const pk=D.attempts.filter(a=>!ITEMS[a.q]);
  if(pk.length){p+=`\n## 先前補強題作答\n`;for(const a of pk.slice(-40)){const q=getQ(a.q);if(q)p+=`[${q.tag}] ${q.stem}｜選${a.c} ${a.ok?"對":"錯"}${a.g?"(猜)":""}\n`}}
  p+=`\n## 請你輸出\n1. **診斷摘要**（3–5 句）：整體程度、最需要補的地方。\n2. **弱點排序**：列出最弱的 2–4 個概念，每個都要引用上面的題號當證據，說明我「為什麼會錯」（例如：時態線索沒看到、只看字面、忽略否定條件），不要只說「答錯很多」。\n3. **錯誤模式**：跨題目的共同習慣（例如常掉進同一種陷阱、猜題多的區塊）。\n4. **補強建議**：具體可做的讀題步驟或檢查口訣。\n5. **補強包**：最後用一個 \`\`\`json 程式碼區塊輸出，格式如下（只能有一個 JSON 區塊、必須是合法 JSON）：\n`;
  p+="```json\n"+JSON.stringify({type:"cap-en-pack",version:1,title:"補強包標題（例如：時態線索＋指涉）",focus:["g_tense","r_reference"],cards:[{tag:"g_tense",title:"概念卡標題",points:["重點一","重點二"],examples:[{en:"English example.",zh:"中文翻譯"}],contrast:"常見混淆與如何分辨"}],questions:[{tag:"g_tense",stem:"Tom ____ TV when I called him last night.",options:{A:"watches",B:"was watching",C:"has watched",D:"will watch"},answer:"B",explain:"中文解析：說明線索與為什麼其他選項錯"}]},null,1)+"\n```\n";
  p+=`補強包規則：\n- 每個弱點概念 1 張概念卡、4–5 題四選一，共 12–20 題；tag 必須使用上面標籤表的 id。\n- 題目要自己出，不可照抄會考原題；難度貼近會考，用字以國中 2000 字為主。\n- 閱讀類概念可以出 60–120 字的短文題：把短文放進 stem，空一行後再寫問題。\n- 需要表格時，在 stem 裡每一列各占一行，格子用 | 分隔，第一列是標題列，例如 "Place | Opening Hours\nLake Garden | 10:00-17:00"；表格前後各空一行。\n- 每題的 explain 用繁體中文，要點出解題線索，並說明我最可能選錯的那個選項為什麼錯。\n- 答案分布要平均，不要集中在同一個字母。\n`;
  return p;
}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>toast("已複製"),()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){const t=document.createElement("textarea");t.value=s;t.style.position="fixed";t.style.top="0";document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,s.length);try{document.execCommand("copy");toast("已複製")}catch(e){toast("請手動複製")}t.remove()}
function copyPrompt(){copyText(buildPrompt())}
/* ---------- packs ---------- */
let PACK=null;
function vPacks(){
  setHead("補強");
  let h=`<div class="card"><h2>匯入補強包</h2><p class="mute small">把 AI 的整段回覆貼進來（含 \`\`\`json 區塊），程式會自動找出補強包。</p><textarea id="pk" placeholder="貼上 AI 的回覆…"></textarea><button class="btn block" onclick="importPack()">匯入</button></div>`;
  if(!D.packs.length)h+=`<div class="card"><p class="mute">還沒有補強包。先到「診斷」複製提示詞給 AI。</p></div>`;
  for(const p of D.packs.slice().reverse()){const ids=p.questions.map(q=>q.id);const L=latest();const done=ids.filter(i=>L[i]).length;const ok=ids.filter(i=>L[i]&&L[i].ok&&!L[i].g).length;
    h+=`<div class="card"><h2>${esc(p.title)}</h2><div>${(p.focus||[]).map(tagPill).join("")}</div><p class="small mute">${p.imported.slice(0,10)} 匯入｜${p.cards.length} 張概念卡｜${ids.length} 題｜已做 ${done}，確定答對 ${ok}</p><button class="btn block" onclick="openPack('${p.id}')">打開</button></div>`}
  app(h);
}
function extractJSON(s){const m=s.match(/```(?:json)?\s*([\s\S]*?)```/);let t=m?m[1]:s;const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<0)throw new Error("找不到 JSON");return JSON.parse(t.slice(a,b+1))}
function importPack(){
  let o;try{o=extractJSON(document.getElementById("pk").value)}catch(e){alert("讀不到補強包：請確認貼上的內容包含完整的 ```json 區塊。\n"+e.message);return}
  if(!Array.isArray(o.questions)||!o.questions.length){alert("補強包裡沒有題目（questions）。");return}
  const id="P"+Date.now().toString(36);const bad=[];
  const qs=o.questions.map((q,i)=>({id:`${id}-${i+1}`,tag:TAGS[q.tag]?q.tag:(bad.push(i+1),"r_infer"),stem:String(q.stem||""),options:{A:String(q.options?.A??""),B:String(q.options?.B??""),C:String(q.options?.C??""),D:String(q.options?.D??"")},ans:String(q.answer||"").trim().toUpperCase().slice(0,1),explain:String(q.explain||"")})).filter(q=>"ABCD".includes(q.ans)&&q.ans);
  const pack={id,title:String(o.title||"補強包"),focus:(o.focus||[]).filter(t=>TAGS[t]),cards:(o.cards||[]).map(c=>({tag:c.tag,title:String(c.title||""),points:(c.points||[]).map(String),examples:(c.examples||[]).map(e=>({en:String(e.en||""),zh:String(e.zh||"")})),contrast:String(c.contrast||"")})),questions:qs,imported:new Date().toISOString()};
  D.packs.push(pack);save();toast(`已匯入 ${qs.length} 題`+(bad.length?`（${bad.length} 題標籤不認得）`:""));openPack(id);
}
function openPack(id){PACK=id;go("pack")}
function vPack(){
  const p=D.packs.find(x=>x.id===PACK);setHead("補強包",`<button onclick="go('packs')">返回</button>`);
  let h=`<div class="card"><h2>${esc(p.title)}</h2><div>${(p.focus||[]).map(tagPill).join("")}</div></div>`;
  for(const c of p.cards){h+=`<div class="card"><div>${tagPill(c.tag)}</div><h2 style="margin-top:6px">${esc(c.title)}</h2><div class="concept"><ul>${c.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>${c.examples.map(e=>`<p class="en" style="margin:6px 0 0">${esc(e.en)}</p><p class="small mute" style="margin:0">${esc(e.zh)}</p>`).join("")}${c.contrast?`<p class="small" style="margin-top:10px"><b>易混淆：</b>${esc(c.contrast)}</p>`:""}</div>`}
  h+=`<button class="btn block" onclick="startPack('${p.id}')">開始作答補強題（${p.questions.length} 題）</button><button class="btn danger block" onclick="delPack('${p.id}')">刪除這個補強包</button><p class="note">補強題內容由 AI 生成；答錯的題目也會排進錯題複習。</p>`;
  app(h);
}
function delPack(id){if(!confirm("刪除補強包？作答紀錄會保留，但這些題目不會再出現在複習裡。"))return;D.packs=D.packs.filter(p=>p.id!==id);for(const k in D.srs)if(k.startsWith(id+"-"))delete D.srs[k];save();go("packs")}
/* ---------- learn ---------- */
let SKV=null,CK=null;
function goSkill(id){SKV=id;go("skill")}
const TAGORDER=["g_tense","g_pron","g_relative","g_verbform","g_passive","g_aux","g_tag","g_agreement","g_noun_clause","g_conj","g_compare","r_picture","r_detail","r_infer","r_main","r_wordguess","r_reference","r_author","r_compare","r_cloze","v_noun","v_verb","v_adj","v_adv","v_prep","v_colloc"];
function vLearn(){
  setHead("學習");const ws=weakSkills().filter(w=>LEARN[w.s]);
  let h=`<div class="card"><h2>怎麼用</h2><p class="small">每個小技能一頁：①規則 → ②例句 → ③小檢核（連對 3 題過關）→ ④會考原題驗收。<br>從「診斷」的錯題來，先學你錯過的；也可以照順序一頁一頁學。</p></div>`;
  if(ws.length){h+=`<div class="card"><h2>你最該先學的</h2>`;for(const w of ws.slice(0,6))h+=skRow(w.s,`錯 ${w.n} 題`);h+=`</div>`}
  for(const tag of TAGORDER){const ids=Object.keys(SK).filter(s=>SK[s].tag===tag);if(!ids.some(s=>LEARN[s]))continue;
    h+=`<div class="card"><h2>${tagPill(tag)}</h2>${ids.map(s=>skRow(s)).join("")}</div>`}
  const done=Object.keys(LEARN).length;
  h+=`<p class="note" style="text-align:center">已完成 ${done} / ${Object.keys(SK).length} 個小技能的學習頁；其他陸續製作中。規則、例句、小檢核為自擬。</p>`;
  app(h);
}
function skRow(s,extra){const st=D.learn[s];const ok=st&&st.passed;
  return `<button class="skrow ${LEARN[s]?"":"off"}" onclick="${LEARN[s]?`goSkill('${s}')`:""}"><span>${star(s)} ${esc(SK[s].name)} <span class="small mute">${extra||`會考 ${SK[s].n} 題`}</span></span><span class="small">${!LEARN[s]?"製作中":ok?"✓ 過關":(st&&st.tries?"練習中":"›")}</span></button>`}
function vSkill(){
  const s=SKV,P=LEARN[s],S=SK[s];setHead(S.name,`<button onclick="go('learn')">返回</button>`);
  const st=D.learn[s]||{};const its=skillItems(s);const L=latest();
  let h=`<div class="card"><div>${tagPill(S.tag)} <span class="small mute">${star(s)} 會考十年考過 ${S.n} 題</span></div><h2 style="margin-top:6px">${esc(S.name)}</h2><p>${esc(P.sum)}</p>${st.passed?`<p class="small" style="color:var(--ok)">✓ ${st.passed} 小檢核過關</p>`:""}</div>`;
  const R=P.rule;
  h+=`<div class="card"><h2>① 規則</h2><h3 style="margin-top:4px">什麼時候用</h3><ul style="padding-left:20px;margin:4px 0">${R.when.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="rulebox">${esc(R.form)}</div><h3>判斷步驟</h3><ol class="steps">${R.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${R.note&&R.note.length?`<h3>注意</h3><ul style="padding-left:20px;margin:4px 0">${R.note.map(x=>`<li class="small">${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
  h+=`<div class="card"><h2>② 例句</h2><p class="note"><span class="hc">黃底</span>＝線索；<span class="hv">綠字</span>＝這個文法。紅底＝錯誤句。</p>${P.ex.map(e=>`<div class="exl ${e.bad?"bad":""}"><div class="en" style="font-size:17px">${e.bad?"✗ ":""}${mk(e.en)}</div>${e.zh?`<div class="zh">${esc(e.zh)}</div>`:""}${e.why?`<div class="small" style="color:var(--ng)">${esc(e.why)}</div>`:""}</div>`).join("")}</div>`;
  h+=`<div class="card"><h2>③ 小檢核</h2><p class="small">由簡單到難：找線索 → 二選一 → 四選一。<b>連對 3 題</b>（最後一題要是四選一）就過關。共 ${P.ck.length} 題。</p><button class="btn block" onclick="startCheck('${s}')">${st.passed?"再練一次":"開始小檢核"}</button></div>`;
  const doneN=its.filter(q=>L[q]&&L[q].ok&&!L[q].g).length;
  h+=`<div class="card"><h2>④ 會考原題驗收</h2><p class="small">十年會考裡考這個小技能的題目共 ${its.length} 題，你確定答對 ${doneN} 題。${st.passed?"":"建議先過小檢核再做。"}</p><div class="small mute">${its.map(q=>{const a=L[q];return `<span style="margin-right:6px;color:${a?(a.ok&&!a.g?"var(--ok)":"var(--ng)"):"var(--mute)"}">${q.replace("-0","-")}</span>`}).join("")}</div>${its.length?`<button class="btn sec block" onclick="startOrig('${s}')">做會考原題（${Math.min(its.length,10)} 題）</button>`:""}</div>`;
  app(h);
}
function startOrig(s){const L=latest();const all=skillItems(s);const ids=shuffle(all.filter(i=>!L[i])).concat(shuffle(all.filter(i=>L[i]&&(!L[i].ok||L[i].g))),shuffle(all.filter(i=>L[i]&&L[i].ok&&!L[i].g))).slice(0,10);
  Q={mode:"practice",title:"原題："+SK[s].name,list:ids,i:0,done:{},back:s};go("quiz")}
function startCheck(s){const ck=LEARN[s].ck;const by=lv=>shuffle(ck.map((c,i)=>i).filter(i=>ck[i].lv===lv));
  CK={s,order:by(1).concat(by(2),by(3)),i:0,streak:0,pick:null,shown:false,passed:false,right:0,total:0};
  const st=D.learn[s]=D.learn[s]||{tries:0};st.tries++;save();go("check")}
function vCheck(){
  const P=LEARN[CK.s];setHead("小檢核："+SK[CK.s].name,`<button onclick="leaveCheck()">離開</button>`);
  if(CK.passed){app(`<div class="card" style="text-align:center"><div class="big">🎉 過關</div><p>連對 3 題！這次答對 ${CK.right} / ${CK.total} 題。</p><button class="btn block" onclick="startOrig('${CK.s}')">去做會考原題驗收</button><button class="btn sec block" onclick="leaveCheck()">回學習頁</button></div>`);return}
  if(CK.i>=CK.order.length){const ck=P.ck;CK.order=CK.order.concat(shuffle(ck.map((c,i)=>i).filter(i=>ck[i].lv>=2)));}
  const c=P.ck[CK.order[CK.i]];
  let h=`<div class="qhead"><span><span class="lv">${["","找線索","二選一","四選一"][c.lv]}</span>第 ${CK.total+(CK.shown?0:1)} 題</span><span>連對</span></div><div class="streak">${[0,1,2].map(k=>`<i class="${k<CK.streak?"on":""}"></i>`).join("")}</div>`;
  h+=`<div class="card"><div class="stem en qtext">${stemHTML(esc(c.q))}</div>`;
  for(const k of Object.keys(c.o)){let cls="opt";if(CK.shown){if(k===c.a)cls+=" right";else if(k===CK.pick)cls+=" wrong"}else if(k===CK.pick)cls+=" sel";
    h+=`<button class="${cls}" ${CK.shown?"disabled":""} onclick="CK.pick='${k}';render()"><span class="k">(${k})</span><span class="en" style="font-size:17px">${esc(c.o[k])}</span></button>`}
  if(CK.shown){const ok=CK.pick===c.a;h+=`<div class="fb ${ok?"ok":"ng"}"><h4>${ok?"✓ 答對":`✗ 正答 (${c.a})`}</h4><p>${esc(c.why)}</p>${ok?"":`<p class="small">連對歸零。不確定的話可以先回去看規則和例句。</p>`}</div>`}
  h+=`</div><div class="navq">${CK.shown?`<button class="btn" onclick="nextCheck()">下一題</button>`:`<button class="btn" ${CK.pick?"":"disabled"} onclick="answerCheck()">確認答案</button>`}</div>`;
  app(h);
}
function answerCheck(){const c=LEARN[CK.s].ck[CK.order[CK.i]];const ok=CK.pick===c.a;CK.shown=true;CK.total++;if(ok){CK.right++;CK.streak++}else CK.streak=0;
  if(ok&&CK.streak>=3&&c.lv===3){CK.passed=true;const st=D.learn[CK.s];st.passed=today();save();render();return}
  if(CK.streak>=3&&c.lv<3)CK.streak=2;render()}
function nextCheck(){CK.i++;CK.pick=null;CK.shown=false;render();window.scrollTo(0,0)}
function leaveCheck(){const s=CK.s;CK=null;SKV=s;go("skill")}
/* ---------- data ---------- */
function vData(){
  setHead("資料");
  const n=D.attempts.length;
  let h=`<div class="card"><h2>備份</h2><p class="mute small">紀錄只存在這台裝置的瀏覽器裡。建議每週匯出一次，存到 iCloud 雲碟或傳給自己。</p><p class="small">目前：${n} 筆作答、${D.tests.length} 次全卷、${D.packs.length} 個補強包、複習清單 ${Object.keys(D.srs).length} 題。</p><button class="btn block" onclick="exportFile()">下載備份檔（JSON）</button><button class="btn sec block" onclick="copyText(JSON.stringify(D))">複製備份內容</button></div>`;
  h+=`<div class="card"><h2>還原</h2><p class="mute small">選擇備份檔，或把備份內容貼進下面。還原會<b>取代</b>目前的紀錄。</p><input type="file" accept=".json,application/json" onchange="importFile(this)"><textarea id="rs" placeholder="或貼上備份內容…" style="min-height:90px;margin-top:8px"></textarea><button class="btn sec block" onclick="restoreText()">從貼上的內容還原</button></div>`;
  h+=`<div class="card"><h2>清除</h2><button class="btn danger block" onclick="wipe()">清除所有紀錄</button></div>`;
  h+=`<div class="card"><h2>關於</h2><p class="small">試題：${esc(BANK.source)}。<br>概念標籤、解析、易錯說明：自擬。<br>補強題：由 AI 依你的紀錄生成。<br>版本：${APPVER}</p><p class="small mute">在 iPhone 上，用 Safari 分享 →「加入主畫面」，就能像 App 一樣開啟，紀錄也比較不會被清掉。</p></div>`;
  app(h);
}
function exportFile(){const s=JSON.stringify({app:"cap-en-diag",exported:new Date().toISOString(),data:D},null,1);const b=new Blob([s],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`會考英文診斷_備份_${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function restoreObj(o){const d=o&&o.data?o.data:o;if(!d||!Array.isArray(d.attempts)){alert("這不是本工具的備份檔。");return}if(!confirm(`還原 ${d.attempts.length} 筆作答紀錄？目前的紀錄會被取代。`))return;D=Object.assign(blank(),d);save();toast("已還原");go("home")}
function importFile(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{restoreObj(JSON.parse(t))}catch(e){alert("檔案讀取失敗："+e.message)}})}
function restoreText(){try{restoreObj(JSON.parse(document.getElementById("rs").value))}catch(e){alert("內容不是合法的 JSON。")}}
function wipe(){if(!confirm("確定清除所有作答紀錄、複習清單和補強包？建議先匯出備份。"))return;if(!confirm("再確認一次：清除後無法復原。"))return;D=blank();save();go("home")}
/* ---------- zoom ---------- */
function zoom(k){const o=document.createElement("div");o.className="overlay";let w=100;o.innerHTML=`<div class="tools"><button id="zi">放大</button><button id="zo">縮小</button><button id="zc">關閉</button></div><img src="${imgURL(k)}">`;document.body.appendChild(o);const im=o.querySelector("img");const set=()=>{im.style.width=w+"%"};o.querySelector("#zi").onclick=()=>{w=Math.min(300,w+50);set()};o.querySelector("#zo").onclick=()=>{w=Math.max(100,w-50);set()};o.querySelector("#zc").onclick=()=>o.remove()}
render();
