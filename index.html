ont": null, "rate": {"all": 0.58}, "opts": null, "note": null, "img": "y108_q31", "imgFull": true}, {"id": "108-32", "year": "108", "no": 32, "group": "29-32", "stem": "Four people read the news and wrote what they thought about it. Mike Jan 16 8:26 pm The best time to drink coffee is when you want to drink coffee. Sarah Jan 16 8:43 pm I usually wake up AFTER I drink coffee! Charlie Jan 16 8:59 pm The worst time to drink coffee is when you're DEAD. Lisa Jan 16 9:18 pm If you need someone to tell you when to drink coffee, well, that’s just sad. What did they think about the news?", "options": {"A": "They wanted to try what it said.", "B": "They were sad about what it said.", "C": "They did not agree with what it said.", "D": "They were not surprised at what it said."}, "ans": "C", "tags": ["r_infer", "r_author"], "ex": "四則留言都在嘲諷（想喝就喝、死了才是最糟時間）→ 他們不同意報導。", "trap": "要看出留言的語氣是在反駁，不是真的難過。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null, "img": "y108_q32", "imgFull": true}, {"id": "108-33", "year": "108", "no": 33, "group": "33-35", "stem": "What does the report NOT suggest?", "options": {"A": "Having more free buses for shoppers.", "B": "Changing the opening hours on weekdays.", "C": "Making plans to help weekday morning business.", "D": "Changing the time of the special sale on weekends."}, "ans": "C", "tags": ["r_detail", "r_not"], "ex": "報告建議：增加週末接駁車、平日延長營業、把週末特賣移到下午。沒有提到平日早上 → C。", "trap": "NOT 題：要把每個建議和原文逐一對照。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.5}, "opts": null, "note": null}, {"id": "108-34", "year": "108", "no": 34, "group": "33-35", "stem": "What does the report say about the shopping center?", "options": {"A": "Its business on weekdays is not as good as last season.", "B": "It has a special sale one hour before closing every day.", "C": "Most of the shoppers take the free buses to the shopping center.", "D": "A large part of its shoppers on weekday evenings are working parents."}, "ans": "D", "tags": ["r_detail"], "ex": "平日晚上的顧客多是住附近的人和上班族父母，合起來將近 60% → D。", "trap": "A：比上一季差的是週末晚上，不是平日。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.35}, "opts": null, "note": null}, {"id": "108-35", "year": "108", "no": 35, "group": "33-35", "stem": "Which picture is most likely used in the report?", "options": {"A": "", "B": "", "C": "", "D": ""}, "ans": "B", "tags": ["r_picture"], "ex": "週末下午約一半（48%）、週末晚上第二（24%）、平日晚上（15%）比週末早上（10%）好 → B。", "trap": "四張圓餅圖的數字相同，只是對應的時段不同，要一一核對標籤。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.44}, "opts": null, "note": null, "img": "y108_q35", "imgFull": true}, {"id": "108-36", "year": "108", "no": 36, "group": "36-37", "stem": "", "options": {"A": "change the way you are", "B": "give up being an actress", "C": "travel with a theater group", "D": "run away from your friends"}, "ans": "A", "tags": ["r_cloze"], "ex": "她想變成大眼睛、細腿的女演員，後文提到醫生 → 想改變自己的樣子：change the way you are。", "trap": "B：她不是要放棄當演員，是想整形。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null, "cloze": true}, {"id": "108-37", "year": "108", "no": 37, "group": "36-37", "stem": "", "options": {"A": "you’re too shy to talk with people", "B": "you just don’t want to be like others", "C": "you don’t think you’re good enough", "D": "you don’t know what you’ve missed"}, "ans": "C", "tags": ["r_cloze"], "ex": "後文：如果妳不先喜歡自己，別人也不會 → 更讓人擔心的是妳覺得自己不夠好。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null, "cloze": true}, {"id": "108-38", "year": "108", "no": 38, "group": "38-41", "stem": "", "options": {"A": "has become", "B": "became", "C": "had become", "D": "would become"}, "ans": "D", "tags": ["r_cloze", "g_tense"], "ex": "當時（過去）沒人想到她「將會」成為女王 → 過去未來：would become。", "trap": "became 是事實的陳述，不能表達「當時沒人想到將來會」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null, "cloze": true}, {"id": "108-39", "year": "108", "no": 39, "group": "38-41", "stem": "", "options": {"A": "has fallen", "B": "is falling", "C": "had fallen", "D": "would fall"}, "ans": "C", "tags": ["r_cloze", "g_tense"], "ex": "他在當上國王「之前很久」就愛上了那位女士 → 過去完成式 had fallen in love。", "trap": "has fallen 是現在完成式，與過去的時間軸不合。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.59}, "opts": null, "note": null, "cloze": true}, {"id": "108-40", "year": "108", "no": 40, "group": "38-41", "stem": "", "options": {"A": "This changed Elizabeth’s life", "B": "It was not easy to give up the throne", "C": "It was good news to Elizabeth and her family", "D": "This part of history made the UK a strong country"}, "ans": "A", "tags": ["r_cloze"], "ex": "後文說伯父退位後，她成為王位第一順位、必須告別原本的生活 → 這件事改變了她的人生。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null, "cloze": true}, {"id": "108-41", "year": "108", "no": 41, "group": "38-41", "stem": "", "options": {"A": "has worked hard for the UK", "B": "has been popular with the people of the UK", "C": "has been the queen of the UK for a long time", "D": "has brought the people of the UK much closer"}, "ans": "A", "tags": ["r_cloze"], "ex": "冒號後說她和重要人士開會、出訪許多國家，只有少數時間留給自己 → 為英國努力工作。", "trap": "C：當女王很久是事實，但冒號後的內容說明的是她的工作。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null, "cloze": true}], "groups": {"16-17": {"title": "小詩：Making goulash", "kind": "img", "img": "y108_g16"}, "18-19": {"title": "City Sight Bus 觀光巴士", "kind": "img", "img": "y108_g18"}, "20-22": {"title": "Sarah 與 Mike 的對話", "kind": "img", "img": "y108_g20"}, "23-25": {"title": "細尾鷯鶯的蛋", "kind": "img", "img": "y108_g23"}, "26-28": {"title": "兩則新聞：紙紮與相聲", "kind": "img", "img": "y108_g26"}, "29-32": {"title": "VOF News：什麼時候喝咖啡最好", "kind": "img", "img": "y108_g29"}, "33-35": {"title": "購物中心市場報告", "kind": "img", "img": "y108_g33"}, "36-37": {"title": "給 Maggie 的信（克漏字）", "kind": "img", "img": "y108_g36"}, "38-41": {"title": "伊莉莎白二世（克漏字）", "kind": "img", "img": "y108_g38"}}}, "107": {"items": [{"id": "107-01", "year": "107", "no": 1, "group": null, "stem": "Look at the picture. The girl is ____ the clothes.", "options": {"A": "making", "B": "packing", "C": "showing", "D": "washing"}, "ans": "B", "tags": ["r_picture", "v_verb"], "ex": "圖中女孩正把衣服放進箱子裡打包：packing。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.8}, "opts": null, "note": null, "img": "y107_q1", "imgFull": true}, {"id": "107-02", "year": "107", "no": 2, "group": null, "stem": "The ____ is so strong today that my hair keeps blowing in the air.", "options": {"A": "rain", "B": "snow", "C": "sun", "D": "wind"}, "ans": "D", "tags": ["v_noun"], "ex": "頭髮一直被吹起來 → 風很大：wind。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.7}, "opts": null, "note": null}, {"id": "107-03", "year": "107", "no": 3, "group": null, "stem": "When the baby cried, Mr. Wu ____ in the kitchen and did not hear it.", "options": {"A": "cooked", "B": "was cooking", "C": "has cooked", "D": "is going to cook"}, "ans": "B", "tags": ["g_tense"], "ex": "寶寶哭的那個時候，吳先生「正在」廚房煮飯 → 過去進行式 was cooking。", "trap": "cooked 只說他煮了飯，不能表示「哭的當下正在煮」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "107-04", "year": "107", "no": 4, "group": null, "stem": "I don’t have any money with me because I ____ my wallet this morning.", "options": {"A": "had lost", "B": "would lose", "C": "lost", "D": "was losing"}, "ans": "C", "tags": ["g_tense"], "ex": "this morning 弄丟錢包，是過去發生的一件事 → 過去式 lost。", "trap": "had lost 是過去完成式，需要另一個更晚的過去時間點做對照。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "107-05", "year": "107", "no": 5, "group": null, "stem": "You need not only good luck but also hard work to become a ____ baseball player.", "options": {"A": "young", "B": "successful", "C": "happy", "D": "friendly"}, "ans": "B", "tags": ["v_adj"], "ex": "要靠運氣和努力才能成為「成功的」棒球選手：successful。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "107-06", "year": "107", "no": 6, "group": null, "stem": "The woman who lives next door to Ken is a ____ to him. They have never met and he doesn’t even know her name.", "options": {"A": "daughter", "B": "friend", "C": "stranger", "D": "teacher"}, "ans": "C", "tags": ["v_noun"], "ex": "從沒見過面、連名字都不知道 → 陌生人：stranger。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "107-07", "year": "107", "no": 7, "group": null, "stem": "With the new bus line, it is much more ____ for Fanny to go to school. It saves her a lot of time now.", "options": {"A": "useful", "B": "possible", "C": "interesting", "D": "convenient"}, "ans": "D", "tags": ["v_adj"], "ex": "新公車路線幫她省很多時間 → 上學方便多了：convenient。", "trap": "useful 不能接 for 人 to V 表示「做某事很方便」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null}, {"id": "107-08", "year": "107", "no": 8, "group": null, "stem": "Dad: Have you brushed your teeth yet? Ann: No, but I ____ before I go to bed.", "options": {"A": "haven’t", "B": "have", "C": "won’t", "D": "will"}, "ans": "D", "tags": ["g_aux"], "ex": "還沒刷牙，但睡前「會」刷 → I will (brush my teeth)。", "trap": "have：前面說了 No，表示還沒刷，不能再說已經刷了。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "107-09", "year": "107", "no": 9, "group": null, "stem": "Alice: Do you know ____ Grandma is going to visit us? Willy: It’s next week. She told me on the phone. And we’ll take her to the national park.", "options": {"A": "where", "B": "when", "C": "whether", "D": "why"}, "ans": "B", "tags": ["g_noun_clause"], "ex": "回答 It's next week → 問的是「什麼時候」：when。", "trap": "where：國家公園是之後要帶她去的地方，不是回答的重點。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.72}, "opts": null, "note": null}, {"id": "107-10", "year": "107", "no": 10, "group": null, "stem": "It took the police lots of time ____ who entered Liu’s house and killed her one year ago.", "options": {"A": "and found out", "B": "find out", "C": "finding out", "D": "to find out"}, "ans": "D", "tags": ["g_verbform"], "ex": "It takes + 人 + 時間 + to V：It took the police lots of time to find out…。", "trap": "finding out：這個句型要用不定詞。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.67}, "opts": null, "note": null}, {"id": "107-11", "year": "107", "no": 11, "group": null, "stem": "Many famous people visit this restaurant. ____ Popular singers like A-mei and Jay Chou here with their friends.", "options": {"A": "to be often seen", "B": "often seen", "C": "are often seen", "D": "and are often seen"}, "ans": "C", "tags": ["g_passive"], "ex": "歌手「被」看到 → 被動 are often seen（主詞 Popular singers 是複數）。", "trap": "B 少了 be 動詞，句子沒有主要動詞；D 多了 and。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.67}, "opts": null, "note": null}, {"id": "107-12", "year": "107", "no": 12, "group": null, "stem": "The factory has been throwing trash into the river for years. Now ____ must be taken to stop this.", "options": {"A": "action", "B": "chances", "C": "exercise", "D": "notes"}, "ans": "A", "tags": ["v_noun", "v_colloc"], "ex": "工廠多年來把垃圾倒進河裡 → 必須採取行動阻止：take action。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.63}, "opts": null, "note": null}, {"id": "107-13", "year": "107", "no": 13, "group": null, "stem": "The beach party tonight ____ the end of our summer vacation. Tomorrow we are all going back home and getting ready for school.", "options": {"A": "changes", "B": "marks", "C": "passes", "D": "saves"}, "ans": "B", "tags": ["v_verb"], "ex": "今晚的海灘派對「標誌著」暑假結束，明天就回家準備上學：mark the end of。", "trap": "change／pass 與 the end of 不是固定搭配；本題只有三成多答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.37}, "opts": null, "note": null}, {"id": "107-14", "year": "107", "no": 14, "group": null, "stem": "Anyone who reads Loren’s business plan will quickly see some serious problems in it, or ____ feel something is not right.", "options": {"A": "at least", "B": "even", "C": "in fact", "D": "still"}, "ans": "A", "tags": ["v_colloc"], "ex": "讀了計畫的人會看出嚴重問題，「至少」也會覺得不對勁：or at least。", "trap": "even 程度更強，但「覺得不對勁」比「看出嚴重問題」更弱，要用 at least。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.35}, "opts": null, "note": null}, {"id": "107-15", "year": "107", "no": 15, "group": null, "stem": "I’ve wanted to read The Diary of a Young Girl for months, ____ today I finally borrowed the book from the library.", "options": {"A": "and", "B": "since", "C": "so", "D": "until"}, "ans": "A", "tags": ["g_conj"], "ex": "想讀好幾個月了，「而」今天終於借到 → 前後是順接的兩件事：and。", "trap": "so：想讀很久「所以」今天借到，因果太牽強；本題只有兩成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.22}, "opts": null, "note": null}, {"id": "107-16", "year": "107", "no": 16, "group": "16-18", "stem": "", "options": {"A": "like a snake", "B": "that could move", "C": "except a little snake", "D": "that could make noise"}, "ans": "C", "tags": ["r_cloze"], "ex": "後句 Shortly after Robert saw it, it was gone → 他「只看到一條小蛇」：except a little snake。", "trap": "後面的 it 和 the snake he had just seen 都需要前面先出現蛇。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.51}, "opts": null, "note": null, "cloze": true}, {"id": "107-17", "year": "107", "no": 17, "group": "16-18", "stem": "", "options": {"A": "climbing up the bench", "B": "running after a woman", "C": "stopping beside his feet", "D": "falling down from a tree"}, "ans": "A", "tags": ["r_cloze"], "ex": "他嚇到不敢離開長椅 → 蛇正爬上長椅：climbing up the bench。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null, "cloze": true}, {"id": "107-18", "year": "107", "no": 18, "group": "16-18", "stem": "", "options": {"A": "The bench is broken", "B": "The seat has been taken", "C": "People will be scared by you", "D": "The paint of the bench is still wet"}, "ans": "C", "tags": ["r_cloze"], "ex": "女人是在叫她的寵物蛇 Robert 下來，所以說「你會嚇到別人」：People will be scared by you。", "trap": "要讀到故事結尾才知道這句話其實是對蛇說的。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null, "cloze": true}, {"id": "107-19", "year": "107", "no": 19, "group": "19-21", "stem": "", "options": {"A": "to make traffic lighter", "B": "to invite people to visit", "C": "to make itself a famous city", "D": "to build more parking spaces"}, "ans": "A", "tags": ["r_cloze"], "ex": "後文：控制停車位、計算進城車輛數，讓人少開車 → 讓交通量減少：to make traffic lighter。", "trap": "D：停車位總數是「保持不變」，不是增加。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.44}, "opts": null, "note": null, "cloze": true}, {"id": "107-20", "year": "107", "no": 20, "group": "19-21", "stem": "", "options": {"A": "This way", "B": "However", "C": "For example", "D": "Also"}, "ans": "D", "tags": ["r_cloze", "g_conj"], "ex": "前面說了第一種方法（停車位總量不變），這裡再加上第二種（計算車輛數）→ Also。", "trap": "For example 要接前面方法的例子，但這是新的方法；本題只有三成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.3}, "opts": null, "note": null, "cloze": true}, {"id": "107-21", "year": "107", "no": 21, "group": "19-21", "stem": "", "options": {"A": "why Zurich is doing this", "B": "what all this has cost Zurich", "C": "if Zurich should try other ways", "D": "if Zurich can deal with angry drivers"}, "ans": "A", "tags": ["r_cloze"], "ex": "後面回答：The city wants to make more space for its people → 你可能會好奇蘇黎世為什麼這樣做。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null, "cloze": true}, {"id": "107-22", "year": "107", "no": 22, "group": "22-24", "stem": "What is the reading mostly about?", "options": {"A": "Where to find a nice holiday apartment.", "B": "How to choose a nice holiday apartment.", "C": "Why one should choose a holiday apartment.", "D": "How one can change their house into a holiday apartment."}, "ans": "C", "tags": ["r_main"], "ex": "全文比較旅館和青年旅舍的缺點，強調度假公寓空間大又便宜 → 為什麼該選度假公寓。", "trap": "B：沒有教怎麼挑選。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.6}, "opts": null, "note": null}, {"id": "107-23", "year": "107", "no": 23, "group": "22-24", "stem": "From the reading, what can we learn about holiday apartments?", "options": {"A": "They are good for people who like to take one-day trips.", "B": "They are good for people who travel in a group of three or more.", "C": "They are good for people who want to make new friends when traveling.", "D": "They are good for people who like to spend their holidays in the country."}, "ans": "B", "tags": ["r_infer"], "ex": "公寓的價格是兩人價，第三、四人只要多付一點 → 適合三人以上一起旅行。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null}, {"id": "107-24", "year": "107", "no": 24, "group": "22-24", "stem": "What does it mean to say that something is at your disposal?", "options": {"A": "You are free to use it.", "B": "You can find it everywhere.", "C": "You know everything about it.", "D": "You can buy it at a lower price."}, "ans": "A", "tags": ["r_wordguess"], "ex": "後句：客廳、廚房、書房、臥室都供你使用 → at your disposal＝隨你使用。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.59}, "opts": null, "note": null}, {"id": "107-25", "year": "107", "no": 25, "group": "25-26", "stem": "What is the quick lesson of SHARP WEAR about?", "options": {"A": "How to get to one of SHARP WEAR’s stores.", "B": "How to send back a T-shirt to SHARP WEAR.", "C": "How to shop for a T-shirt from SHARP WEAR.", "D": "How to take care of a T-shirt from SHARP WEAR."}, "ans": "C", "tags": ["r_main", "r_picture"], "ex": "流程從選款式、顏色、圖案、口袋、尺寸到付款 → 如何購買 T 恤。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.65}, "opts": null, "note": null}, {"id": "107-26", "year": "107", "no": 26, "group": "25-26", "stem": "What can we learn about SHARP WEAR?", "options": {"A": "You have to order at least four T-shirts each time.", "B": "You can choose from sixteen colors for both the T-shirt and the pocket.", "C": "Some of the T-shirts have pictures on both the front side and the back side.", "D": "T-shirts in the wrong sizes cannot be sent back if they have pictures or pockets on them."}, "ans": "B", "tags": ["r_picture", "r_detail"], "ex": "T 恤有 16 色，口袋顏色也可以 Choose from the 16 colors AGAIN → B。", "trap": "A：4 是 T 恤的款式數，不是最少要買的件數。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null}, {"id": "107-27", "year": "107", "no": 27, "group": "27-28", "stem": "Which season is this poem about?", "options": {"A": "Spring.", "B": "Summer.", "C": "Autumn.", "D": "Winter."}, "ans": "A", "tags": ["r_detail"], "ex": "Winter is gone; spring has come → 春天。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "107-28", "year": "107", "no": 28, "group": "27-28", "stem": "What is a daisy?", "options": {"A": "A body part.", "B": "A kind of bird.", "C": "A kind of flower.", "D": "A kind of smell."}, "ans": "C", "tags": ["r_wordguess"], "ex": "People call the flower the \"day's eye\" → daisy 是一種花。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.63}, "opts": null, "note": null}, {"id": "107-29", "year": "107", "no": 29, "group": "29-31", "stem": "What does the reading say about shaking?", "options": {"A": "Different animals’ shaking begins with different body parts.", "B": "Shaking is a way that animals use to make other animals scared.", "C": "Animals that are not kept as pets do the shaking better than those that are.", "D": "Shaking themselves dry may help animals run faster in dangerous moments."}, "ans": "D", "tags": ["r_detail"], "ex": "身體濕會變重、跑不快，而跑得快慢決定生死 → 甩乾身體能幫助動物在危險時跑得更快。", "trap": "A：甩動都是從頭開始到尾巴結束。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.59}, "opts": null, "note": null}, {"id": "107-30", "year": "107", "no": 30, "group": "29-31", "stem": "What can we learn from the reading?", "options": {"A": "The animal’s tail can help it run more quickly and easily.", "B": "Some animals shake more than they need to get water off.", "C": "The idea of washing machines came from the shaking of dogs.", "D": "Larger animals get themselves drier at each shake than smaller animals."}, "ans": "D", "tags": ["r_infer"], "ex": "小動物要甩得比較快，大動物甩比較少次就能乾 → 大動物每甩一次甩掉的水比較多。", "trap": "C：只說狗甩水比洗衣機好，沒說洗衣機的點子來自狗。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.44}, "opts": null, "note": null}, {"id": "107-31", "year": "107", "no": 31, "group": "29-31", "stem": "The four pictures below show how fast tigers, cats and mice can shake. From the reading, which picture is most likely correct?", "options": {"A": "", "B": "", "C": "", "D": ""}, "ans": "B", "tags": ["r_picture", "r_infer"], "ex": "愈小的動物甩得愈快：老鼠最多、貓其次、老虎最少 → B。", "trap": "要先從文中歸納規則（小→快），再套到圖上。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.69}, "opts": null, "note": null, "img": "y107_q31", "imgFull": true}, {"id": "107-32", "year": "107", "no": 32, "group": "32-34", "stem": "What does things like that mean?", "options": {"A": "Problems about the free coffee plan.", "B": "Trouble for people who go to Flora Café.", "C": "Ways to make the free coffee plan successful.", "D": "Good things free coffee will bring to Flora Café."}, "ans": "A", "tags": ["r_reference"], "ex": "Eric 一直提出問題：店家會不會真的給、怎麼知道誰窮、窮人會不會怕丟臉 → things like that＝待用咖啡計畫的問題。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null}, {"id": "107-33", "year": "107", "no": 33, "group": "32-34", "stem": "What can we learn about Josh and Eric?", "options": {"A": "Josh was not able to change Eric’s mind about free coffee.", "B": "Eric has more hope for the free coffee plan than Josh does.", "C": "They found a way to make people feel OK to take free coffee.", "D": "They do not know whether Flora Café will do business honestly."}, "ans": "A", "tags": ["r_infer"], "ex": "對話最後 Eric 還說 Well, it may happen → Josh 沒能改變 Eric 的想法。", "trap": "B 把兩人的立場說反了。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null}, {"id": "107-34", "year": "107", "no": 34, "group": "32-34", "stem": "What do we know about Flora Café from the dialogue?", "options": {"A": "It has a way to know who really is poor.", "B": "Free coffee has brought it more business.", "C": "People pay less for free coffee than other coffee.", "D": "Its blackboard shows if there are free coffees to be taken."}, "ans": "D", "tags": ["r_detail"], "ex": "黑板寫著已付了幾杯、送出了幾杯 → 看得出還有沒有待用咖啡。", "trap": "A：Eric 正是擔心店家「沒辦法」知道誰真的窮。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "107-35", "year": "107", "no": 35, "group": "35-37", "stem": "Below are the writer’s points in the reading: a. Whether we should stop tribespeople whaling b. The problem of whaling c. Whaling as a way of life In what order does the writer talk about his points?", "options": {"A": "a c b.", "B": "b c a.", "C": "c a b.", "D": "c b a."}, "ans": "B", "tags": ["r_main"], "ex": "先講鯨魚數量銳減（b），再講捕鯨是部落的生活方式（c），最後討論該不該禁止部落捕鯨（a）→ b c a。", "trap": "要回到每一段的開頭句判斷段落主旨。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "107-36", "year": "107", "no": 36, "group": "35-37", "stem": "Which idea may the writer agree with?", "options": {"A": "We should stop all kinds of whale hunting.", "B": "We should not worry about the number of whales.", "C": "Tribespeople’s way of living is as important as animal lives.", "D": "Working with the whaling business can make tribespeople’s lives better."}, "ans": "C", "tags": ["r_author", "r_infer"], "ex": "作者提醒禁止捕鯨前，要想想我們要求部落放棄的是什麼 → 部落的生活方式和動物生命一樣重要。", "trap": "A：作者反對的正是「禁止所有捕鯨」；本題只有四成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.4}, "opts": null, "note": null}, {"id": "107-37", "year": "107", "no": 37, "group": "35-37", "stem": "What can we learn from the reading?", "options": {"A": "Tribespeople believe whales bring good luck.", "B": "Tribespeople become rich by selling whale oil.", "C": "Whaling was not a problem until 1,500 years ago.", "D": "Whaling helped tribespeople’s lives in different ways."}, "ans": "D", "tags": ["r_detail"], "ex": "部落捕鯨取得肉、用鯨油做蠟燭和油燈，也成為他們的生活方式 → 捕鯨在很多方面幫助他們。", "trap": "C：捕鯨從 1,500 年前就開始了，是後來數量下降才變成問題。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.51}, "opts": null, "note": null}, {"id": "107-38", "year": "107", "no": 38, "group": "38-41", "stem": "From the news story, which fact is seen as a new turn?", "options": {"A": "Carolyn Cole is a first-time writer.", "B": "Carolyn Cole won the Inscriber Prize.", "C": "Carolyn Cole is not the winner’s real name.", "D": "Carolyn Cole did not appear for the Inscriber Prize."}, "ans": "C", "tags": ["r_detail", "r_reference"], "ex": "新的轉折：Cole is not real. \"She\" is in fact Thomas Goode → Carolyn Cole 不是得主的真名。", "trap": "A、D 是上週已經知道的事，不是「新的」轉折。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.41}, "opts": null, "note": null}, {"id": "107-39", "year": "107", "no": 39, "group": "38-41", "stem": "Which is most likely true about the Inscriber Prize?", "options": {"A": "It was started by NBN News.", "B": "It is a new prize for picture books.", "C": "It is a prize only for first-time writers.", "D": "It is treated seriously by writers in the country."}, "ans": "D", "tags": ["r_infer"], "ex": "這是全國最大的書獎，Goode 想讓自己的書被認真看待才用假名去投 → 作家們很看重這個獎。", "trap": "C：只是這次「第一次」由新人得獎，不代表只頒給新人。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.39}, "opts": null, "note": null}, {"id": "107-40", "year": "107", "no": 40, "group": "38-41", "stem": "What can we learn about Thomas Goode?", "options": {"A": "He has won the Inscriber Prize twice.", "B": "He told NBN that Paper Soldier was his work.", "C": "He wants to be more than just a picture book writer.", "D": "His life as a picture book writer has not been successful."}, "ans": "C", "tags": ["r_infer"], "ex": "他寫過「嚴肅」的書，也想用別的名字讓人認真看待他的作品 → 不想只當繪本作家。", "trap": "D：他的繪本很成功，賣了上百萬本。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.52}, "opts": null, "note": null}, {"id": "107-41", "year": "107", "no": 41, "group": "38-41", "stem": "What do we know about Thomas Goode’s books?", "options": {"A": "The sales of Parent were bad.", "B": "Paper Soldier is his best-selling book.", "C": "His first picture book came out in 2006.", "D": "Blue Moon was written under a different name."}, "ans": "A", "tags": ["r_detail"], "ex": "there was little interest in Parent → 銷量很差。", "trap": "C：2006 年出版的是嚴肅作品 Parent，不是第一本繪本。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.43}, "opts": null, "note": null}], "groups": {"16-18": {"title": "公園裡的蛇（克漏字）", "kind": "img", "img": "y107_g16"}, "19-21": {"title": "蘇黎世減少車流（克漏字）", "kind": "img", "img": "y107_g19"}, "22-24": {"title": "Edward's Travel Tips：度假公寓", "kind": "img", "img": "y107_g22"}, "25-26": {"title": "SHARP WEAR 訂製 T 恤流程圖", "kind": "img", "img": "y107_g25"}, "27-28": {"title": "春天的小詩", "kind": "img", "img": "y107_g27"}, "29-31": {"title": "動物甩水", "kind": "img", "img": "y107_g29"}, "32-34": {"title": "待用咖啡（對話）", "kind": "img", "img": "y107_g32"}, "35-37": {"title": "部落捕鯨", "kind": "img", "img": "y107_g35"}, "38-41": {"title": "NBN News：神秘的得獎作家", "kind": "img", "img": "y107_g38"}}}, "106": {"items": [{"id": "106-01", "year": "106", "no": 1, "group": null, "stem": "Look at the picture. The dog is sitting ____ .", "options": {"A": "on the bag", "B": "next to the woman", "C": "inside the bag", "D": "between the woman and the bag"}, "ans": "B", "tags": ["r_picture", "v_prep"], "ex": "圖中狗狗坐在女子旁邊：next to the woman。", "trap": "要看清楚狗和袋子、女子的相對位置。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.83}, "opts": null, "note": null, "img": "y106_q1", "imgFull": true}, {"id": "106-02", "year": "106", "no": 2, "group": null, "stem": "My sister wants to buy a car ____ she doesn’t have enough money.", "options": {"A": "because", "B": "but", "C": "if", "D": "or"}, "ans": "B", "tags": ["g_conj"], "ex": "想買車「但是」錢不夠：but。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.85}, "opts": null, "note": null}, {"id": "106-03", "year": "106", "no": 3, "group": null, "stem": "Jim always forgets my birthday. He has asked me many times and still can’t ____ it.", "options": {"A": "answer", "B": "celebrate", "C": "remember", "D": "understand"}, "ans": "C", "tags": ["v_verb"], "ex": "他總是忘記我的生日，問了好多次還是記不住：remember。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.79}, "opts": null, "note": null}, {"id": "106-04", "year": "106", "no": 4, "group": null, "stem": "The little girl was ____ by a truck on her way home and was badly hurt.", "options": {"A": "hit", "B": "led", "C": "lost", "D": "paid"}, "ans": "A", "tags": ["g_passive", "v_verb"], "ex": "小女孩「被」卡車撞到並受重傷：was hit by a truck。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.7}, "opts": null, "note": null}, {"id": "106-05", "year": "106", "no": 5, "group": null, "stem": "Excuse me. I really need to go now. My kids ____ for me at school.", "options": {"A": "are waiting", "B": "were waiting", "C": "wait", "D": "waited"}, "ans": "A", "tags": ["g_tense"], "ex": "我現在得走了，孩子們「正在」學校等我 → 現在進行式 are waiting。", "trap": "were waiting 是過去，但說話者是現在要趕去。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.73}, "opts": null, "note": null}, {"id": "106-06", "year": "106", "no": 6, "group": null, "stem": "Amy’s father is very sick. The doctors can do nothing for him, so Amy went to the temple to ____ for him.", "options": {"A": "care", "B": "count", "C": "look", "D": "pray"}, "ans": "D", "tags": ["v_verb"], "ex": "醫生無能為力，所以去廟裡為他祈禱：pray for。", "trap": "care for／look for 和「去廟裡」不搭。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null}, {"id": "106-07", "year": "106", "no": 7, "group": null, "stem": "I’m glad that my school has students wear ____ . I don’t have to worry about what clothes to wear to school.", "options": {"A": "belts", "B": "caps", "C": "gloves", "D": "uniforms"}, "ans": "D", "tags": ["v_noun"], "ex": "不用煩惱穿什麼衣服上學 → 學校要求穿制服：uniforms。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.73}, "opts": null, "note": null}, {"id": "106-08", "year": "106", "no": 8, "group": null, "stem": "We are surprised that Sally and Ray decided to get married. No one knows ____ . They often fight with each other and are unhappy together.", "options": {"A": "why", "B": "where", "C": "when", "D": "how"}, "ans": "A", "tags": ["g_noun_clause"], "ex": "兩人常吵架、在一起不快樂，大家都不懂他們「為什麼」要結婚：why。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.68}, "opts": null, "note": null}, {"id": "106-09", "year": "106", "no": 9, "group": null, "stem": "I don’t think Katie will read any one of the books you’ve picked out for her: ____ look(s) very boring.", "options": {"A": "it", "B": "one", "C": "some", "D": "they"}, "ans": "D", "tags": ["g_pron", "r_reference"], "ex": "空格指「你挑的那些書」（複數）→ they look very boring。", "trap": "it 只能指單數；one 要指不特定的一本。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null}, {"id": "106-10", "year": "106", "no": 10, "group": null, "stem": "Jenny’s bag is very heavy because ____ filled with toy cars.", "options": {"A": "it is", "B": "they are", "C": "there is", "D": "there are"}, "ans": "A", "tags": ["g_pron", "g_passive"], "ex": "it 指 Jenny 的包包，包包「被」玩具車裝滿：it is filled with toy cars。", "trap": "they are 會指錯對象；there are 句型後面不能接 filled with。本題不到一半答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.46}, "opts": null, "note": null}, {"id": "106-11", "year": "106", "no": 11, "group": null, "stem": "____ a map with you when you go to a place for the first time.", "options": {"A": "Have taken", "B": "Take", "C": "Taking", "D": "To take"}, "ans": "B", "tags": ["g_verbform"], "ex": "句子沒有主詞，是祈使句（給建議）→ 原形動詞 Take a map…。", "trap": "To take／Taking 不能單獨當句子的主要動詞。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.53}, "opts": null, "note": null}, {"id": "106-12", "year": "106", "no": 12, "group": null, "stem": "The weather ____ rainy and cloudy in the last few days. I hope the sun will come out soon.", "options": {"A": "has been", "B": "had been", "C": "will be", "D": "would be"}, "ans": "A", "tags": ["g_tense"], "ex": "in the last few days（過去幾天到現在）一直下雨陰天 → 現在完成式 has been。", "trap": "had been 是過去完成式，要有另一個過去時間點對照。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.46}, "opts": null, "note": null}, {"id": "106-13", "year": "106", "no": 13, "group": null, "stem": "All the excuses Nick made ____ a lot about how much he hates to do the job.", "options": {"A": "say", "B": "saying", "C": "which say", "D": "to say"}, "ans": "A", "tags": ["g_verbform"], "ex": "主詞是 All the excuses（(that) Nick made 是修飾語），句子缺主要動詞 → say（說明了很多）。", "trap": "which say／saying／to say 都無法當主要動詞，句子會不完整；本題只有四成答對。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.4}, "opts": null, "note": null}, {"id": "106-14", "year": "106", "no": 14, "group": null, "stem": "Sabine walks so ____ in the apartment that sometimes you don’t even know she’s just passed by. You wonder if her feet ever touch the floor.", "options": {"A": "freely", "B": "lightly", "C": "shyly", "D": "slowly"}, "ans": "B", "tags": ["v_adv"], "ex": "她走路輕到你常不知道她經過，懷疑她腳有沒有碰地 → lightly。", "trap": "slowly／shyly 都不能解釋「聽不到腳步聲」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.44}, "opts": null, "note": null}, {"id": "106-15", "year": "106", "no": 15, "group": null, "stem": "In the past, people thought it was a ____ idea to send e-mails and read news online, but now it is part of our everyday life.", "options": {"A": "simple", "B": "popular", "C": "good", "D": "fresh"}, "ans": "D", "tags": ["v_adj"], "ex": "過去覺得寄 e-mail、上網看新聞是新奇的點子，但現在已是日常 → fresh（新的）。", "trap": "good／popular 和後半句「但現在已是日常」沒有對比關係。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.46}, "opts": null, "note": null}, {"id": "106-16", "year": "106", "no": 16, "group": "16-18", "stem": "What is the book festival for?", "options": {"A": "Selling second-hand books.", "B": "Telling people how to choose books.", "C": "Inviting people to change books with each other.", "D": "Knowing what kinds of books are the most popular."}, "ans": "C", "tags": ["r_main"], "ex": "帶一本書來就能換一本回家 → 邀請大家交換書。", "trap": "A：不是賣二手書，是用書換書。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.66}, "opts": null, "note": null}, {"id": "106-17", "year": "106", "no": 17, "group": "16-18", "stem": "Sonja is busy packing some books for the book festival. Which is most likely one of them?", "options": {"A": "An old dictionary of medicine.", "B": "A book of short stories in English.", "C": "A picture book with her own notes.", "D": "A workbook she used in her math class."}, "ans": "B", "tags": ["r_detail"], "ex": "不收課本、漫畫、字典，書要乾淨、沒有寫字 → 英文短篇故事書可以。", "trap": "C：書上寫了她自己的筆記，不符規定。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null}, {"id": "106-18", "year": "106", "no": 18, "group": "16-18", "stem": "Look at the calendar. If Sean has a book festival card, when can he use it?", "options": {"A": "March 3.", "B": "March 14.", "C": "March 23.", "D": "March 29."}, "ans": "C", "tags": ["r_picture", "r_detail"], "ex": "換書卡要在 3/16–3/31 使用，而且週一休館。對照月曆，3 月 23 日可以。", "trap": "D 3 月 29 日是星期一，圖書館休息。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.58}, "opts": null, "note": null, "img": "y106_q18", "imgFull": true}, {"id": "106-19", "year": "106", "no": 19, "group": "19-21", "stem": "What happened in the story?", "options": {"A": "A killer was caught by the police.", "B": "The writer’s family invited a stranger to dinner.", "C": "The writer’s brother ran to their parents for help.", "D": "A man ran away after he heard the writer’s mother’s voice."}, "ans": "D", "tags": ["r_detail"], "ex": "媽媽從遠處大叫，那個人就匆匆跑進黑暗中 → D。", "trap": "A：文中沒說殺人犯被抓到。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.62}, "opts": null, "note": null}, {"id": "106-20", "year": "106", "no": 20, "group": "19-21", "stem": "What can we learn about the writer and the man with a bag?", "options": {"A": "The man attacked the writer.", "B": "The writer followed the man into the dark.", "C": "The writer did not find out who the man was in the end.", "D": "The man did not want the writer to see things in his bag."}, "ans": "D", "tags": ["r_infer"], "ex": "東西掉出來後，他很快收回袋子，還生氣地看著他們 → 他不想讓作者看到袋子裡的東西。", "trap": "C：作者想起警方通緝的照片，認出他是殺人犯。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.67}, "opts": null, "note": null}, {"id": "106-21", "year": "106", "no": 21, "group": "19-21", "stem": "How do people feel when they experience something horrendous?", "options": {"A": "Angry.", "B": "Sad.", "C": "Scared.", "D": "Tired."}, "ans": "C", "tags": ["r_wordguess"], "ex": "全文描述遇到殺人犯、嚇到不能動 → horrendous 讓人害怕。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.75}, "opts": null, "note": null}, {"id": "106-22", "year": "106", "no": 22, "group": "22-24", "stem": "What does the catch mean in the dialogue?", "options": {"A": "A plan that starts well but ends badly.", "B": "A fact that everyone knows but never talks about.", "C": "A problem that is hidden behind something good.", "D": "An action that is right in one way but wrong in another."}, "ans": "C", "tags": ["r_wordguess"], "ex": "Ruth 送上好票和訂位，Nate 覺得不對勁，原來是要他照顧狗一週 → the catch＝好處背後藏著的麻煩。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.56}, "opts": null, "note": null}, {"id": "106-23", "year": "106", "no": 23, "group": "22-24", "stem": "What does it mean in the dialogue?", "options": {"A": "Taking care of Charlie.", "B": "Having dinner with Jessica.", "C": "Going to the football game.", "D": "Going to London for vacation."}, "ans": "A", "tags": ["r_reference"], "ex": "Nate 說 I need to think about it → 考慮要不要照顧 Charlie（狗）。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.64}, "opts": null, "note": null}, {"id": "106-24", "year": "106", "no": 24, "group": "22-24", "stem": "What do we know from the dialogue?", "options": {"A": "Ruth will go to London next Saturday.", "B": "Ruth had trouble booking a hotel room in London.", "C": "Nate is the first person that Ruth thought of for help.", "D": "Nate is surprised that Ruth was able to book a table at Leeds."}, "ans": "D", "tags": ["r_detail"], "ex": "Nate 說他昨天打去 Leeds，對方說整年都訂滿了 → 他很驚訝 Ruth 訂得到。", "trap": "A：Ruth 是「這個星期五」出發；C：Ruth 說 You're my last hope，Nate 是最後一個。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "106-25", "year": "106", "no": 25, "group": "25-26", "stem": "What is this reading for?", "options": {"A": "Telling people rules about hospital visits.", "B": "Getting people to stand up and speak for doctors.", "C": "Telling people how to find a good doctor for themselves.", "D": "Getting doctors to share their experiences in saving lives."}, "ans": "B", "tags": ["r_author", "r_main"], "ex": "醫生們說明過勞的危險，最後邀民眾週日上街一起爭取 → 號召大家站出來為醫生發聲。", "trap": "C：文章不是教人找好醫生。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.54}, "opts": null, "note": null}, {"id": "106-26", "year": "106", "no": 26, "group": "25-26", "stem": "What does this problem mean in the reading?", "options": {"A": "Doctors’ long working hours.", "B": "Doctors’ problems with nurses.", "C": "Doctors do not see enough people a day.", "D": "Doctors are not paid enough for their work."}, "ans": "A", "tags": ["r_reference"], "ex": "this problem 指前一段的醫生長時間工作、沒睡覺。", "trap": "", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.74}, "opts": null, "note": null}, {"id": "106-27", "year": "106", "no": 27, "group": "27-28", "stem": "What does Wonky Markt care about?", "options": {"A": "Supermarkets often sell “seconds” at a lower price.", "B": "Farmers don’t know how to grow fewer “seconds.”", "C": "“Seconds” are thrown away because of how they look.", "D": "People don’t know much about picking fresh “seconds.”"}, "ans": "C", "tags": ["r_main"], "ex": "長得醜的蔬果常被丟掉，因為超市認為顧客只愛漂亮的 → C。", "trap": "A：超市根本不買這些「次級品」。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.61}, "opts": null, "note": null}, {"id": "106-28", "year": "106", "no": 28, "group": "27-28", "stem": "What do we know about buying the “seconds” from Wonky Markt?", "options": {"A": "You can save 20-40% if you shop for a second time.", "B": "If you buy three boxes, you will need to pay NT$900.", "C": "You can choose not only their size but also their shape.", "D": "To win the cookbook, you need to buy at least six boxes."}, "ans": "B", "tags": ["r_detail"], "ex": "一箱 $250×3＝$750，未滿 $1,000 要付每箱 $50 手續費 $150 → $900。", "trap": "要記得加手續費，並確認總額沒超過 $1,000。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.47}, "opts": null, "note": null}, {"id": "106-29", "year": "106", "no": 29, "group": "29-30", "stem": "What can we learn from the reading?", "options": {"A": "No buses go from Apple City to Orange Island before the bus line changes.", "B": "Before July 1, those who want to visit Mango Island have to take a bus at Berry City.", "C": "Traveling from Apple City to Grape Town will take less time after the bus line changes.", "D": "Before July 1, Dashing Shuttle does not have buses from Apple City to Peach City."}, "ans": "A", "tags": ["r_detail"], "ex": "第 3 點：Dashing Shuttle 是第一家開 Apple City–Orange Island 路線的公司，7/1 才開始 → 之前沒有。", "trap": "D：第 1 點是「多加三班」，表示原本就有車。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.47}, "opts": null, "note": null}, {"id": "106-30", "year": "106", "no": 30, "group": "29-30", "stem": "Which is most likely Dashing Shuttle’s map of bus lines before July 1?", "options": {"A": "", "B": "", "C": "", "D": ""}, "ans": "D", "tags": ["r_picture", "r_infer"], "ex": "反推 7/1 前的路線：沒有 Orange Island 線、Peach City 班次少、到 Lemon／Berry City 要轉車、還有 Grape Town 線、到 Mango Island 要在 Melon City 轉車 → D。", "trap": "要把五項「變更」逐一倒推回去，再對照四張地圖。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.45}, "opts": null, "note": null, "img": "y106_q30", "imgFull": true}, {"id": "106-31", "year": "106", "no": 31, "group": "31-33", "stem": "What does the report say about globalization’s influence on the movie world?", "options": {"A": "It has changed the way of making movies.", "B": "It has changed a country’s domestic market for movies.", "C": "It has brought together movie makers from around the world.", "D": "It has helped US movies make more money abroad than in the US."}, "ans": "B", "tags": ["r_main"], "ex": "Chart 2 顯示各國國產電影在本國市場下滑 → 全球化改變了各國的國內電影市場。", "trap": "D：文中沒有比較美國電影在國外和國內賺的錢。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.55}, "opts": null, "note": null}, {"id": "106-32", "year": "106", "no": 32, "group": "31-33", "stem": "What can we learn from the report?", "options": {"A": "The American way of thinking may be changed when it is brought to other countries.", "B": "More and more people are asking their country to help their domestic movie business.", "C": "US movies are popular in foreign markets because English is spoken in many countries.", "D": "The fact that US movies are popular may mean the American way of thinking is popular."}, "ans": "D", "tags": ["r_infer"], "ex": "When people welcome US movies…, they in fact also say yes to the American way of thinking → D。", "trap": "A 把方向說反了：被改變的是其他國家的思考方式。", "goal": null, "perf": null, "cont": null, "rate": {"all": 0.47}, "opts": null, "note": null}, {"id": "106-33", "year": "106", "no": 33, "group": "31-33", "stem": "From the charts, which is true?", "options": {"A": "The percentage (%) of US movies has changed the least in Spain.", "B": "In each of the five countries, the percentage (%) of domestic movies has fallen.", "C": "Of all five countries, UK’s domestic movies have the smallest drop in percentage (%).", "D": "When the percentage (%) of domestic movies drops, the percentage of US movies rises."}, "ans": "B", "tags": ["r -28": ["WG2"], "114-29": ["MN1", "PIC7"], "114-30": ["DET1", "PIC7"], "114-31": ["REF2"], "114-32": ["DET1"], "114-33": ["DET1"], "114-34": ["INF3"], "114-35": ["MN1"], "114-36": ["INF1", "PIC7"], "114-37": ["AUT1"], "114-38": ["CLZ1", "T6"], "114-39": ["CLZ1"], "114-40": ["CLZ1"], "114-41": ["CLZ1"], "114-42": ["CLZ1"], "114-43": ["CLZ1", "T12"], "115-01": ["PIC1", "VN"], "115-02": ["VV"], "115-03": ["VN", "VC"], "115-04": ["VD"], "115-05": ["VV", "VC"], "115-06": ["VP"], "115-07": ["VA"], "115-08": ["AQ1", "S1"], "115-09": ["PR5"], "115-10": ["NC1"], "115-11": ["RC1"], "115-12": ["PR1"], "115-13": ["VN", "VC"], "115-14": ["VA", "VC"], "115-15": ["VV"], "115-16": ["T4"], "115-17": ["T6"], "115-18": ["VC", "REF1"], "115-19": ["T1"], "115-20": ["DET2"], "115-21": ["DET1"], "115-22": ["INF1", "PIC7"], "115-23": ["WG2"], "115-24": ["DET1"], "115-25": ["DET2", "INF2"], "115-26": ["PIC4"], "115-27": ["MN1"], "115-28": ["REF3"], "115-29": ["MN3"], "115-30": ["DET1"], "115-31": ["INF2"], "115-32": ["MN3"], "115-33": ["PIC7", "DET1"], "115-34": ["INF2"], "115-35": ["WG1"], "115-36": ["AUT1"], "115-37": ["REF3"], "115-38": ["AUT2", "CMP1"], "115-39": ["CMP1", "INF2"], "115-40": ["CLZ1"], "115-41": ["CLZ1"], "115-42": ["CLZ1"], "115-43": ["CLZ1", "MN1"]}, "learn": {"T1": {"sum": "說話的「這一刻」正在做的事，用 am／is／are＋V-ing。", "rule": {"when": ["說話當下正在發生的動作", "句子裡有「此刻」的線索：now、right now、at the moment、Look!、Listen!、Be quiet!", "對話中「不行，我正在…」的回答"], "form": "主詞＋am／is／are＋V-ing", "steps": ["找線索：有沒有 now、Look!、Listen! 這類「此刻」的字？", "有 → 用進行式；看主詞決定 am／is／are", "動詞加 -ing：make→making（去 e）、run→running、sit→sitting（短母音重複字尾）"], "note": ["和簡單現在式的差別：every day、usually、often 是「習慣」，用簡單現在式（He walks to school every day）", "know、like、want、need、have（擁有）這類「狀態動詞」通常不用進行式：說 I know，不說 I am knowing"]}, "ex": [{"en": "{{Look!}} The bus [[is coming]].", "zh": "你看！公車來了。"}, {"en": "{{Listen!}} Someone [[is singing]] next door.", "zh": "你聽！隔壁有人在唱歌。"}, {"en": "I can't talk {{now}}. I [[am cooking]] dinner.", "zh": "我現在不能講話，我在煮晚餐。"}, {"en": "{{Be quiet!}} The baby [[is sleeping]].", "zh": "安靜！寶寶在睡覺。"}, {"en": "A: Can you help me? B: Sorry, I [[am doing]] my homework {{right now}}.", "zh": "抱歉，我現在正在寫功課。"}, {"en": "She {{usually}} walks to school, but {{today}} she [[is taking]] the bus.", "zh": "她平常走路上學，但今天搭公車。（習慣 vs 此刻）"}, {"en": "Look! The dog runs after a cat.", "zh": "", "bad": true, "why": "Look! 表示此刻正在發生 → The dog is running after a cat."}, {"en": "I am knowing the answer.", "zh": "", "bad": true, "why": "know 是狀態動詞，不用進行式 → I know the answer."}], "ck": [{"lv": 1, "q": "Listen! The birds are singing in the tree.\n哪一個字告訴你要用現在進行式？", "o": {"A": "Listen!", "B": "birds", "C": "in", "D": "tree"}, "a": "A", "why": "Listen!（你聽！）表示說話這一刻正在發生。"}, {"lv": 1, "q": "Sorry, I can't go out now. I'm washing the dishes.\n哪一個字是「此刻」的線索？", "o": {"A": "Sorry", "B": "out", "C": "now", "D": "dishes"}, "a": "C", "why": "now＝現在、此刻。"}, {"lv": 2, "q": "Look! The cat ____ on the roof.", "o": {"A": "walks", "B": "is walking"}, "a": "B", "why": "Look! → 此刻正在走 → is walking。"}, {"lv": 2, "q": "My dad ____ coffee every morning.", "o": {"A": "drinks", "B": "is drinking"}, "a": "A", "why": "every morning 是習慣，用簡單現在式。"}, {"lv": 2, "q": "Shh! Grandpa ____ in the next room.", "o": {"A": "sleeps", "B": "is sleeping"}, "a": "B", "why": "Shh!（噓）表示他「現在」正在睡。"}, {"lv": 3, "q": "Mom: Where is Kevin?\nDad: He ____ basketball in the park now.", "o": {"A": "plays", "B": "played", "C": "is playing", "D": "has played"}, "a": "C", "why": "now → 此刻正在打球。"}, {"lv": 3, "q": "Don't turn off the TV! I ____ it.", "o": {"A": "watch", "B": "am watching", "C": "watched", "D": "will watch"}, "a": "B", "why": "叫對方別關電視，因為我「正在」看。"}, {"lv": 3, "q": "Be careful! A car ____ toward you!", "o": {"A": "comes", "B": "came", "C": "is coming", "D": "has come"}, "a": "C", "why": "Be careful! → 車子此刻正朝你開過來。"}]}, "T2": {"sum": "已經安排好、很快就要發生的事，也可以用現在進行式表示未來。", "rule": {"when": ["已經計畫或安排好的未來（買了票、約好了、正在準備）", "句子裡有未來時間：tonight、tomorrow、this weekend、next week…", "「即將到來」：Christmas is coming、Summer vacation is coming"], "form": "am／is／are＋V-ing＋未來時間", "steps": ["看時間：說的是未來嗎？", "是不是已經安排好（有票、有約、要先準備）？", "是 → 可用 be＋V-ing（也可以用 be going to）"], "note": ["臨時決定、預測，通常用 will（The phone is ringing. I'll get it.）", "未來的事不能用過去式：this weekend 的計畫不能說 were going"]}, "ex": [{"en": "We [[are flying]] to Tokyo {{tomorrow morning}}. We already have the tickets.", "zh": "我們明天早上飛東京，機票已經買好了。"}, {"en": "I [[am meeting]] Amy {{tonight}}, so I can't go with you.", "zh": "我今晚跟 Amy 有約，所以不能跟你去。"}, {"en": "{{Christmas}} [[is coming]]. Let's buy some gifts.", "zh": "聖誕節快到了，我們去買禮物吧。"}, {"en": "They [[are having]] a party {{this Saturday}}. Are you going?", "zh": "他們這週六要辦派對，你要去嗎？"}, {"en": "Ben [[is visiting]] his grandma {{next Sunday}}, so he has to finish his homework by Saturday.", "zh": "Ben 下週日要去看奶奶，所以要在週六前寫完功課。"}, {"en": "We were going camping this weekend, so we have to pack now.", "zh": "", "bad": true, "why": "this weekend 是未來的計畫，不能用過去式 → We are going camping this weekend."}], "ck": [{"lv": 1, "q": "I'm seeing the dentist tomorrow afternoon.\n這句說的是什麼時候的事？", "o": {"A": "現在正在發生", "B": "過去的事", "C": "已安排好的未來", "D": "每天的習慣"}, "a": "C", "why": "tomorrow afternoon 是未來，而且已經約好了。"}, {"lv": 2, "q": "Hurry up! The train ____ in five minutes.", "o": {"A": "is leaving", "B": "left"}, "a": "A", "why": "五分鐘後要開（已排定的未來）→ is leaving。"}, {"lv": 2, "q": "We ____ a test next Monday, so I'm studying now.", "o": {"A": "had", "B": "are having"}, "a": "B", "why": "next Monday 是未來，考試已排定。"}, {"lv": 3, "q": "My cousin ____ to Taiwan next month. She already bought her plane ticket.", "o": {"A": "came", "B": "comes", "C": "has come", "D": "is coming"}, "a": "D", "why": "next month＋已買機票 → 已安排的未來。"}, {"lv": 3, "q": "Summer vacation ____. What are your plans?", "o": {"A": "came", "B": "is coming", "C": "has came", "D": "was coming"}, "a": "B", "why": "暑假「快到了」，接著問你的計畫 → is coming。"}, {"lv": 3, "q": "I can't play tennis with you tomorrow. I ____ my uncle at the airport.", "o": {"A": "met", "B": "have met", "C": "am meeting", "D": "was meeting"}, "a": "C", "why": "tomorrow 已經安排要去接舅舅。"}]}, "T3": {"sum": "在過去某個「明確時間」發生、而且已經結束的事，用簡單過去式。", "rule": {"when": ["句子裡有明確的過去時間：yesterday、last night、two years ago、in 2019、this morning（說話時已經過了）", "when I was a child、when he was six 這種過去的時段", "故事、經驗的敘述"], "form": "動詞過去式（V-ed 或不規則變化）；否定：didn't＋原形", "steps": ["找過去時間詞（ago、last、yesterday、in＋年份、when＋過去式）", "有明確過去時間 → 用簡單過去式，不能用現在完成式", "檢查不規則動詞：go→went、lose→lost、write→wrote、take→took、buy→bought、break→broke"], "note": ["有明確過去時間時，絕對不能用 have／has＋p.p.（✗ I have seen him yesterday）", "否定和疑問用 did：He didn't come.／Did you see it?（後面接原形）"]}, "ex": [{"en": "I [[lost]] my wallet {{this morning}}, so I have no money now.", "zh": "我今天早上弄丟錢包，所以現在沒錢。"}, {"en": "Lisa [[learned]] to swim {{when she was five}}.", "zh": "Lisa 五歲時學會游泳。"}, {"en": "We [[visited]] Hualien {{two years ago}}.", "zh": "我們兩年前去過花蓮。"}, {"en": "He [[didn't come]] to school {{yesterday}} because he was sick.", "zh": "他昨天生病沒來上學。"}, {"en": "{{In 2019}}, my family [[moved]] to Taichung.", "zh": "2019 年我們家搬到台中。"}, {"en": "I have seen him yesterday.", "zh": "", "bad": true, "why": "yesterday 是明確過去時間 → I saw him yesterday."}, {"en": "She doesn't come to the party last night.", "zh": "", "bad": true, "why": "last night 是過去 → She didn't come to the party last night."}], "ck": [{"lv": 1, "q": "Kevin broke his arm two weeks ago.\n哪一個是過去時間的線索？", "o": {"A": "Kevin", "B": "broke", "C": "two weeks ago", "D": "arm"}, "a": "C", "why": "two weeks ago（兩週前）是明確的過去時間。"}, {"lv": 2, "q": "I ____ a great movie last night.", "o": {"A": "have watched", "B": "watched"}, "a": "B", "why": "last night 明確過去 → watched。"}, {"lv": 2, "q": "When my dad was young, he ____ in a bookstore.", "o": {"A": "worked", "B": "has worked"}, "a": "A", "why": "when my dad was young 是過去的時段。"}, {"lv": 3, "q": "Amy ____ her phone at school yesterday, and she still can't find it.", "o": {"A": "loses", "B": "lost", "C": "has lost", "D": "is losing"}, "a": "B", "why": "yesterday → 過去式 lost（有明確時間就不用 has lost）。"}, {"lv": 3, "q": "The museum ____ in 1965.", "o": {"A": "opens", "B": "has opened", "C": "opened", "D": "will open"}, "a": "C", "why": "in 1965 → 過去式。"}, {"lv": 3, "q": "Jack: Did you finish the report?\nLily: Yes, I ____ it two hours ago.", "o": {"A": "finish", "B": "finished", "C": "have finished", "D": "am finishing"}, "a": "B", "why": "two hours ago → 過去式。"}]}, "T4": {"sum": "過去某一個時刻「正在」做的事，用 was／were＋V-ing。", "rule": {"when": ["另一件事發生的那一刻正在做：I was reading when the phone rang.", "過去的某個時間點：at 9 p.m. last night、at this time yesterday", "while 連接兩件同時在進行的事", "故事裡描寫背景（It was raining…），或主句是過去時「發現他正在…」"], "form": "主詞＋was／were＋V-ing", "steps": ["找出「那一刻」：when＋過去式、at＋過去時間、while", "問自己：那一刻他「正在做」什麼？→ 用 was／were＋V-ing", "那個「突然插進來的短動作」用簡單過去式（the phone rang）"], "note": ["When the bell rang, we left the classroom.：鈴響「之後」才離開，是先後發生 → 兩個都用過去式", "整篇故事是過去式時，背景動作也要用過去進行式，不能突然用現在式"]}, "ex": [{"en": "I [[was taking]] a shower {{when}} the phone rang.", "zh": "電話響的時候我正在洗澡。"}, {"en": "{{At 9 p.m. last night}}, we [[were watching]] TV.", "zh": "昨晚九點我們正在看電視。"}, {"en": "{{While}} Mom [[was cooking]], Dad [[was cleaning]] the living room.", "zh": "媽媽在煮飯的時候，爸爸在打掃客廳。"}, {"en": "{{When}} the earthquake happened, the students [[were having]] a math test.", "zh": "地震發生時，學生正在考數學。"}, {"en": "It [[was raining]] hard, and the wind [[was blowing]].", "zh": "（故事背景）雨下得很大，風一直吹。"}, {"en": "{{When}} I got home, my sister [[was going]] out, so she asked me to join her.", "zh": "我回到家時姊姊正要出門，所以邀我一起去。"}, {"en": "{{When}} the bell rang, we [[left]] the classroom.", "zh": "鈴響之後我們才離開教室（先後發生 → 都用過去式）。"}, {"en": "When the teacher came in, we talked loudly.", "zh": "", "bad": true, "why": "老師進來那一刻我們「正在」講話 → we were talking loudly."}], "ck": [{"lv": 1, "q": "When the lights went out, I was reading a comic book.\n哪一個動作是「當時正在進行」的？", "o": {"A": "went out（燈熄了）", "B": "was reading（在看漫畫）"}, "a": "B", "why": "燈熄是突然發生的短動作，看漫畫是當時正在做的事。"}, {"lv": 1, "q": "At this time yesterday, I was sitting on a plane.\n哪一個是「過去某一刻」的線索？", "o": {"A": "At this time yesterday", "B": "sitting", "C": "on a plane"}, "a": "A", "why": "昨天的這個時候＝過去的某一刻。"}, {"lv": 2, "q": "What ____ you doing at 8 last night? I called you, but no one answered.", "o": {"A": "are", "B": "were"}, "a": "B", "why": "at 8 last night → 過去某一刻 → were doing。"}, {"lv": 2, "q": "When the bus came, I ____ for it in the rain.", "o": {"A": "waited", "B": "was waiting"}, "a": "B", "why": "公車來的那一刻我正在等。"}, {"lv": 2, "q": "When the movie ended, everyone ____ and went home.", "o": {"A": "stood up", "B": "was standing up"}, "a": "A", "why": "電影結束「之後」才站起來回家，是先後發生 → 過去式。"}, {"lv": 3, "q": "The phone rang while I ____ a bath.", "o": {"A": "take", "B": "took", "C": "was taking", "D": "have taken"}, "a": "C", "why": "while 後面是當時正在進行的事 → was taking。"}, {"lv": 3, "q": "When Mr. Lin walked into the classroom, the students ____ loudly.", "o": {"A": "talk", "B": "are talking", "C": "were talking", "D": "have talked"}, "a": "C", "why": "林老師走進來的那一刻，學生正在大聲講話。"}, {"lv": 3, "q": "Ann didn't hear the doorbell because she ____ to loud music.", "o": {"A": "listens", "B": "listened", "C": "was listening", "D": "has listened"}, "a": "C", "why": "門鈴響的那一刻她正在聽音樂，所以沒聽到。"}]}, "T5": {"sum": "從過去「延續到現在」，或到現在為止的經驗、還沒發生，用 have／has＋p.p.。", "rule": {"when": ["since＋過去時間點（since 2020、since he came here）", "for＋一段時間，而且到現在還在（for ten years 還在做）", "in the last／past few days、so far、until now", "還沒：haven't…yet；問做完了沒：Have you…yet?", "經驗：ever、never、twice、three times"], "form": "have／has＋過去分詞（p.p.）；否定 haven't／hasn't＋p.p.", "steps": ["問自己：這件事「延續到現在」或「到現在還沒」嗎？", "有沒有明確的過去時間（yesterday、ago、in 2019）？有 → 用過去式，不用完成式", "since 後面的子句用過去式：since he came to Taiwan"], "note": ["常見不規則 p.p.：be→been、see→seen、go→gone、eat→eaten、write→written、know→known、take→taken", "have been to＝去過（已回來）；have gone to＝去了（還沒回來）"]}, "ex": [{"en": "I [[have lived]] here {{since}} 2020.", "zh": "我從 2020 年就住在這裡（現在還住）。"}, {"en": "She [[has worked]] at this hospital {{for}} ten years.", "zh": "她在這家醫院工作十年了（現在還在）。"}, {"en": "It [[has been]] cold and rainy {{in the last few days}}.", "zh": "過去幾天一直又冷又下雨。"}, {"en": "I [[haven't seen]] my grandparents {{since}} I moved to Taipei.", "zh": "我搬到台北後就沒見過祖父母。"}, {"en": "[[Have]] you [[finished]] your homework {{yet}}?", "zh": "你功課寫完了嗎？"}, {"en": "I [[have never eaten]] stinky tofu.", "zh": "我從來沒吃過臭豆腐（經驗）。"}, {"en": "I live in Kaohsiung since 2018.", "zh": "", "bad": true, "why": "since 2018 表示延續到現在 → I have lived in Kaohsiung since 2018."}, {"en": "He has gone to Japan last year.", "zh": "", "bad": true, "why": "last year 是明確過去時間 → He went to Japan last year."}], "ck": [{"lv": 1, "q": "We have known each other for twelve years.\n哪一個是線索？", "o": {"A": "We", "B": "for twelve years", "C": "each other"}, "a": "B", "why": "for twelve years（到現在已經 12 年）。"}, {"lv": 1, "q": "I haven't heard from Tina since she left.\n這句的意思是？", "o": {"A": "我以前沒收到她的消息，現在有了", "B": "從她離開到現在，一直沒收到她的消息"}, "a": "B", "why": "現在完成式否定＋since：一直到現在都沒有。"}, {"lv": 2, "q": "My brother ____ in Canada since 2021.", "o": {"A": "has lived", "B": "lived"}, "a": "A", "why": "since 2021 → 延續到現在。"}, {"lv": 2, "q": "I ____ this book three times. It's my favorite.", "o": {"A": "have read", "B": "am reading"}, "a": "A", "why": "到現在讀過三次（經驗）。"}, {"lv": 2, "q": "How long ____ you known Mr. Chen?", "o": {"A": "have", "B": "did"}, "a": "A", "why": "How long… known 問的是到現在多久了 → have known。"}, {"lv": 3, "q": "Ms. Wang ____ English at this school for fifteen years, and she still loves her job.", "o": {"A": "teaches", "B": "taught", "C": "has taught", "D": "will teach"}, "a": "C", "why": "for fifteen years＋現在還在教 → has taught。"}, {"lv": 3, "q": "Don't tell me the answer! I ____ the puzzle yet.", "o": {"A": "don't finish", "B": "didn't finish", "C": "haven't finished", "D": "won't finish"}, "a": "C", "why": "yet＋到現在還沒 → haven't finished。"}, {"lv": 3, "q": "Since Paul moved to the city, he ____ back to his hometown only once.", "o": {"A": "goes", "B": "went", "C": "has been", "D": "is going"}, "a": "C", "why": "Since… → 到現在為止只回去過一次 → has been back。"}]}, "T6": {"sum": "最常考的陷阱：事情「已經結束」用過去式；「延續到現在」用現在完成式。", "rule": {"when": ["簡單過去式：已結束的事，有（或能指出）明確過去時間：yesterday、ago、in 2010、when I was…、before I went to high school", "現在完成式：延續到現在、到現在還沒、到現在的經驗；沒有說明確的時間點：since、for（到現在）、yet、ever"], "form": "過去式：V-ed／不規則｜現在完成：have／has＋p.p.", "steps": ["問 1：這件事現在還在繼續嗎？（還在 → 完成式）", "問 2：句子裡有明確的過去時間或已結束的時段嗎？（有 → 過去式）", "小心 for：for six years 不一定用完成式，如果那六年已經結束了，就用過去式"], "note": ["I have played the piano for six years.（現在還在彈）／I played the piano for six years before junior high.（已經不彈了）", "問「去過嗎」用完成式，回答具體哪一次用過去式：Have you ever met a star? — Yes, I met one last year."]}, "ex": [{"en": "I [[have played]] the piano {{for six years}}.", "zh": "我彈鋼琴六年了（現在還在彈）。"}, {"en": "I [[played]] the piano {{for six years}} {{before I went to junior high}}.", "zh": "我上國中之前彈了六年（後來停了）。"}, {"en": "She [[has been]] to Japan twice.", "zh": "她去過日本兩次（經驗，沒說何時）。"}, {"en": "She [[went]] to Japan {{last summer}}.", "zh": "她去年夏天去了日本（明確時間）。"}, {"en": "[[Have]] you ever [[met]] a movie star? — Yes, I [[met]] one in Taipei {{last year}}.", "zh": "你見過電影明星嗎？——見過，去年在台北見過一位。"}, {"en": "Before she became a singer, she has worked in a café.", "zh": "", "bad": true, "why": "成為歌手「之前」是已結束的過去 → she worked in a café."}], "ck": [{"lv": 1, "q": "He played soccer for three years in junior high.\n他現在還在國中踢足球嗎？", "o": {"A": "還在", "B": "沒有，那是已經結束的一段時間"}, "a": "B", "why": "played（過去式）＋in junior high → 已結束。"}, {"lv": 2, "q": "I ____ Japanese for two years, and I'm still learning it.", "o": {"A": "studied", "B": "have studied"}, "a": "B", "why": "still learning → 延續到現在。"}, {"lv": 2, "q": "I ____ Japanese for two years when I lived in Osaka.", "o": {"A": "studied", "B": "have studied"}, "a": "A", "why": "when I lived in Osaka 是已結束的過去時段。"}, {"lv": 2, "q": "____ you ever ____ a snake?", "o": {"A": "Have／seen", "B": "Did／saw"}, "a": "A", "why": "ever 問經驗 → Have you ever seen…?"}, {"lv": 3, "q": "Grandpa ____ in a factory for 30 years before he stopped working in 2015.", "o": {"A": "works", "B": "worked", "C": "has worked", "D": "is working"}, "a": "B", "why": "2015 年就停了，30 年已結束 → worked。"}, {"lv": 3, "q": "Lucy ____ in this town since she was seven.", "o": {"A": "lives", "B": "lived", "C": "has lived", "D": "is living"}, "a": "C", "why": "since she was seven → 延續到現在。"}, {"lv": 3, "q": "My parents ____ married in 2005.", "o": {"A": "get", "B": "got", "C": "have got", "D": "have gotten"}, "a": "B", "why": "in 2005 是明確過去時間 → got married。"}]}, "T7": {"sum": "兩件都是過去的事，比較早發生的那件用 had＋p.p.。", "rule": {"when": ["過去有兩件事，要強調哪件先發生", "線索：when／by the time＋過去式、before、long before、already"], "form": "had＋過去分詞（p.p.）", "steps": ["先找出句子裡的「過去時間點」（例如 when I got there）", "問：另一件事是不是在那之前就已經發生了？是 → had＋p.p."], "note": ["會考十年只考過 1 題（在克漏字裡），看得懂就好"]}, "ex": [{"en": "{{When I got to the station}}, the train [[had left]].", "zh": "我到車站時，火車已經開走了（先開走，我後到）。"}, {"en": "She [[had lived]] in Paris {{before}} she moved to London.", "zh": "她搬到倫敦之前住過巴黎。"}, {"en": "I didn't watch the movie because I [[had seen]] it before.", "zh": "我沒看那部電影，因為之前看過了。"}, {"en": "When we arrived, the party has started.", "zh": "", "bad": true, "why": "到達是過去，派對在那之前就開始了 → had started."}], "ck": [{"lv": 2, "q": "When we got to the theater, the movie ____.", "o": {"A": "had started", "B": "has started"}, "a": "A", "why": "抵達（過去）之前電影就開始了 → had started。"}, {"lv": 2, "q": "By the time Dad came home, we ____ dinner.", "o": {"A": "had finished", "B": "have finished"}, "a": "A", "why": "爸爸回到家之前我們已經吃完 → had finished。"}, {"lv": 3, "q": "Ben ____ in love with Amy long before he told her.", "o": {"A": "falls", "B": "has fallen", "C": "had fallen", "D": "is falling"}, "a": "C", "why": "告訴她（過去）之前很久就愛上了 → had fallen。"}, {"lv": 3, "q": "I couldn't get into my house because I ____ my keys at the office.", "o": {"A": "leave", "B": "have left", "C": "had left", "D": "am leaving"}, "a": "C", "why": "進不了門（過去）之前，鑰匙就留在辦公室了。"}]}, "T8": {"sum": "before、after、when、until、if 引導的子句說未來的事時，子句用「現在式」，不能用 will。", "rule": {"when": ["時間子句：before、after、when、until、as soon as", "條件子句：if", "而且整句說的是「未來」的事"], "form": "主要子句：will＋原形（或祈使句、can…）｜子句：現在式", "steps": ["圈出 before／after／when／until／if", "這個子句說的是未來嗎？是 → 子句用現在式（comes、gets、rains）", "另一半（主要子句）是未來 → 用 will、或祈使句"], "note": ["When 當問句（When will he come?）或 know／ask 後面的名詞子句（I don't know when he will come）時，不適用這條規則，照常用 will", "If 子句用現在式，主要子句用 will：If we play games, there will be more fun."]}, "ex": [{"en": "I'll call you {{when}} I [[get]] home.", "zh": "我到家時會打給你。"}, {"en": "{{If}} it [[rains]] tomorrow, we'll stay home.", "zh": "如果明天下雨，我們就待在家。"}, {"en": "Please wait here {{until}} I [[come]] back.", "zh": "請在這裡等到我回來。"}, {"en": "Turn off the lights {{before}} you [[leave]].", "zh": "離開前把燈關掉。"}, {"en": "{{If}} we [[play]] some games in class, there [[will be]] more fun.", "zh": "如果上課玩一些遊戲，會更有趣（子句現在式、主句 will）。"}, {"en": "I don't know {{when}} he [[will come]].", "zh": "我不知道他什麼時候會來（名詞子句，照常用 will）。"}, {"en": "I'll tell him after he will come back.", "zh": "", "bad": true, "why": "after 子句說未來要用現在式 → after he comes back."}], "ck": [{"lv": 1, "q": "Wait here until the rain stops.\n為什麼用 stops，而不是 will stop？", "o": {"A": "until 子句說未來的事要用現在式", "B": "因為雨已經停了"}, "a": "A", "why": "雨還沒停，是未來的事，但 until 子句用現在式。"}, {"lv": 2, "q": "I'll give her the book when she ____ tomorrow.", "o": {"A": "comes", "B": "will come"}, "a": "A", "why": "when 時間子句 → 現在式。"}, {"lv": 2, "q": "If you ____ hungry later, there's some bread on the table.", "o": {"A": "are", "B": "will be"}, "a": "A", "why": "if 條件子句 → 現在式。"}, {"lv": 3, "q": "Can you stay with my kids until I ____ back from the store?", "o": {"A": "come", "B": "will come", "C": "came", "D": "am coming"}, "a": "A", "why": "until 子句說未來 → 現在式 come。"}, {"lv": 3, "q": "Before you ____ the room, please close the windows.", "o": {"A": "leave", "B": "will leave", "C": "left", "D": "leaving"}, "a": "A", "why": "Before 子句說未來 → 現在式 leave。"}, {"lv": 3, "q": "If it ____ sunny this Saturday, we'll go to the beach.", "o": {"A": "is", "B": "will be", "C": "was", "D": "has been"}, "a": "A", "why": "if 子句 → 現在式 is。"}, {"lv": 3, "q": "I'm not sure when the next bus ____.", "o": {"A": "comes", "B": "will come", "C": "came", "D": "come"}, "a": "B", "why": "這裡的 when 子句是 sure 的受詞（名詞子句），不是時間子句 → 照常用 will。"}]}, "T9": {"sum": "used to＋原形＝「以前常常」，現在已經不是這樣了。", "rule": {"when": ["回憶過去的習慣或狀態：when I was little、in my school days、those days", "暗示「現在不再」：I used to walk to school, but now I take the MRT."], "form": "used to＋原形動詞；否定 didn't use to＋原形", "steps": ["句子在說「以前常常／以前是」嗎？", "是 → used to＋原形（不是 V-ing）"], "note": ["延伸（高中常考）：be used to＋V-ing＝習慣於（I'm used to getting up early.），和 used to＋原形意思不同", "There used to be…＝以前這裡有…"]}, "ex": [{"en": "I [[used to walk]] to school, but now I take the MRT.", "zh": "我以前走路上學，現在搭捷運。"}, {"en": "{{When I was little}}, my grandpa [[used to tell]] me stories every night.", "zh": "我小時候爺爺每晚都會講故事給我聽。"}, {"en": "There [[used to be]] a big tree here.", "zh": "這裡以前有一棵大樹。"}, {"en": "She [[didn't use to like]] vegetables.", "zh": "她以前不喜歡吃青菜。"}, {"en": "Now I often think of {{those days}} with my cat. She [[used to sleep]] on my bed.", "zh": "我常想起和貓咪的那段日子，她以前都睡在我床上。"}, {"en": "I used to playing the guitar.", "zh": "", "bad": true, "why": "used to 後面接原形 → I used to play the guitar."}], "ck": [{"lv": 1, "q": "My dad used to smoke, but he stopped ten years ago.\n這句的意思是？", "o": {"A": "爸爸現在還在抽菸", "B": "爸爸以前抽菸，現在不抽了"}, "a": "B", "why": "used to＝以前常常，現在不再。"}, {"lv": 2, "q": "When I was a kid, I ____ go fishing with my uncle every summer.", "o": {"A": "used to", "B": "am used to"}, "a": "A", "why": "小時候的習慣 → used to＋原形。"}, {"lv": 2, "q": "Jenny ____ be shy, but now she talks to everyone.", "o": {"A": "used to", "B": "uses to"}, "a": "A", "why": "沒有 uses to 這種說法。"}, {"lv": 3, "q": "This park ____ a parking lot ten years ago.", "o": {"A": "used to be", "B": "is used to be", "C": "uses to be", "D": "used to being"}, "a": "A", "why": "以前是停車場 → used to be。"}, {"lv": 3, "q": "When we lived in the country, we ____ up early to feed the chickens.", "o": {"A": "get", "B": "have got", "C": "used to get", "D": "are getting"}, "a": "C", "why": "住在鄉下時的習慣（現在沒住了）→ used to get。"}, {"lv": 3, "q": "My grandma ____ beautiful clothes for me when I was small.", "o": {"A": "makes", "B": "used to make", "C": "has made", "D": "is making"}, "a": "B", "why": "when I was small → 過去的習慣。"}]}, "T10": {"sum": "站在過去的時間點說「之後會發生的事」，用 would＋原形（will 的過去式）。", "rule": {"when": ["主要動詞是過去式：thought、said、knew、hoped、was sure、No one thought…", "後面說的是「當時以後」的事"], "form": "過去式動詞＋(that)＋主詞＋would＋原形", "steps": ["主要動詞是過去式嗎（thought／said／knew／was sure）？", "後面那件事在「當時」是還沒發生的嗎？是 → would，不是 will"], "note": ["常見情境：當時以為會…結果沒有（We were sure he would win, but he lost.）"]}, "ex": [{"en": "I {{thought}} it [[would rain]], so I took an umbrella.", "zh": "我以為會下雨，所以帶了傘。"}, {"en": "He {{said}} he [[would call]] me, but he didn't.", "zh": "他說會打給我，結果沒有。"}, {"en": "{{No one knew}} the little boy [[would become]] a famous singer.", "zh": "當時沒人知道那個小男孩會成為名歌手。"}, {"en": "We {{were sure}} our team [[would win]], so the loss surprised us.", "zh": "我們很確定會贏，所以輸了讓我們很意外。"}, {"en": "She said she will come, but she didn't.", "zh": "", "bad": true, "why": "said 是過去式 → she would come."}], "ck": [{"lv": 2, "q": "Amy promised she ____ help me, but she forgot.", "o": {"A": "would", "B": "will"}, "a": "A", "why": "promised 是過去 → would。"}, {"lv": 2, "q": "I knew you ____ like this gift.", "o": {"A": "would", "B": "will"}, "a": "A", "why": "knew 是過去 → would like。"}, {"lv": 3, "q": "Nobody thought the small shop ____ so successful one day.", "o": {"A": "becomes", "B": "became", "C": "would become", "D": "has become"}, "a": "C", "why": "當時（thought）沒人想到以後會 → would become。"}, {"lv": 3, "q": "My parents hoped I ____ a doctor, but I became a teacher.", "o": {"A": "will be", "B": "would be", "C": "am", "D": "have been"}, "a": "B", "why": "hoped 是過去 → would be。"}, {"lv": 3, "q": "Lisa was sure that she ____ the test, so she didn't study muc function blank(){return {attempts:[],srs:{},graduated:{},tests:[],packs:[],learn:{},created:new Date().toISOString()}}

/* ---------- dates ---------- */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function diffDays(a,b){const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)}
const INTERVALS=[1,3,7,14,30];
/* ---------- bank helpers ---------- */
const ITEMS={};for(const y in BANK.years){for(const it of BANK.years[y].items)ITEMS[it.id]=it}
const TAGS=BANK.tags;
const SK=BANK.skills,SMAP=BANK.smap,LEARN=BANK.learn;
function mk(s){return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="hv">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="hc">$1</span>')}
function star(id){const n=SK[id].n;return n>=4?"★":n>=2?"☆":"—"}
function skillItems(id){return Object.keys(SMAP).filter(q=>SMAP[q].includes(id)&&ITEMS[q])}
function skChip(id){if(!SK[id])return "";return LEARN[id]?`<span class="skchip link" onclick="goSkill('${id}')">${esc(SK[id].name)} ›</span>`:`<span class="skchip">${esc(SK[id].name)}</span>`}
function weakSkills(){const L=latest();const c={};for(const q in L){if(!ITEMS[q]||!SMAP[q])continue;const a=L[q];if(a.ok&&!a.g)continue;for(const s of SMAP[q])(c[s]=c[s]||[]).push(q)}
  return Object.entries(c).map(([s,qs])=>({s,qs,n:qs.length})).sort((a,b)=>b.n-a.n||SK[b.s].n-SK[a.s].n)}
function getQ(id){if(ITEMS[id])return ITEMS[id];for(const p of D.packs){const q=p.questions.find(q=>q.id===id);if(q)return q}return null}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stemHTML(s){return s.replace(/_{3,}/g,'<span class="blank">　</span>')}
function pct(x){return x==null||isNaN(x)?"—":Math.round(x*100)+"%"}
function num(x){return x==null?"—":x.toFixed(1)+"%"}
function avg(a){a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function tagPill(t){const d=TAGS[t];if(!d)return `<span class="pill">${esc(t)}</span>`;return `<span class="pill ${d.dom}">${esc(d.zh)}</span>`}
function domOf(it){return TAGS[it.tags[0]]?TAGS[it.tags[0]].dom:"r"}
const DOMZH={v:"字彙",g:"文法",r:"閱讀"};
/* ---------- recording ---------- */
function record(id,c,ok,g,mode){D.attempts.push({q:id,c:c,ok:ok,g:!!g,m:mode,t:new Date().toISOString()});srsUpdate(id,ok,g,mode)}
function srsUpdate(id,ok,g,mode){
  const td=today();const cur=D.srs[id];
  if(!ok||g){D.srs[id]={box:1,due:addDays(td,1),last:td};delete D.graduated[id];return}
  if(cur&&(mode==="review"||diffDays(cur.due,td)>=0)){
    const nb=cur.box+1;
    if(nb>INTERVALS.length){delete D.srs[id];D.graduated[id]=td}
    else D.srs[id]={box:nb,due:addDays(td,INTERVALS[nb-1]),last:td};
  }
}
function dueIds(){const td=today();return Object.entries(D.srs).filter(([id,s])=>diffDays(s.due,td)>=0&&getQ(id)).sort((a,b)=>a[1].due<b[1].due?-1:1).map(x=>x[0])}
function latest(){const m={};for(const a of D.attempts)m[a.q]=a;return m}
/* ---------- router ---------- */

function imgURL(k){return IMGDIR+k+".jpg"}

/* ---------- home ---------- */

    h+=`<tr><td style="vertical-align:middle"><b>${y}</b> <span class="small mute">${N} 題</span></td><td class="small" style="vertical-align:middle">${st}</td><td class="n">${btns}</td></tr>`}

    h+=`<button onclick="startPractice('${t}')"><span>${tagPill(t)} <span class="small mute">${ids.length} 題</span></span><span class="small ${seen.length?"":"mute"}">${seen.length?`${ok}/${seen.length}`:"未做"}</span></button>`}
  h+=`</div></div><p class="note" style="text-align:center">題目：心測中心公開的國中教育會考試題　｜　解析、概念標籤：自擬　｜　${APPVER}</p>`;

function newTest(y){const t={id:"T"+Date.now().toString(36),year:y,start:new Date().toISOString(),answers:{},submitted:null};D.tests.push(t);save();contTest(y)}
function contTest(y){const t=activeTest(y);const ids=BANK.years[y].items.map(i=>i.id);let i=ids.findIndex(id=>!t.answers[id]);if(i<0)i=ids.length-1;Q={mode:"test",title:y+" 年全卷",list:ids,i:i,test:t.id};go("quiz")}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startPractice(tag){const L=latest();const all=Object.values(ITEMS).filter(it=>it.tags.includes(tag)).map(it=>it.id);
  const fresh=shuffle(all.filter(i=>!L[i])),bad=shuffle(all.filter(i=>L[i]&&(!L[i].ok||L[i].g))),good=shuffle(all.filter(i=>L[i]&&L[i].ok&&!L[i].g));

let SEL=null,GUESS=false;

function passageHTML(it){
